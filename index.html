<!DOCTYPE html>
<html lang="ko" data-theme="limbus">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG 중앙 코인 대결 시뮬레이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Oswald:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root[data-theme="limbus"] {
      --font-title: 'Oswald', 'Noto Sans KR', sans-serif;
      --font-body: 'Noto Sans KR', sans-serif;
      --bg-color: #050507;
      --card-bg: linear-gradient(180deg, #181412 0%, #0d0b0a 100%);
      --sub-card-bg: #090807;
      --border-style: 2px solid #8e2a18;
      --card-box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 12px rgba(142, 42, 24, 0.4);
      --primary-color: #ff3322;
      --accent-color: #e6a100;
      --text-color: #dcd8d0;
      --title-color: #f0a800;
      --title-shadow: 0 0 8px rgba(240, 168, 0, 0.6), 2px 2px 0px #500000;
      --btn-bg: linear-gradient(180deg, #991c0e 0%, #520902 100%);
      --btn-border: 2px solid #e6a100;
      --spark-color-1: #e6a100;
      --spark-color-2: #ff3322;
      --glow-filter: drop-shadow(0 0 12px rgba(230, 161, 0, 0.9));
      --badge-clip: polygon(15% 0%, 85% 0%, 100% 50%, 85% 100%, 15% 100%, 0% 50%);
    }

    :root[data-theme="ruina"] {
      --font-title: 'Cinzel', 'Noto Sans KR', serif;
      --font-body: 'Cinzel', 'Noto Sans KR', serif;
      --bg-color: #03060a;
      --card-bg: linear-gradient(180deg, #0a1322 0%, #040810 100%);
      --sub-card-bg: #020509;
      --border-style: 2px double #c59f52;
      --card-box-shadow: inset 0 0 20px rgba(0,0,0,0.95), 0 0 15px rgba(197, 159, 82, 0.3);
      --primary-color: #38ef7d;
      --accent-color: #38e8e5;
      --text-color: #eaeff5;
      --title-color: #38e8e5;
      --title-shadow: 0 0 10px rgba(56, 232, 229, 0.7), 0 0 20px rgba(197, 159, 82, 0.5);
      --btn-bg: linear-gradient(180deg, #0e2b47 0%, #051322 100%);
      --btn-border: 2px double #c59f52;
      --spark-color-1: #38e8e5;
      --spark-color-2: #c59f52;
      --glow-filter: drop-shadow(0 0 14px rgba(56, 232, 229, 0.9));
      --badge-clip: none;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-color);
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
      margin: 0; padding: 1.5rem 2rem; overflow-x: hidden; transition: background-color 0.3s, color 0.3s;
    }
    .main-wrapper { width: 100%; max-width: 1800px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.8rem; border-bottom: var(--border-style); }
    h1 { font-family: var(--font-title); font-size: 2.1rem; margin: 0; color: var(--title-color); letter-spacing: 3px; text-transform: uppercase; text-shadow: var(--title-shadow); }
    .theme-select-box { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 0.4rem 0.9rem; border: var(--border-style); box-shadow: var(--card-box-shadow); }
    .theme-select-box select, input, select { background: var(--sub-card-bg); color: var(--text-color); border: var(--border-style); font-family: var(--font-body); }
    
    .battle-layout { display: grid; grid-template-columns: 420px 1fr 420px; gap: 1.8rem; align-items: start; }
    @media (max-width: 1200px) { .battle-layout { grid-template-columns: 1fr; } }

    .side-box { background: var(--card-bg); padding: 1.4rem; border: var(--border-style); box-shadow: var(--card-box-shadow); position: relative; }
    .side-title { font-family: var(--font-title); font-size: 1.4rem; font-weight: bold; margin-bottom: 1rem; text-align: center; letter-spacing: 2px; text-transform: uppercase; }
    .player .side-title { color: #38ef7d; } .enemy .side-title { color: #ff3322; }

    .slot-container, .skill-config-box { width: 100%; background: var(--sub-card-bg); border: var(--border-style); padding: 0.8rem; margin-bottom: 0.9rem; }
    .slot-header, .skill-config-title { font-size: 0.75rem; color: #888892; margin-bottom: 0.5rem; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
    .slots-wrapper { display: flex; justify-content: center; gap: 8px; min-height: 44px; align-items: center; }

    .def-toggle-btn, .ego-toggle-btn { padding: 0.4rem 0.6rem; font-size: 0.75rem; font-weight: bold; cursor: pointer; border: 1px solid; transition: all 0.2s; }
    .def-toggle-btn { background: #332211; color: #ffaa00; border-color: #aa6600; }
    .def-toggle-btn.active { background: #aa6600; color: #fff; }
    .ego-toggle-btn { background: #2b0c12; color: #ff4466; border-color: #aa1133; position: relative; }
    .ego-toggle-btn.active { background: #aa1133; color: #fff; box-shadow: 0 0 10px #ff3355; }
    .ego-progress { position: absolute; bottom: 0; left: 0; height: 3px; background: #ff3355; width: 0%; }

    .next-box, .preset-manager { margin-top: 0.6rem; padding-top: 0.5rem; border-top: 1px dashed rgba(255,255,255,0.15); font-size: 0.75rem; }
    .matchup-indicator { margin-top: 0.7rem; padding: 0.45rem; font-size: 0.8rem; font-weight: bold; text-align: center; border: var(--border-style); }
    .matchup-indicator.balanced { color: var(--accent-color); background: rgba(230, 161, 0, 0.08); }

    .skill-badge { padding: 0.5rem 0.9rem; font-weight: bold; font-size: 0.8rem; background: #141418; color: #fff; border: 1px solid #444; cursor: pointer; clip-path: var(--badge-clip); display: inline-flex; align-items: center; justify-content: center; }
    .skill-badge.s1 { background: #0c182b; color: #70a1ff; } .skill-badge.s2 { background: #121333; color: #9aa8df; }
    .skill-badge.s3 { background: #300a12; color: #ff94a0; } .skill-badge.ego { background: #3b0514; color: #ff3366; box-shadow: 0 0 8px rgba(255, 51, 102, 0.5); }
    .skill-badge.selected { border-color: var(--accent-color) !important; box-shadow: 0 0 12px var(--accent-color); transform: scale(1.06); }
    .skill-badge.next-badge { cursor: default; font-size: 0.7rem; padding: 0.25rem 0.6rem; }

    .config-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .config-card { background: var(--card-bg); border: var(--border-style); padding: 0.5rem 0.3rem; text-align: center; }
    .config-card label { font-size: 0.65rem; color: #999; display: block; margin: 2px 0; }
    .config-card input, .config-card select { font-size: 0.750rem !important; padding: 0.25rem !important; text-align: center; width: 100%; }

    .preset-btn-group { display: flex; gap: 6px; }
    .preset-btn { flex: 1; padding: 0.4rem; font-size: 0.72rem; background: #181820; color: #ccc; border: 1px solid #333; cursor: pointer; }

    .coin-preview-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 0.6rem; }
    .coin-preview-item { font-size: 0.6rem; padding: 0.3rem; background: var(--card-bg); color: var(--accent-color); text-align: center; border: var(--border-style); }

    .control-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; color: #bbb; }
    input, select { width: 100%; padding: 0.5rem; color: #fff; font-size: 0.85rem; }

    .center-stage { position: relative; background: var(--card-bg); border: var(--border-style); padding: 1.8rem; box-shadow: var(--card-box-shadow); text-align: center; min-height: 520px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    button.clash-btn { width: 100%; padding: 1.1rem; font-size: 1.3rem; font-weight: bold; color: #fff; font-family: var(--font-title); letter-spacing: 3px; background: var(--btn-bg); border: var(--btn-border); cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    button.clash-btn:disabled { background: #1c1c24 !important; color: #555; cursor: not-allowed; }

    .center-arena-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.2rem; z-index: 2; }
    .side-result-box { background: var(--sub-card-bg); border: var(--border-style); padding: 1.2rem; min-height: 240px; }

    /* HP바 및 흐트러짐 선 레이아웃 (HP바 내부에 완벽히 맞춤) */
    .hp-container { margin-bottom: 0.8rem; background: #111; border: 1px solid #444; padding: 4px; position: relative; }
    .hp-bar-bg { width: 100%; height: 14px; background: #222; position: relative; overflow: hidden; }
    .hp-bar-fill { height: 100%; width: 100%; background: #38ef7d; transition: width 0.3s; }
    .hp-bar-fill.enemy-hp { background: #ff3322; }
    .shield-bar-fill { position: absolute; top: 0; left: 0; height: 100%; background: #38e8e5; opacity: 0.75; width: 0%; }
    
    .stagger-lines-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }
    .stagger-line {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: #ffd700;
      box-shadow: 0 0 6px #ffaa00;
    }
    .stagger-line.hidden { display: none !important; }

    .hp-text { font-size: 0.75rem; font-weight: bold; color: #fff; margin-top: 2px; }
    .power-score-badge { font-family: var(--font-title); font-size: 1.3rem; font-weight: bold; color: var(--accent-color); margin-top: 4px; }
    .coins-wrapper { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 0.8rem; min-height: 70px; align-items: center; }

    .stagger-img {
      max-width: 180px;
      max-height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px #ffaa00);
      animation: staggerPulse 0.8s infinite alternate;
    }
    @keyframes staggerPulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    .coin { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; background-size: contain; background-repeat: no-repeat; background-position: center; position: relative; }
    .coin.flipping { animation: coinFlip 0.3s infinite linear; background-image: url('images/coin-heads.png'); }
    .coin.heads { background-image: url('images/coin-heads.png'); color: transparent; }
    .coin.tails { background-image: url('images/coin-tails.png'); color: transparent; }
    .coin.win-glow { background-image: url('images/coin-win.png') !important; filter: var(--glow-filter); }
    .coin.broken-heads, .coin.broken-tails { opacity: 0.6; transform: scale(0.85); color: transparent; }
    @keyframes coinFlip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
    .coin-sub { position: absolute; bottom: -16px; font-size: 0.6rem; color: #aaa; background: rgba(0,0,0,0.85); padding: 1px 4px; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-bar">
      <h1>TRPG COIN CLASH SIMULATOR</h1>
      <div class="theme-select-box">
        <label for="theme-select">THEME:</label>
        <select id="theme-select" onchange="changeTheme(this.value)">
          <option value="limbus">LIMBUS COMPANY</option>
          <option value="ruina">LIBRARY OF RUINA</option>
        </select>
      </div>
    </div>

    <div class="battle-layout">
      <div class="side-box player" id="box-p"></div>
      
      <div class="center-stage" id="center-stage">
        <div id="spark-layer"></div>
        <div>
          <button class="clash-btn" id="clash-btn" onclick="startMatch()">START CLASH</button>
          <div id="result-box-container" style="margin-top: 1.2rem;">
            <div id="clash-round-badge" style="display:none;" class="power-score-badge">ROUND 1</div>
            <div id="clash-status-text" style="color: #888; font-size: 1.05rem;">좌우 설정창에서 스킬을 선택한 후 합을 진행하세요.</div>
            <div class="center-arena-grid">
              <div class="side-result-box">
                <div class="hp-container">
                  <div class="hp-bar-bg">
                    <div class="hp-bar-fill" id="p-hp-bar" style="width:100%;"></div>
                    <div class="shield-bar-fill" id="p-shield-bar" style="width:0%;"></div>
                    <div class="stagger-lines-layer" id="p-stagger-lines-layer"></div>
                  </div>
                  <div class="hp-text" id="p-hp-text">HP: 100 / 100</div>
                </div>
                <div id="p-result-skill-tag"><span class="skill-badge s1">아군 스킬</span></div>
                <div id="p-result-count-text" style="font-size: 0.85rem; color: #aaa;">-</div>
                <div id="p-power-score" class="power-score-badge">-</div>
                <div class="coins-wrapper" id="p-coins-stage"></div>
              </div>
              <div class="side-result-box">
                <div class="hp-container">
                  <div class="hp-bar-bg">
                    <div class="hp-bar-fill enemy-hp" id="e-hp-bar" style="width:100%;"></div>
                    <div class="shield-bar-fill" id="e-shield-bar" style="width:0%;"></div>
                    <div class="stagger-lines-layer" id="e-stagger-lines-layer"></div>
                  </div>
                  <div class="hp-text" id="e-hp-text">HP: 100 / 100</div>
                </div>
                <div id="e-result-skill-tag"><span class="skill-badge s1">적군 스킬</span></div>
                <div id="e-result-count-text" style="font-size: 0.85rem; color: #aaa;">-</div>
                <div id="e-power-score" class="power-score-badge">-</div>
                <div class="coins-wrapper" id="e-coins-stage"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="side-box enemy" id="box-e"></div>
    </div>
  </div>

  <script>
    const sfx = {
      spin: new Audio('sounds/coin-spin.mp3'), heads: new Audio('sounds/coin-heads.mp3'),
      tails: new Audio('sounds/coin-tails.mp3'), break: new Audio('sounds/coin-break.mp3'),
      hit: new Audio('sounds/hit.mp3'), shield: new Audio('sounds/shield.mp3')
    };
    const playSFX = k => sfx[k] && sfx[k].cloneNode().play().catch(() => {});

    let state = {
      p: { pool: [], slots: [1, 2], next: 1, selIdx: 0, shield: 0, staggerLevel: 0, nextStagger: false, staggerValues: [70, 40, 20], timer: null },
      e: { pool: [], slots: [1, 2], next: 1, selIdx: 0, shield: 0, staggerLevel: 0, nextStagger: false, staggerValues: [70, 40, 20], timer: null },
      round: 1, pRem: 0, eRem: 0
    };
    const baseCycle = [1, 1, 1, 2, 2, 3];

    function renderSideBox(isP) {
      const id = isP ? 'p' : 'e';
      const title = isP ? 'PLAYER' : 'ENEMY';
      const defaultEgo = isP ? '홍염살' : '여우비';
      return `
        <div class="side-title">${title}</div>
        <div class="slot-container">
          <div class="slot-header">보유 스킬 슬롯</div>
          <div class="slots-wrapper">
            <div id="${id}-slots-display" style="display:flex; gap:6px;"></div>
            <button class="def-toggle-btn" id="${id}-def-btn" onclick="toggleDef('${id}')">수비</button>
            <button class="ego-toggle-btn" id="${id}-ego-btn" onmousedown="startEgo('${id}')" onmouseup="cancelEgo('${id}')" onmouseleave="cancelEgo('${id}')">
              E.G.O (1초 꾹)<div class="ego-progress" id="${id}-ego-progress"></div>
            </button>
          </div>
          <div class="next-box" id="${id}-next-display"><span>[NEXT]:</span></div>
          <div class="matchup-indicator balanced" id="${id}-matchup">상성 분석 중...</div>
        </div>
        <div class="skill-config-box">
          <div class="skill-config-title">스킬 옵션 설정</div>
          <div class="config-grid">
            ${[1, 2, 3].map(n => `
              <div class="config-card">
                <label>${n}스킬 명</label><input type="text" id="${id}-s${n}-name" value="${n}스킬" onchange="renderSlots()">
                <label>기본</label><input type="number" id="${id}-s${n}-base" value="${n+2}" onchange="validate(); renderSlots()">
                <label>코인위력</label><input type="number" id="${id}-s${n}-coinpower" value="4" onchange="validate(); renderSlots()">
                <label>코인수</label><input type="number" id="${id}-s${n}-coins" value="${n}" min="1" max="9" onchange="validate(); renderSlots()">
              </div>
            `).join('')}
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px;">
            <div class="config-card">
              <label style="color:#ffd166;">수비 스킬</label>
              <select id="${id}-s4-type" onchange="renderSlots()"><option value="guard">방어</option><option value="evade">회피</option><option value="counter">반격</option></select>
              <label>기본/코인/수</label>
              <div style="display:flex; gap:2px;"><input type="number" id="${id}-s4-base" value="10"><input type="number" id="${id}-s4-coinpower" value="4"><input type="number" id="${id}-s4-coins" value="1"></div>
            </div>
            <div class="config-card" style="border-color:#aa1133;">
              <label style="color:#ff3366;">E.G.O</label>
              <input type="text" id="${id}-ego-name" value="${defaultEgo}">
              <div style="display:flex; gap:2px; margin-top:2px;"><input type="number" id="${id}-ego-base" value="15"><input type="number" id="${id}-ego-coinpower" value="6"><input type="number" id="${id}-ego-coins" value="2"></div>
            </div>
          </div>
        </div>
        <div class="skill-config-box" style="border-color:#e6a100;">
          <div class="skill-config-title" style="color:#e6a100;">금빛 흐트러짐 선 설정 (%)</div>
          <div id="${id}-stagger-inputs-container" style="display:flex; flex-direction:column; gap:4px;"></div>
          <div style="display:flex; gap:6px; margin-top:6px;">
            <button class="preset-btn" onclick="addStaggerInput('${id}')">+ 선 추가</button>
            <button class="preset-btn" onclick="removeStaggerInput('${id}')">- 선 삭제</button>
          </div>
        </div>
        <div class="control-row">
          <div><label>최대 체력</label><input type="number" id="${id}-max-hp" value="100" onchange="updateHp()"></div>
          <div><label>현재 체력</label><input type="number" id="${id}-hp" value="100" onchange="updateHp()"></div>
        </div>
        <div><label>정신력 (-45 ~ 45)</label><input type="number" id="${id}-sanity" value="0" min="-45" max="45" onchange="updateInfo()"></div>
        <div class="coin-preview-item" id="${id}-info" style="margin-top:0.4rem; width:100%;">앞면 확률: 50%</div>
      `;
    }

    document.getElementById('box-p').innerHTML = renderSideBox('p');
    document.getElementById('box-e').innerHTML = renderSideBox('e');

    function renderStaggerInputs(id) {
      const container = document.getElementById(`${id}-stagger-inputs-container`);
      container.innerHTML = state[id].staggerValues.map((val, idx) => `
        <div style="display:flex; align-items:center; gap:6px;">
          <label style="font-size:0.7rem; width:40px;">선 ${idx+1}</label>
          <input type="number" value="${val}" min="0" max="100" onchange="updateStaggerValue('${id}', ${idx}, this.value)">
        </div>
      `).join('');
      updateHp();
    }

    function addStaggerInput(id) {
      state[id].staggerValues.push(50);
      renderStaggerInputs(id);
    }

    function removeStaggerInput(id) {
      if (state[id].staggerValues.length > 0) {
        state[id].staggerValues.pop();
        renderStaggerInputs(id);
      }
    }

    function updateStaggerValue(id, idx, val) {
      state[id].staggerValues[idx] = parseFloat(val) || 0;
      updateHp();
    }

    renderStaggerInputs('p');
    renderStaggerInputs('e');

    function changeTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('trpg_sim_theme', theme);
    }

    function init() {
      const theme = localStorage.getItem('trpg_sim_theme') || 'limbus';
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('theme-select').value = theme;
      state.p.next = drawNext('p');
      state.e.next = drawNext('e');
      renderSlots();
    }

    function drawNext(id) {
      let pool = state[id].pool;
      if (!pool.length) pool = [...baseCycle];
      return pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    }

    function getVal(id, key) { return parseInt(document.getElementById(`${id}-${key}`)?.value) || 0; }
    function getString(id, key) { return document.getElementById(`${id}-${key}`)?.value || ''; }

    function toggleDef(id) {
      if (state[id].staggerLevel > 0) return;
      let slots = state[id].slots, btn = document.getElementById(`${id}-def-btn`);
      if (slots[1] === 5) return;
      slots[1] = slots[1] === 4 ? (btn.classList.remove('active'), 2) : (btn.classList.add('active'), 4);
      document.getElementById(`${id}-ego-btn`).classList.remove('active');
      renderSlots();
    }

    function startEgo(id) {
      if (state[id].staggerLevel > 0) return;
      let prog = document.getElementById(`${id}-ego-progress`), start = Date.now();
      state[id].timer = setInterval(() => {
        let pct = Math.min(100, ((Date.now() - start) / 1000) * 100);
        prog.style.width = `${pct}%`;
        if (pct >= 100) {
          clearInterval(state[id].timer);
          prog.style.width = '0%';
          let slots = state[id].slots, btn = document.getElementById(`${id}-ego-btn`);
          slots[1] = slots[1] === 5 ? (btn.classList.remove('active'), 2) : (btn.classList.add('active'), 5);
          document.getElementById(`${id}-def-btn`).classList.remove('active');
          playSFX('spin');
          renderSlots();
        }
      }, 30);
    }
    function cancelEgo(id) {
      clearInterval(state[id].timer);
      document.getElementById(`${id}-ego-progress`).style.width = '0%';
    }

    function validate() {
      ['p', 'e'].forEach(id => {
        let hp = document.getElementById(`${id}-hp`), maxHp = document.getElementById(`${id}-max-hp`);
        if (getVal(id, 'hp') > getVal(id, 'max-hp')) hp.value = maxHp.value;
      });
    }

    function updateHp() {
      validate();
      ['p', 'e'].forEach(id => {
        let max = getVal(id, 'max-hp'), cur = getVal(id, 'hp'), pct = Math.max(0, Math.min(100, (cur / max) * 100));
        document.getElementById(`${id}-hp-bar`).style.width = `${pct}%`;
        document.getElementById(`${id}-hp-text`).innerText = `HP: ${cur} / ${max}`;
        
        let layer = document.getElementById(`${id}-stagger-lines-layer`);
        layer.innerHTML = '';
        state[id].staggerValues.forEach(th => {
          if (th > 0 && th < 100) {
            let line = document.createElement('div');
            line.className = `stagger-line ${pct <= th ? 'hidden' : ''}`;
            line.style.left = `${th}%`;
            layer.appendChild(line);
          }
        });

        const stageElem = document.getElementById(`${id}-coins-stage`);
        const lvl = state[id].staggerLevel;
        if (lvl > 0 && stageElem && !stageElem.querySelector('.stagger-img')) {
          const imgName = lvl === 1 ? 'stagger.png' : (lvl === 2 ? 'stagger1.png' : 'stagger2.png');
          stageElem.innerHTML = `<img src="images/${imgName}" class="stagger-img" alt="STAGGER">`;
        }
      });
    }

    function updateInfo() {
      ['p', 'e'].forEach(id => {
        let s = getVal(id, 'sanity'), chance = Math.max(5, Math.min(95, 50 + s));
        document.getElementById(`${id}-info`).innerText = `앞면 확률: ${chance}%`;
      });
      renderSlots();
    }

    function renderSlots() {
      ['p', 'e'].forEach(id => {
        let st = state[id];
        document.getElementById(`${id}-slots-display`).innerHTML = st.slots.map((s, idx) => `
          <span class="skill-badge ${s===5?'ego':'s'+s} ${idx===st.selIdx?'selected':''}" onclick="state['${id}'].selIdx=${idx}; renderSlots()">${getSkillName(id, s)}</span>
        `).join('');
        document.getElementById(`${id}-next-display`).innerHTML = `<span>[NEXT]:</span><span class="skill-badge next-badge s${st.next===5?1:st.next}">${getSkillName(id, st.next)}</span>`;
      });
      updateHp();
    }

    function getSkillName(id, type) {
      if (state[id].staggerLevel > 0) return '[STAGGER] 행동 불능';
      if (type === 4) return `[수비] ${getString(id, 's4-type')}`;
      if (type === 5) return `[E.G.O] ${getString(id, 'ego-name')}`;
      return getString(id, `s${type}-name`) || `${type}스킬`;
    }

    function applyDamage(isPlayer, amount) {
      if (amount <= 0) return;
      playSFX('hit');
      const id = isPlayer ? 'p' : 'e';
      
      // 흐트러짐 단계별 10% 추가 피해 적용 (중첩 가능)
      if (state[id].staggerLevel > 0) {
        amount = Math.round(amount * (1 + 0.1 * state[id].staggerLevel));
      }

      let max = getVal(id, 'max-hp'), hpElem = document.getElementById(`${id}-hp`), cur = getVal(id, 'hp');
      let oldPct = (cur / max) * 100;
      cur = Math.max(0, cur - amount);
      hpElem.value = cur;
      let newPct = (cur / max) * 100;

      state[id].staggerValues.forEach(th => {
        if (th > 0 && oldPct > th && newPct <= th) {
          if (state[id].staggerLevel === 0) {
            state[id].staggerLevel = 1;
            state[id].nextStagger = true; // 다음 턴 행동 불능 예약
          } else {
            state[id].staggerLevel = Math.min(3, state[id].staggerLevel + 1);
          }
        }
      });
      updateHp();
    }

    function startMatch() {
      document.getElementById('clash-btn').disabled = true;
      document.getElementById('clash-round-badge').style.display = 'block';

      // 만약 이미 흐트러진 상태라면 즉시 피격 단일 행동 처리
      if (state.p.staggerLevel > 0 || state.e.staggerLevel > 0) {
        runStaggerOneSided();
        return;
      }

      setTimeout(() => { finishMatch(); }, 1000);
    }

    function runStaggerOneSided() {
      const isPStagger = state.p.staggerLevel > 0;
      const attackerId = isPStagger ? 'e' : 'p';
      const defId = isPStagger ? 'p' : 'e';
      const type = state[attackerId].slots[state[attackerId].selIdx];
      const base = getVal(attackerId, type===5?'ego':'s'+type+'-base');
      const cp = getVal(attackerId, type===5?'ego':'s'+type+'-coinpower');
      
      let dmg = base + cp;
      applyDamage(isPStagger, dmg);
      
      setTimeout(() => { finishMatch(); }, 1200);
    }

    function finishMatch() {
      ['p', 'e'].forEach(id => {
        // 흐트러짐 상태 관리 갱신
        if (state[id].nextStagger) {
          state[id].nextStagger = false;
        } else if (state[id].staggerLevel > 0) {
          state[id].staggerLevel = 0;
          const stageElem = document.getElementById(`${id}-coins-stage`);
          if (stageElem) stageElem.innerHTML = '';
        }

        state[id].slots[state[id].selIdx] = state[id].next;
        state[id].next = drawNext(id);
      });
      document.getElementById('clash-btn').disabled = false;
      renderSlots();
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" data-theme="limbus">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG 중앙 코인 대결 시뮬레이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Oswald:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root[data-theme="limbus"] {
      --font-title: 'Oswald', 'Noto Sans KR', sans-serif;
      --font-body: 'Noto Sans KR', sans-serif;
      --bg-color: #050507;
      --card-bg: linear-gradient(180deg, #181412 0%, #0d0b0a 100%);
      --sub-card-bg: #090807;
      --border-style: 2px solid #8e2a18;
      --card-box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 12px rgba(142, 42, 24, 0.4);
      --primary-color: #ff3322;
      --accent-color: #e6a100;
      --text-color: #dcd8d0;
      --title-color: #f0a800;
      --title-shadow: 0 0 8px rgba(240, 168, 0, 0.6), 2px 2px 0px #500000;
      --btn-bg: linear-gradient(180deg, #991c0e 0%, #520902 100%);
      --btn-border: 2px solid #e6a100;
      --spark-color-1: #e6a100;
      --spark-color-2: #ff3322;
      --glow-filter: drop-shadow(0 0 12px rgba(230, 161, 0, 0.9));
      --badge-clip: polygon(15% 0%, 85% 0%, 100% 50%, 85% 100%, 15% 100%, 0% 50%);
    }

    :root[data-theme="ruina"] {
      --font-title: 'Cinzel', 'Noto Sans KR', serif;
      --font-body: 'Cinzel', 'Noto Sans KR', serif;
      --bg-color: #03060a;
      --card-bg: linear-gradient(180deg, #0a1322 0%, #040810 100%);
      --sub-card-bg: #020509;
      --border-style: 2px double #c59f52;
      --card-box-shadow: inset 0 0 20px rgba(0,0,0,0.95), 0 0 15px rgba(197, 159, 82, 0.3);
      --primary-color: #38ef7d;
      --accent-color: #38e8e5;
      --text-color: #eaeff5;
      --title-color: #38e8e5;
      --title-shadow: 0 0 10px rgba(56, 232, 229, 0.7), 0 0 20px rgba(197, 159, 82, 0.5);
      --btn-bg: linear-gradient(180deg, #0e2b47 0%, #051322 100%);
      --btn-border: 2px double #c59f52;
      --spark-color-1: #38e8e5;
      --spark-color-2: #c59f52;
      --glow-filter: drop-shadow(0 0 14px rgba(56, 232, 229, 0.9));
      --badge-clip: none;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-color);
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
      margin: 0; padding: 1.5rem 2rem; overflow-x: hidden; transition: background-color 0.3s, color 0.3s;
    }
    .main-wrapper { width: 100%; max-width: 1800px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.8rem; border-bottom: var(--border-style); }
    h1 { font-family: var(--font-title); font-size: 2.1rem; margin: 0; color: var(--title-color); letter-spacing: 3px; text-transform: uppercase; text-shadow: var(--title-shadow); }
    .theme-select-box { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 0.4rem 0.9rem; border: var(--border-style); box-shadow: var(--card-box-shadow); }
    .theme-select-box select, input, select { background: var(--sub-card-bg); color: var(--text-color); border: var(--border-style); font-family: var(--font-body); }
    
    .battle-layout { display: grid; grid-template-columns: 420px 1fr 420px; gap: 1.8rem; align-items: start; }
    @media (max-width: 1200px) { .battle-layout { grid-template-columns: 1fr; } }

    .side-box { background: var(--card-bg); padding: 1.4rem; border: var(--border-style); box-shadow: var(--card-box-shadow); position: relative; }
    .side-title { font-family: var(--font-title); font-size: 1.4rem; font-weight: bold; margin-bottom: 1rem; text-align: center; letter-spacing: 2px; text-transform: uppercase; }
    .side-box.player .side-title { color: #38ef7d; } 
    .side-box.enemy .side-title { color: #ff3322; }

    .slot-container, .skill-config-box { width: 100%; background: var(--sub-card-bg); border: var(--border-style); padding: 0.8rem; margin-bottom: 0.9rem; }
    .slot-header, .skill-config-title { font-size: 0.75rem; color: #888892; margin-bottom: 0.5rem; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
    .slots-wrapper { display: flex; justify-content: center; gap: 8px; min-height: 44px; align-items: center; }

    .def-toggle-btn, .ego-toggle-btn { padding: 0.4rem 0.6rem; font-size: 0.75rem; font-weight: bold; cursor: pointer; border: 1px solid; transition: all 0.2s; }
    .def-toggle-btn { background: #332211; color: #ffaa00; border-color: #aa6600; }
    .def-toggle-btn.active { background: #aa6600; color: #fff; }
    .ego-toggle-btn { background: #2b0c12; color: #ff4466; border-color: #aa1133; position: relative; user-select: none; }
    .ego-toggle-btn.active { background: #aa1133; color: #fff; box-shadow: 0 0 10px #ff3355; }
    .ego-progress { position: absolute; bottom: 0; left: 0; height: 3px; background: #ff3355; width: 0%; }

    .next-box { margin-top: 0.6rem; padding-top: 0.5rem; border-top: 1px dashed rgba(255,255,255,0.15); font-size: 0.75rem; color: var(--accent-color); display: flex; justify-content: center; align-items: center; gap: 6px; }
    .matchup-indicator { margin-top: 0.7rem; padding: 0.45rem; font-size: 0.8rem; font-weight: bold; text-align: center; border: var(--border-style); }
    .matchup-indicator.balanced { color: var(--accent-color); background: rgba(230, 161, 0, 0.08); }

    .skill-badge { padding: 0.5rem 0.9rem; font-weight: bold; font-size: 0.8rem; background: #141418; color: #fff; border: 1px solid #444; cursor: pointer; clip-path: var(--badge-clip); display: inline-flex; align-items: center; justify-content: center; }
    .skill-badge.s1 { background: #0c182b; color: #70a1ff; } .skill-badge.s2 { background: #121333; color: #9aa8df; }
    .skill-badge.s3 { background: #300a12; color: #ff94a0; } .skill-badge.ego { background: #3b0514; color: #ff3366; box-shadow: 0 0 8px rgba(255, 51, 102, 0.5); }
    .skill-badge.defense { background: #332211; color: #ffaa00; border-color: #aa6600; }
    .skill-badge.selected { border-color: var(--accent-color) !important; box-shadow: 0 0 12px var(--accent-color); transform: scale(1.06); }
    .skill-badge.next-badge { cursor: default; font-size: 0.7rem; padding: 0.25rem 0.6rem; }

    .config-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .config-card { background: var(--card-bg); border: var(--border-style); padding: 0.5rem 0.3rem; text-align: center; }
    .config-card label { font-size: 0.65rem; color: #999; display: block; margin: 2px 0; }
    .config-card input, .config-card select { font-size: 0.75rem !important; padding: 0.25rem !important; text-align: center; width: 100%; }

    .preset-manager { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px dashed rgba(255,255,255,0.15); display: flex; flex-direction: column; gap: 6px; }
    .preset-btn-group { display: flex; gap: 6px; }
    .preset-btn { flex: 1; padding: 0.4rem; font-size: 0.72rem; background: #181820; color: #ccc; border: 1px solid #333344; cursor: pointer; font-family: var(--font-body); }
    .preset-btn:hover { background: #252532; color: #fff; }

    .coin-preview-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 0.6rem; }
    .coin-preview-item { font-size: 0.6rem; padding: 0.3rem; background: var(--card-bg); color: var(--accent-color); text-align: center; border: var(--border-style); }

    .control-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; color: #bbb; }
    input, select { width: 100%; padding: 0.5rem; color: #fff; font-size: 0.85rem; }

    .center-stage { position: relative; background: var(--card-bg); border: var(--border-style); padding: 1.8rem; box-shadow: var(--card-box-shadow); text-align: center; min-height: 520px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    button.clash-btn { width: 100%; padding: 1.1rem; font-size: 1.3rem; font-weight: bold; color: #fff; font-family: var(--font-title); letter-spacing: 3px; background: var(--btn-bg); border: var(--btn-border); cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    button.clash-btn:disabled { background: #1c1c24 !important; color: #555; cursor: not-allowed; }

    .center-arena-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.2rem; z-index: 2; }
    .side-result-box { background: var(--sub-card-bg); border: var(--border-style); padding: 1.2rem; min-height: 240px; }

    .hp-container { margin-bottom: 0.8rem; background: #111; border: 1px solid #444; padding: 4px; position: relative; }
    .hp-bar-bg { width: 100%; height: 14px; background: #222; position: relative; overflow: hidden; }
    .hp-bar-fill { height: 100%; width: 100%; background: #38ef7d; transition: width 0.3s; }
    .hp-bar-fill.enemy-hp { background: #ff3322; }
    .shield-bar-fill { position: absolute; top: 0; left: 0; height: 100%; background: #38e8e5; opacity: 0.75; width: 0%; }
    
    .stagger-lines-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .stagger-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffd700; box-shadow: 0 0 6px #ffaa00; }
    .stagger-line.hidden { display: none !important; }

    .hp-text { font-size: 0.75rem; font-weight: bold; color: #fff; margin-top: 2px; }
    .power-score-badge { font-family: var(--font-title); font-size: 1.3rem; font-weight: bold; color: var(--accent-color); margin-top: 4px; }
    .coins-wrapper { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 0.8rem; min-height: 70px; align-items: center; }

    .stagger-img { max-width: 180px; max-height: 80px; object-fit: contain; filter: drop-shadow(0 0 10px #ffaa00); animation: staggerPulse 0.8s infinite alternate; }
    @keyframes staggerPulse { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1.05); opacity: 1; } }

    .coin { position: relative; width: 60px; height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 0.75rem; background-size: contain; background-repeat: no-repeat; background-position: center; border: none !important; background-color: transparent !important; }
    .coin.flipping { animation: coinFlip 0.3s infinite linear; background-image: url('images/coin-heads.png'); filter: brightness(0.9); }
    .coin.heads { background-image: url('images/coin-heads.png'); transform: scale(1.05); color: transparent; }
    .coin.tails { background-image: url('images/coin-tails.png'); transform: scale(1); color: transparent; }
    .coin.win-glow { background-image: url('images/coin-win.png') !important; filter: var(--glow-filter); transform: scale(1.12); color: transparent; }
    .coin.broken-heads { background-image: url('images/coin-broken-heads.png') !important; opacity: 0.6; transform: scale(0.85); animation: coinShatter 0.4s ease-out forwards; color: transparent; }
    .coin.broken-tails { background-image: url('images/coin-broken-tails.png') !important; opacity: 0.6; transform: scale(0.85); animation: coinShatter 0.4s ease-out forwards; color: transparent; }

    @keyframes coinShatter {
      0% { transform: scale(1.1) rotate(0deg); opacity: 1; filter: brightness(1.8); }
      30% { transform: scale(1.2) rotate(12deg); }
      100% { transform: scale(0.85) rotate(-8deg); opacity: 0.6; }
    }
    @keyframes coinFlip { 0% { transform: rotateY(0deg); } 50% { transform: rotateY(180deg); } 100% { transform: rotateY(360deg); } }
    .coin-sub { position: absolute; bottom: -16px; font-size: 0.6rem; color: #aaa; font-weight: normal; background: rgba(0,0,0,0.85); padding: 1px 4px; font-family: var(--font-body); }
    .spark-container { position: absolute; top: 55%; left: 50%; width: 0; height: 0; pointer-events: none; z-index: 10; }
    .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px var(--spark-color-1), 0 0 20px var(--spark-color-2); animation: sparkFly 0.6s ease-out forwards; }
    @keyframes sparkFly { 0% { opacity: 1; transform: translate(0, 0) scale(1.5); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); } }
    .shatter-piece { position: absolute; width: 8px; height: 8px; background: var(--accent-color); box-shadow: 0 0 8px var(--primary-color); animation: shatterFly 0.5s ease-out forwards; pointer-events: none; }
    @keyframes shatterFly { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--sdx), var(--sdy)) scale(0.1); } }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-bar">
      <h1>TRPG COIN CLASH SIMULATOR</h1>
      <div class="theme-select-box">
        <label for="theme-select">THEME:</label>
        <select id="theme-select" onchange="changeTheme(this.value)">
          <option value="limbus">LIMBUS COMPANY</option>
          <option value="ruina">LIBRARY OF RUINA</option>
        </select>
      </div>
    </div>

    <div class="battle-layout">
      <!-- 1. 아군 설정창 -->
      <div class="side-box player">
        <div class="side-title">PLAYER</div>
        <div class="slot-container">
          <div class="slot-header">보유 스킬 슬롯</div>
          <div class="slots-wrapper">
            <div id="p-slots-display" style="display:flex; gap:6px;"></div>
            <button class="def-toggle-btn" id="p-def-btn" onclick="toggleDefenseSlot(true)">수비</button>
            <button class="ego-toggle-btn" id="p-ego-btn" onmousedown="startEgoHold(true)" onmouseup="cancelEgoHold(true)" onmouseleave="cancelEgoHold(true)">
              E.G.O (1초 꾹)<div class="ego-progress" id="p-ego-progress"></div>
            </button>
          </div>
          <div class="next-box" id="p-next-display"><span>[NEXT]:</span></div>
          <div class="matchup-indicator balanced" id="p-matchup">상성 분석 중...</div>
        </div>

        <div class="skill-config-box">
          <div class="skill-config-title">스킬 / 수비 / E.G.O 옵션 설정</div>
          <div class="config-grid">
            <div class="config-card">
              <label>1스킬 이름</label><input type="text" id="p-s1-name" value="1스킬" onchange="renderSlots()">
              <label>기본 위력</label><input type="number" id="p-s1-base" value="3" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label><input type="number" id="p-s1-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label><input type="number" id="p-s1-coins" value="1" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>2스킬 이름</label><input type="text" id="p-s2-name" value="2스킬" onchange="renderSlots()">
              <label>기본 위력</label><input type="number" id="p-s2-base" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label><input type="number" id="p-s2-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label><input type="number" id="p-s2-coins" value="2" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>3스킬 이름</label><input type="text" id="p-s3-name" value="3스킬" onchange="renderSlots()">
              <label>기본 위력</label><input type="number" id="p-s3-base" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label><input type="number" id="p-s3-coinpower" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label><input type="number" id="p-s3-coins" value="3" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;">
            <div class="config-card">
              <label style="color: #ffd166; font-weight: bold;">수비 스킬</label>
              <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 2px; margin-top: 4px;">
                <div><label>유형</label><select id="p-s4-type" onchange="renderSlots()"><option value="guard">방어</option><option value="evade">회피</option><option value="counter">반격</option></select></div>
                <div><label>기본</label><input type="number" id="p-s4-base" value="10"></div>
                <div><label>코인위력</label><input type="number" id="p-s4-coinpower" value="4"></div>
                <div><label>코인수</label><input type="number" id="p-s4-coins" value="1" min="1" max="5"></div>
              </div>
            </div>
            <div class="config-card" style="border-color: #aa1133;">
              <label style="color: #ff3366; font-weight: bold;">E.G.O 스킬</label>
              <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 2px; margin-top: 4px;">
                <div><label>이름</label><input type="text" id="p-ego-name" value="홍염살"></div>
                <div><label>기본</label><input type="number" id="p-ego-base" value="15"></div>
                <div><label>코인위력</label><input type="number" id="p-ego-coinpower" value="6"></div>
                <div><label>코인수</label><input type="number" id="p-ego-coins" value="2" min="1" max="5"></div>
              </div>
            </div>
          </div>

          <div class="preset-manager">
            <div class="preset-btn-group">
              <button class="preset-btn" onclick="savePreset(true)">스킬셋 저장</button>
              <button class="preset-btn" onclick="deletePreset(true)">저장 삭제</button>
            </div>
            <select id="p-preset-select" onchange="loadPreset(true)">
              <option value="">-- 저장된 스킬셋 선택 --</option>
            </select>
          </div>
        </div>

        <div class="skill-config-box" style="border-color: #e6a100;">
          <div class="skill-config-title" style="color: #e6a100;">금빛 흐트러짐 선 설정 (%)</div>
          <div id="p-stagger-inputs" style="display:flex; flex-direction:column; gap:4px;"></div>
          <div style="display:flex; gap:6px; margin-top:6px;">
            <button class="preset-btn" onclick="addStagger('p')">+ 선 추가</button>
            <button class="preset-btn" onclick="removeStagger('p')">- 선 삭제</button>
          </div>
        </div>

        <div class="control-row">
          <div><label for="p-max-hp">최대 체력</label><input type="number" id="p-max-hp" value="100" onchange="updateHpDisplay()"></div>
          <div><label for="p-hp">현재 체력</label><input type="number" id="p-hp" value="100" onchange="updateHpDisplay()"></div>
        </div>
        <div class="control-group" style="margin-top: 0.8rem;">
          <label for="p-sanity">정신력 (-45 ~ +45)</label><input type="number" id="p-sanity" value="0" min="-45" max="45" onchange="updateInfo()">
        </div>
        <div class="coin-preview-item" id="p-info" style="margin-top:0.4rem; width:100%;">앞면 확률: 50%</div>
      </div>

      <!-- 2. 중앙 대결 무대 -->
      <div class="center-stage" id="center-stage">
        <div class="spark-container" id="spark-layer"></div>
        <div>
          <button class="clash-btn" id="clash-btn" onclick="startMatch()">START CLASH</button>
          <div id="result-box-container" style="margin-top: 1.2rem;">
            <div id="clash-round-badge" class="power-score-badge" style="display: none;">ROUND 1</div>
            <div id="clash-status-text" style="color: #888; font-size: 1.05rem;">좌우 설정창에서 스킬을 선택한 후 합을 진행하세요.</div>
            <div class="center-arena-grid">
              <div class="side-result-box">
                <div class="hp-container">
                  <div class="hp-bar-bg">
                    <div class="hp-bar-fill" id="p-hp-bar" style="width: 100%;"></div>
                    <div class="shield-bar-fill" id="p-shield-bar" style="width: 0%;"></div>
                    <div class="stagger-lines-layer" id="p-stagger-lines-layer"></div>
                  </div>
                  <div class="hp-text" id="p-hp-text">HP: 100 / 100</div>
                </div>
                <div id="p-result-skill-tag"><span class="skill-badge s1">아군 스킬</span></div>
                <div id="p-result-count-text" style="font-size: 0.85rem; color: #aaa;">-</div>
                <div id="p-power-score" class="power-score-badge">-</div>
                <div class="coins-wrapper" id="p-coins-stage"></div>
              </div>
              <div class="side-result-box">
                <div class="hp-container">
                  <div class="hp-bar-bg">
                    <div class="hp-bar-fill enemy-hp" id="e-hp-bar" style="width: 100%;"></div>
                    <div class="shield-bar-fill" id="e-shield-bar" style="width: 0%;"></div>
                    <div class="stagger-lines-layer" id="e-stagger-lines-layer"></div>
                  </div>
                  <div class="hp-text" id="e-hp-text">HP: 100 / 100</div>
                </div>
                <div id="e-result-skill-tag"><span class="skill-badge s1">적군 스킬</span></div>
                <div id="e-result-count-text" style="font-size: 0.85rem; color: #aaa;">-</div>
                <div id="e-power-score" class="power-score-badge">-</div>
                <div class="coins-wrapper" id="e-coins-stage"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. 적군 설정창 -->
      <div class="side-box enemy">
        <div class="side-title">ENEMY</div>
        <div class="slot-container">
          <div class="slot-header">보유 스킬 슬롯</div>
          <div class="slots-wrapper">
            <div id="e-slots-display" style="display:flex; gap:6px;"></div>
            <button class="def-toggle-btn" id="e-def-btn" onclick="toggleDefenseSlot(false)">수비</button>
            <button class="ego-toggle-btn" id="e-ego-btn" onmousedown="startEgoHold(false)" onmouseup="cancelEgoHold(false)" onmouseleave="cancelEgoHold(false)">
              E.G.O (1초 꾹)<div class="ego-progress" id="e-ego-progress"></div>
            </button>
          </div>
          <div class="next-box" id="e-next-display"><span>[NEXT]:</span></div>
          <div class="matchup-indicator balanced" id="e-matchup">상성 분석 중...</div>
        </div>

        <div class="skill-config-box">
          <div class="skill-config-title">스킬 / 수비 / E.G.O 옵션 설정</div>
          <div class="config-grid">
            <div class="config-card">
              <label>1스킬 이름</label><input type="text" id="e-s1-name" value="1스킬" onchange="renderSlots()">
              <label>기본 위력</label><input type="number" id="e-s1-base" value="3" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label><input type="number" id="e-s1-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label><input type="number" id="e-s1-coins" value="1" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>2스킬 이름</label><input type="text" id="e-s2-name" value="2스킬" onchange="renderSlots()">
              <label>기본 위력</label><input type="number" id="e-s2-base" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label><input type="number" id="e-s2-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label><input type="number" id="e-s2-coins" value="2" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>3스킬 이름</label><input type="text" id="e-s3-name" value="3스킬" onchange="renderSlots()">
              <label>기본 위력</label><input type="number" id="e-s3-base" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label><input type="number" id="e-s3-coinpower" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label><input type="number" id="e-s3-coins" value="3" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;">
            <div class="config-card">
              <label style="color: #ffd166; font-weight: bold;">수비 스킬</label>
              <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 2px; margin-top: 4px;">
                <div><label>유형</label><select id="e-s4-type" onchange="renderSlots()"><option value="guard">방어</option><option value="evade">회피</option><option value="counter">반격</option></select></div>
                <div><label>기본</label><input type="number" id="e-s4-base" value="10"></div>
                <div><label>코인위력</label><input type="number" id="e-s4-coinpower" value="4"></div>
                <div><label>코인수</label><input type="number" id="e-s4-coins" value="1" min="1" max="5"></div>
              </div>
            </div>
            <div class="config-card" style="border-color: #aa1133;">
              <label style="color: #ff3366; font-weight: bold;">E.G.O 스킬</label>
              <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 2px; margin-top: 4px;">
                <div><label>이름</label><input type="text" id="e-ego-name" value="여우비"></div>
                <div><label>기본</label><input type="number" id="e-ego-base" value="15"></div>
                <div><label>코인위력</label><input type="number" id="e-ego-coinpower" value="6"></div>
                <div><label>코인수</label><input type="number" id="e-ego-coins" value="2" min="1" max="5"></div>
              </div>
            </div>
          </div>

          <div class="preset-manager">
            <div class="preset-btn-group">
              <button class="preset-btn" onclick="savePreset(false)">스킬셋 저장</button>
              <button class="preset-btn" onclick="deletePreset(false)">저장 삭제</button>
            </div>
            <select id="e-preset-select" onchange="loadPreset(false)">
              <option value="">-- 저장된 스킬셋 선택 --</option>
            </select>
          </div>
        </div>

        <div class="skill-config-box" style="border-color: #e6a100;">
          <div class="skill-config-title" style="color: #e6a100;">금빛 흐트러짐 선 설정 (%)</div>
          <div id="e-stagger-inputs" style="display:flex; flex-direction:column; gap:4px;"></div>
          <div style="display:flex; gap:6px; margin-top:6px;">
            <button class="preset-btn" onclick="addStagger('e')">+ 선 추가</button>
            <button class="preset-btn" onclick="removeStagger('e')">- 선 삭제</button>
          </div>
        </div>

        <div class="control-row">
          <div><label for="e-max-hp">최대 체력</label><input type="number" id="e-max-hp" value="100" onchange="updateHpDisplay()"></div>
          <div><label for="e-hp">현재 체력</label><input type="number" id="e-hp" value="100" onchange="updateHpDisplay()"></div>
        </div>
        <div class="control-group" style="margin-top: 0.8rem;">
          <label for="e-sanity">정신력 (-45 ~ +45)</label><input type="number" id="e-sanity" value="0" min="-45" max="45" onchange="updateInfo()">
        </div>
        <div class="coin-preview-item" id="e-info" style="margin-top:0.4rem; width:100%;">앞면 확률: 50%</div>
      </div>
    </div>
  </div>

  <script>
    const soundEffects = {
      spin: new Audio('sounds/coin-spin.mp3'),
      heads: new Audio('sounds/coin-heads.mp3'),
      tails: new Audio('sounds/coin-tails.mp3'),
      break: new Audio('sounds/coin-break.mp3'),
      hit: new Audio('sounds/hit.mp3'),
      shield: new Audio('sounds/shield.mp3'),
      counter: new Audio('sounds/counter.mp3')
    };

    function playSFX(key) {
      if (soundEffects[key]) {
        const sound = soundEffects[key].cloneNode();
        sound.play().catch(() => {});
      }
    }

    const baseCycle = [1, 1, 1, 2, 2, 3];
    let playerPool = [], enemyPool = [];
    let playerSlots = [1, 2], enemySlots = [1, 2];
    let playerNext = 1, enemyNext = 1;
    let pSelectedIndex = 0, eSelectedIndex = 0;
    
    let currentClashRound = 1;
    let pRemCoins = 0, eRemCoins = 0;
    let pCoinStates = [], eCoinStates = [];
    
    let staggerData = { p: [70, 40, 20], e: [70, 40, 20] };
    let pStaggerLevel = 0, eStaggerLevel = 0;
    let pIsStaggeredNextTurn = false, eIsStaggeredNextTurn = false;
    let pEgoHoldTimer = null, eEgoHoldTimer = null;
    let pShield = 0, eShield = 0;

    function renderStaggerInputs(prefix) {
      const box = document.getElementById(`${prefix}-stagger-inputs`);
      box.innerHTML = staggerData[prefix].map((val, idx) => `
        <div style="display:flex; align-items:center; gap:6px;">
          <label style="font-size:0.7rem; width:40px;">선 ${idx+1}</label>
          <input type="number" value="${val}" min="0" max="100" onchange="staggerData['${prefix}'][${idx}] = parseFloat(this.value)||0; updateHpDisplay();">
        </div>
      `).join('');
    }

    function addStagger(prefix) {
      staggerData[prefix].push(50);
      renderStaggerInputs(prefix);
      updateHpDisplay();
    }

    function removeStagger(prefix) {
      if (staggerData[prefix].length > 0) {
        staggerData[prefix].pop();
        renderStaggerInputs(prefix);
        updateHpDisplay();
      }
    }

    renderStaggerInputs('p');
    renderStaggerInputs('e');

    function savePreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const name = prompt("저장할 스킬 셋의 이름을 입력하세요:", isPlayer ? "아군 프리셋 1" : "적군 프리셋 1");
      if (!name || name.trim() === "") return;

      const presetData = {
        name: name.trim(),
        s1: { name: document.getElementById(`${prefix}-s1-name`).value, base: document.getElementById(`${prefix}-s1-base`).value, cp: document.getElementById(`${prefix}-s1-coinpower`).value, coins: document.getElementById(`${prefix}-s1-coins`).value },
        s2: { name: document.getElementById(`${prefix}-s2-name`).value, base: document.getElementById(`${prefix}-s2-base`).value, cp: document.getElementById(`${prefix}-s2-coinpower`).value, coins: document.getElementById(`${prefix}-s2-coins`).value },
        s3: { name: document.getElementById(`${prefix}-s3-name`).value, base: document.getElementById(`${prefix}-s3-base`).value, cp: document.getElementById(`${prefix}-s3-coinpower`).value, coins: document.getElementById(`${prefix}-s3-coins`).value },
        s4: { type: document.getElementById(`${prefix}-s4-type`).value, base: document.getElementById(`${prefix}-s4-base`).value, cp: document.getElementById(`${prefix}-s4-coinpower`).value, coins: document.getElementById(`${prefix}-s4-coins`).value },
        ego: { name: document.getElementById(`${prefix}-ego-name`).value, base: document.getElementById(`${prefix}-ego-base`).value, cp: document.getElementById(`${prefix}-ego-coinpower`).value, coins: document.getElementById(`${prefix}-ego-coins`).value },
        stagger: [...staggerData[prefix]]
      };

      let presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      presets.push(presetData);
      localStorage.setItem('trpg_skill_presets', JSON.stringify(presets));
      alert("스킬 셋이 저장되었습니다.");
      updatePresetDropdowns();
    }

    function updatePresetDropdowns() {
      const presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      ['p', 'e'].forEach(prefix => {
        const select = document.getElementById(`${prefix}-preset-select`);
        if(!select) return;
        const currentVal = select.value;
        select.innerHTML = `<option value="">-- 저장된 스킬셋 선택 --</option>` +
          presets.map((p, idx) => `<option value="${idx}">${p.name}</option>`).join('');
        select.value = currentVal;
      });
    }

    function loadPreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const select = document.getElementById(`${prefix}-preset-select`);
      if(!select) return;
      const idx = select.value;
      if (idx === "") return;

      const presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      const p = presets[idx];
      if (!p) return;

      document.getElementById(`${prefix}-s1-name`).value = p.s1.name;
      document.getElementById(`${prefix}-s1-base`).value = p.s1.base;
      document.getElementById(`${prefix}-s1-coinpower`).value = p.s1.cp;
      document.getElementById(`${prefix}-s1-coins`).value = p.s1.coins;

      document.getElementById(`${prefix}-s2-name`).value = p.s2.name;
      document.getElementById(`${prefix}-s2-base`).value = p.s2.base;
      document.getElementById(`${prefix}-s2-coinpower`).value = p.s2.cp;
      document.getElementById(`${prefix}-s2-coins`).value = p.s2.coins;

      document.getElementById(`${prefix}-s3-name`).value = p.s3.name;
      document.getElementById(`${prefix}-s3-base`).value = p.s3.base;
      document.getElementById(`${prefix}-s3-coinpower`).value = p.s3.cp;
      document.getElementById(`${prefix}-s3-coins`).value = p.s3.coins;

      if (p.s4) {
        document.getElementById(`${prefix}-s4-type`).value = p.s4.type;
        document.getElementById(`${prefix}-s4-base`).value = p.s4.base;
        document.getElementById(`${prefix}-s4-coinpower`).value = p.s4.cp;
        document.getElementById(`${prefix}-s4-coins`).value = p.s4.coins;
      }

      if (p.ego) {
        document.getElementById(`${prefix}-ego-name`).value = p.ego.name;
        document.getElementById(`${prefix}-ego-base`).value = p.ego.base;
        document.getElementById(`${prefix}-ego-coinpower`).value = p.ego.cp;
        document.getElementById(`${prefix}-ego-coins`).value = p.ego.coins;
      }

      if (p.stagger) {
        staggerData[prefix] = [...p.stagger];
        renderStaggerInputs(prefix);
      }

      validateInputs();
      renderSlots();
    }

    function deletePreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const select = document.getElementById(`${prefix}-preset-select`);
      if(!select) return;
      const idx = select.value;
      if (idx === "") { alert("삭제할 프리셋을 선택해주세요."); return; }

      let presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      if (confirm(`'${presets[idx].name}' 스킬셋을 삭제하시겠습니까?`)) {
        presets.splice(idx, 1);
        localStorage.setItem('trpg_skill_presets', JSON.stringify(presets));
        updatePresetDropdowns();
        renderSlots();
      }
    }

    function changeTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('trpg_sim_theme', themeName);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('trpg_sim_theme') || 'limbus';
      document.documentElement.setAttribute('data-theme', savedTheme);
      const sel = document.getElementById('theme-select');
      if(sel) sel.value = savedTheme;
    }

    function toggleDefenseSlot(isPlayer) {
      if ((isPlayer && pStaggerLevel > 0) || (!isPlayer && eStaggerLevel > 0)) return;
      const slots = isPlayer ? playerSlots : enemySlots;
      const btn = document.getElementById(isPlayer ? 'p-def-btn' : 'e-def-btn');
      if (slots[1] === 5) return;

      if (slots[1] === 4) {
        slots[1] = 2;
        if(btn) btn.classList.remove('active');
      } else {
        slots[1] = 4;
        if(btn) btn.classList.add('active');
        const egoBtn = document.getElementById(isPlayer ? 'p-ego-btn' : 'e-ego-btn');
        if(egoBtn) egoBtn.classList.remove('active');
      }
      renderSlots();
    }

    function startEgoHold(isPlayer) {
      if ((isPlayer && pStaggerLevel > 0) || (!isPlayer && eStaggerLevel > 0)) return;
      const progressElem = document.getElementById(isPlayer ? 'p-ego-progress' : 'e-ego-progress');
      const btnElem = document.getElementById(isPlayer ? 'p-ego-btn' : 'e-ego-btn');
      const slots = isPlayer ? playerSlots : enemySlots;
      let startTime = Date.now();
      const duration = 1000;

      const timer = setInterval(() => {
        let elapsed = Date.now() - startTime;
        let pct = Math.min(100, (elapsed / duration) * 100);
        if(progressElem) progressElem.style.width = `${pct}%`;

        if (elapsed >= duration) {
          clearInterval(timer);
          if(progressElem) progressElem.style.width = '0%';
          if (slots[1] === 5) {
            slots[1] = 2;
            if(btnElem) btnElem.classList.remove('active');
          } else {
            slots[1] = 5;
            if(btnElem) btnElem.classList.add('active');
            const defBtn = document.getElementById(isPlayer ? 'p-def-btn' : 'e-def-btn');
            if(defBtn) defBtn.classList.remove('active');
            playSFX('spin');
          }
          renderSlots();
        }
      }, 30);

      if (isPlayer) pEgoHoldTimer = timer; else eEgoHoldTimer = timer;
    }

    function cancelEgoHold(isPlayer) {
      const timer = isPlayer ? pEgoHoldTimer : eEgoHoldTimer;
      if (timer) {
        clearInterval(timer);
        if (isPlayer) pEgoHoldTimer = null; else eEgoHoldTimer = null;
      }
      const progressElem = document.getElementById(isPlayer ? 'p-ego-progress' : 'e-ego-progress');
      if (progressElem) progressElem.style.width = '0%';
    }

    function calculateHeadsChance(sanity) {
      let s = Number(sanity) || 0;
      let chance = 50 + s;
      if (chance > 95) chance = 95;
      if (chance < 5) chance = 5;
      return chance;
    }

    function updateHpDisplay() {
      ['p', 'e'].forEach(prefix => {
        let maxHp = parseInt(document.getElementById(`${prefix}-max-hp`).value) || 100;
        let hp = parseInt(document.getElementById(`${prefix}-hp`).value) || 0;
        if (hp > maxHp) { hp = maxHp; document.getElementById(`${prefix}-hp`).value = hp; }
        
        let pct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
        const hpBar = document.getElementById(`${prefix}-hp-bar`);
        const hpText = document.getElementById(`${prefix}-hp-text`);
        if(hpBar) hpBar.style.width = `${pct}%`;
        if(hpText) hpText.innerText = `HP: ${hp} / ${maxHp}`;

        const linesLayer = document.getElementById(`${prefix}-stagger-lines-layer`);
        if(linesLayer) {
          linesLayer.innerHTML = '';
          staggerData[prefix].forEach(th => {
            if (th > 0 && th < 100) {
              let line = document.createElement('div');
              line.className = 'stagger-line';
              line.style.left = `${th}%`;
              if (pct <= th) line.classList.add('hidden');
              linesLayer.appendChild(line);
            }
          });
        }

        const currentLvl = (prefix === 'p') ? pStaggerLevel : eStaggerLevel;
        const stageElem = document.getElementById(`${prefix}-coins-stage`);
        if (currentLvl > 0 && stageElem) {
          const imgName = currentLvl === 1 ? 'stagger.png' : (currentLvl === 2 ? 'stagger1.png' : 'stagger2.png');
          stageElem.innerHTML = `<img src="images/${imgName}" class="stagger-img" alt="STAGGER">`;
        }
      });
    }

    function applyDamage(isPlayer, amount) {
      if (amount <= 0) return;
      playSFX('hit');
      const prefix = isPlayer ? 'p' : 'e';
      
      let currentLvl = isPlayer ? pStaggerLevel : eStaggerLevel;
      if (currentLvl > 0) {
        amount = Math.round(amount * (1 + 0.1 * currentLvl));
      }

      let hpElem = document.getElementById(`${prefix}-hp`);
      let maxHp = parseInt(document.getElementById(`${prefix}-max-hp`).value) || 100;
      let hp = parseInt(hpElem.value) || 0;
      let oldPct = (hp / maxHp) * 100;
      hp = Math.max(0, hp - amount);
      hpElem.value = hp;
      let newPct = (hp / maxHp) * 100;

      staggerData[prefix].forEach(th => {
        if (th > 0 && oldPct > th && newPct <= th) {
          if (isPlayer) {
            if (pStaggerLevel === 0) { pStaggerLevel = 1; pIsStaggeredNextTurn = true; }
            else { pStaggerLevel = Math.min(3, pStaggerLevel + 1); }
          } else {
            if (eStaggerLevel === 0) { eStaggerLevel = 1; eIsStaggeredNextTurn = true; }
            else { eStaggerLevel = Math.min(3, eStaggerLevel + 1); }
          }
        }
      });
      updateHpDisplay();
    }

    function validateInputs() {
      ['p', 'e'].forEach(prefix => {
        let maxHpElem = document.getElementById(`${prefix}-max-hp`);
        let hpElem = document.getElementById(`${prefix}-hp`);
        if (maxHpElem && (maxHpElem.value === '' || maxHpElem.value < 1)) maxHpElem.value = 100;
        if (hpElem && hpElem.value === '') hpElem.value = maxHpElem.value;
      });
    }

    function updateMatchupAnalysis() {
      const pInd = document.getElementById('p-matchup');
      const eInd = document.getElementById('e-matchup');
      if(!pInd || !eInd) return;

      if (pStaggerLevel > 0 || eStaggerLevel > 0) {
        pInd.innerText = pStaggerLevel > 0 ? "STAGGER (행동 불능)" : "ONE-SIDED ATTACK";
        eInd.innerText = eStaggerLevel > 0 ? "STAGGER (행동 불능)" : "ONE-SIDED ATTACK";
        return;
      }
      pInd.innerText = "BALANCED";
      eInd.innerText = "BALANCED";
    }

    function getSkillName(isPlayer, skillType) {
      const lvl = isPlayer ? pStaggerLevel : eStaggerLevel;
      if (lvl > 0) return '[STAGGER] 행동 불능';
      const prefix = isPlayer ? 'p' : 'e';
      if (skillType === 4) {
        const subType = document.getElementById(`${prefix}-s4-type`)?.value || 'guard';
        const typeMap = { guard: '방어', evade: '회피', counter: '반격' };
        return `[수비] ${typeMap[subType]}`;
      }
      if (skillType === 5) {
        const egoName = document.getElementById(`${prefix}-ego-name`)?.value;
        return egoName && egoName.trim() !== '' ? `[E.G.O] ${egoName}` : '[E.G.O] 스킬';
      }
      const inputVal = document.getElementById(`${prefix}-s${skillType}-name`)?.value;
      return inputVal && inputVal.trim() !== '' ? inputVal : `${skillType}스킬`;
    }

    function getSkillCoins(isPlayer, skillType) {
      if ((isPlayer && pStaggerLevel > 0) || (!isPlayer && eStaggerLevel > 0)) return 0;
      const prefix = isPlayer ? 'p' : 'e';
      if (skillType === 4) return parseInt(document.getElementById(`${prefix}-s4-coins`)?.value) || 1;
      if (skillType === 5) return parseInt(document.getElementById(`${prefix}-ego-coins`)?.value) || 1;
      return parseInt(document.getElementById(`${prefix}-s${skillType}-coins`)?.value) || 1;
    }

    function getSkillBasePower(isPlayer, skillType) {
      if ((isPlayer && pStaggerLevel > 0) || (!isPlayer && eStaggerLevel > 0)) return 0;
      const prefix = isPlayer ? 'p' : 'e';
      if (skillType === 4) return parseInt(document.getElementById(`${prefix}-s4-base`)?.value) || 0;
      if (skillType === 5) return parseInt(document.getElementById(`${prefix}-ego-base`)?.value) || 0;
      return parseInt(document.getElementById(`${prefix}-s${skillType}-base`)?.value) || 0;
    }

    function getSkillCoinPower(isPlayer, skillType) {
      if ((isPlayer && pStaggerLevel > 0) || (!isPlayer && eStaggerLevel > 0)) return 0;
      const prefix = isPlayer ? 'p' : 'e';
      if (skillType === 4) return parseInt(document.getElementById(`${prefix}-s4-coinpower`)?.value) || 0;
      if (skillType === 5) return parseInt(document.getElementById(`${prefix}-ego-coinpower`)?.value) || 0;
      return parseInt(document.getElementById(`${prefix}-s${skillType}-coinpower`)?.value) || 0;
    }

    function drawNextSkill(isPlayer) {
      let pool = isPlayer ? playerPool : enemyPool;
      if (pool.length === 0) pool = [...baseCycle];
      const idx = Math.floor(Math.random() * pool.length);
      const drawn = pool.splice(idx, 1)[0];
      if (isPlayer) playerPool = pool; else enemyPool = pool;
      return drawn;
    }

    function updateInfo() {
      validateInputs();
      const pSanity = document.getElementById('p-sanity')?.value || 0;
      const eSanity = document.getElementById('e-sanity')?.value || 0;
      document.getElementById('p-info').innerText = `앞면 확률: ${calculateHeadsChance(pSanity)}%`;
      document.getElementById('e-info').innerText = `앞면 확률: ${calculateHeadsChance(eSanity)}%`;
      renderSlots();
    }

    function selectSkill(isPlayer, index) {
      if ((isPlayer && pStaggerLevel > 0) || (!isPlayer && eStaggerLevel > 0)) return;
      if (isPlayer) pSelectedIndex = index; else eSelectedIndex = index;
      renderSlots();
    }

    function renderSlots() {
      document.getElementById('p-slots-display').innerHTML = playerSlots.map((s, idx) => {
        const isSelected = idx === pSelectedIndex ? 'selected' : '';
        const badgeClass = s === 5 ? 'ego' : (s === 4 ? 'defense' : `s${s}`);
        return `<span class="skill-badge ${badgeClass} ${isSelected}" onclick="selectSkill(true, ${idx})">${getSkillName(true, s)}</span>`;
      }).join('');

      document.getElementById('e-slots-display').innerHTML = enemySlots.map((s, idx) => {
        const isSelected = idx === eSelectedIndex ? 'selected' : '';
        const badgeClass = s === 5 ? 'ego' : (s === 4 ? 'defense' : `s${s}`);
        return `<span class="skill-badge ${badgeClass} ${isSelected}" onclick="selectSkill(false, ${idx})">${getSkillName(false, s)}</span>`;
      }).join('');

      document.getElementById('p-next-display').innerHTML = `<span>[NEXT]:</span><span class="skill-badge next-badge s${playerNext === 5 ? 1 : (playerNext === 4 ? 1 : playerNext)}">${getSkillName(true, playerNext)}</span>`;
      document.getElementById('e-next-display').innerHTML = `<span>[NEXT]:</span><span class="skill-badge next-badge s${enemyNext === 5 ? 1 : (enemyNext === 4 ? 1 : enemyNext)}">${getSkillName(false, enemyNext)}</span>`;

      updateHpDisplay();
      updateMatchupAnalysis();
    }

    function triggerSparks() {
      const layer = document.getElementById('spark-layer');
      if(!layer) return;
      layer.innerHTML = '';
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const c1 = currentTheme === 'ruina' ? '#38e8e5' : '#e6a100';
      const c2 = currentTheme === 'ruina' ? '#c59f52' : '#ff3322';

      for (let i = 0; i < 45; i++) {
        const spark = document.createElement('div');
        spark.className = 'spark';
        const angle = Math.random() * Math.PI * 2;
        const distance = 90 + Math.random() * 180;
        spark.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
        spark.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
        spark.style.background = Math.random() > 0.5 ? c1 : c2;
        layer.appendChild(spark);
      }
      setTimeout(() => { if(layer) layer.innerHTML = ''; }, 750);
    }

    function triggerShatterEffect(targetElem) {
      if (!targetElem) return;
      playSFX('break');
      const rect = targetElem.getBoundingClientRect();
      const stageRect = document.getElementById('center-stage').getBoundingClientRect();
      const cx = rect.left - stageRect.left + rect.width / 2;
      const cy = rect.top - stageRect.top + rect.height / 2;
      const layer = document.getElementById('spark-layer');
      if(!layer) return;
      
      for (let i = 0; i < 18; i++) {
        const piece = document.createElement('div');
        piece.className = 'shatter-piece';
        piece.style.left = `${cx}px`; piece.style.top = `${cy}px`;
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 80;
        piece.style.setProperty('--sdx', `${Math.cos(angle) * speed}px`);
        piece.style.setProperty('--sdy', `${Math.sin(angle) * speed}px`);
        layer.appendChild(piece);
      }
    }

    function startMatch() {
      validateInputs();
      pShield = 0; eShield = 0;
      updateHpDisplay();

      const clashBtn = document.getElementById('clash-btn');
      const roundBadge = document.getElementById('clash-round-badge');
      if(clashBtn) clashBtn.disabled = true;
      if(roundBadge) roundBadge.style.display = 'block';

      if (pStaggerLevel > 0 || eStaggerLevel > 0) {
        runStaggerOneSidedAttack();
        return;
      }

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      // 수비 스킬(유형 4)이 포함되어 있으면 합을 치지 않고 독립 수비 처리
      if (pUsedType === 4 || eUsedType === 4) {
        runDefenseAction(pUsedType === 4, eUsedType === 4);
        return;
      }

      pRemCoins = getSkillCoins(true, pUsedType);
      eRemCoins = getSkillCoins(false, eUsedType);
      pCoinStates = new Array(pRemCoins).fill('none');
      eCoinStates = new Array(eRemCoins).fill('none');
      currentClashRound = 1;

      runClashRound();
    }

    // 수비 스킬 단독 판정 로직 (합을 치지 않고 방어/회피/반격 수행)
    function runDefenseAction(isPlayerDef, isEnemyDef) {
      const roundBadge = document.getElementById('clash-round-badge');
      const statusText = document.getElementById('clash-status-text');
      if(roundBadge) roundBadge.innerText = 'DEFENSE ACTION';

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      document.getElementById('p-result-skill-tag').innerHTML = `<span class="skill-badge ${pUsedType===4?'defense':(pUsedType===5?'ego':'s'+pUsedType)}">${getSkillName(true, pUsedType)}</span>`;
      document.getElementById('e-result-skill-tag').innerHTML = `<span class="skill-badge ${eUsedType===4?'defense':(eUsedType===5?'ego':'s'+eUsedType)}">${getSkillName(false, eUsedType)}</span>`;

      let statusMsg = "";

      // 플레이어가 수비일 때
      if (isPlayerDef) {
        const subType = document.getElementById('p-s4-type').value;
        const base = getSkillBasePower(true, 4);
        const cp = getSkillCoinPower(true, 4);
        const sanity = parseInt(document.getElementById('p-sanity').value) || 0;
        const chance = calculateHeadsChance(sanity);
        const isHeads = Math.random() * 100 < chance;
        const totalVal = base + (isHeads ? cp : 0);

        document.getElementById('p-coins-stage').innerHTML = `<div class="coin ${isHeads ? 'heads' : 'tails'} win-glow"><span class="coin-sub">${totalVal}</span></div>`;
        document.getElementById('p-power-score').innerText = `DEF: ${totalVal}`;

        if (subType === 'guard') {
          pShield = totalVal;
          document.getElementById('p-shield-bar').style.width = '100%';
          playSFX('shield');
          statusMsg = `[아군] 방어 성공! 보호막 ${totalVal} 획득`;
        } else if (subType === 'evade') {
          playSFX('counter');
          statusMsg = `[아군] 회피 판정 완료 (회피 수치: ${totalVal})`;
        } else if (subType === 'counter') {
          playSFX('counter');
          applyDamage(false, totalVal);
          statusMsg = `[아군] 반격 발동! 적에게 ${totalVal} 피해 반사`;
        }
      } else {
        // 아군이 공격할 때 (적은 수비)
        const pCoins = getSkillCoins(true, pUsedType);
        const pBase = getSkillBasePower(true, pUsedType);
        const pCP = getSkillCoinPower(true, pUsedType);
        let pDmg = pBase + pCP; // 간소화된 일방공격 피해
        
        let pHTML = '';
        for (let i = 0; i < pCoins; i++) pHTML += `<div class="coin heads win-glow"></div>`;
        document.getElementById('p-coins-stage').innerHTML = pHTML;
        document.getElementById('p-power-score').innerText = `ATTACK`;

        if (isEnemyDef) {
          const eSubType = document.getElementById('e-s4-type').value;
          const eBase = getSkillBasePower(false, 4);
          const eCP = getSkillCoinPower(false, 4);
          const eTotal = eBase + eCP;
          document.getElementById('e-coins-stage').innerHTML = `<div class="coin heads"><span class="coin-sub">${eTotal}</span></div>`;
          document.getElementById('e-power-score').innerText = `DEF: ${eTotal}`;

          if (eSubType === 'guard') {
            let finalDmg = Math.max(0, pDmg - eTotal);
            applyDamage(false, finalDmg);
            statusMsg = `[적군] 방어로 피해 경감 (남은 피해: ${finalDmg})`;
          } else if (eSubType === 'evade') {
            statusMsg = `[적군] 공격을 완전히 회피했습니다!`;
          } else if (eSubType === 'counter') {
            applyDamage(false, pDmg);
            applyDamage(true, eTotal);
            statusMsg = `[적군] 반격 맞대응! 양측 모두 피해 교환`;
          }
        }
      }

      // 적군이 수비일 때 (아군은 공격이 아닐 때)
      if (isEnemyDef && !isPlayerDef) {
        const subType = document.getElementById('e-s4-type').value;
        const base = getSkillBasePower(false, 4);
        const cp = getSkillCoinPower(false, 4);
        const sanity = parseInt(document.getElementById('e-sanity').value) || 0;
        const chance = calculateHeadsChance(sanity);
        const isHeads = Math.random() * 100 < chance;
        const totalVal = base + (isHeads ? cp : 0);

        document.getElementById('e-coins-stage').innerHTML = `<div class="coin ${isHeads ? 'heads' : 'tails'} win-glow"><span class="coin-sub">${totalVal}</span></div>`;
        document.getElementById('e-power-score').innerText = `DEF: ${totalVal}`;

        if (subType === 'guard') {
          eShield = totalVal;
          document.getElementById('e-shield-bar').style.width = '100%';
          playSFX('shield');
          statusMsg = `[적군] 방어 성공! 보호막 ${totalVal} 획득`;
        } else if (subType === 'evade') {
          playSFX('counter');
          statusMsg = `[적군] 회피 판정 완료 (회피 수치: ${totalVal})`;
        } else if (subType === 'counter') {
          playSFX('counter');
          applyDamage(true, totalVal);
          statusMsg = `[적군] 반격 발동! 아군에게 ${totalVal} 피해 반사`;
        }
      }

      if(statusText) statusText.innerHTML = `<span style="color: var(--accent-color); font-weight: bold;">${statusMsg}</span>`;
      setTimeout(() => { finishMatch(); }, 1800);
    }

    function runStaggerOneSidedAttack() {
      const roundBadge = document.getElementById('clash-round-badge');
      if(roundBadge) roundBadge.innerText = 'STAGGER ATTACK';

      const isPlayerStaggered = pStaggerLevel > 0;
      const attackerIsPlayer = !isPlayerStaggered;
      const attackType = attackerIsPlayer ? playerSlots[pSelectedIndex] : enemySlots[eSelectedIndex];
      
      const coinsCount = getSkillCoins(attackerIsPlayer, attackType);
      const basePower = getSkillBasePower(attackerIsPlayer, attackType);
      const coinPower = getSkillCoinPower(attackerIsPlayer, attackType);
      const sanity = parseInt(document.getElementById(attackerIsPlayer ? 'p-sanity' : 'e-sanity')?.value) || 0;
      const chance = calculateHeadsChance(sanity);

      let HTML = '';
      for (let i = 0; i < coinsCount; i++) HTML += `<div class="coin flipping" id="${attackerIsPlayer ? 'p' : 'e'}-coin-${i}"></div>`;

      if (attackerIsPlayer) {
        document.getElementById('p-result-skill-tag').innerHTML = `<span class="skill-badge ${attackType===5?'ego':('s'+attackType)}">${getSkillName(true, attackType)}</span>`;
        document.getElementById('p-coins-stage').innerHTML = HTML;
      } else {
        document.getElementById('e-result-skill-tag').innerHTML = `<span class="skill-badge ${attackType===5?'ego':('s'+attackType)}">${getSkillName(false, attackType)}</span>`;
        document.getElementById('e-coins-stage').innerHTML = HTML;
      }

      playSFX('spin');

      let step = 0;
      let interval = setInterval(() => {
        if (step < coinsCount) {
          let isHeads = Math.random() * 100 < chance;
          let coinDmg = basePower + (isHeads ? coinPower : 0);
          
          let elem = document.getElementById(`${attackerIsPlayer ? 'p' : 'e'}-coin-${step}`);
          if (elem) {
            elem.className = `coin ${isHeads ? 'heads' : 'tails'} win-glow`;
            elem.innerHTML = `<span class="coin-sub">${coinDmg}</span>`;
            playSFX(isHeads ? 'heads' : 'tails');
          }

          applyDamage(isPlayerStaggered, coinDmg);
          step++;
        } else {
          clearInterval(interval);
          setTimeout(() => { finishMatch(); }, 1200);
        }
      }, 500);
    }

    function runClashRound() {
      const pSanity = parseInt(document.getElementById('p-sanity')?.value) || 0;
      const pChance = calculateHeadsChance(pSanity);
      const eSanity = parseInt(document.getElementById('e-sanity')?.value) || 0;
      const eChance = calculateHeadsChance(eSanity);

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      const pTotalMax = getSkillCoins(true, pUsedType);
      const eTotalMax = getSkillCoins(false, eUsedType);
      const pBase = getSkillBasePower(true, pUsedType);
      const pCP = getSkillCoinPower(true, pUsedType);
      const eBase = getSkillBasePower(false, eUsedType);
      const eCP = getSkillCoinPower(false, eUsedType);

      const roundBadge = document.getElementById('clash-round-badge');
      const statusText = document.getElementById('clash-status-text');
      if(roundBadge) roundBadge.innerText = `ROUND ${currentClashRound}`;
      if(statusText) statusText.innerHTML = `<span style="color: var(--accent-color); font-weight: bold;">ROUND ${currentClashRound} CLASHING...</span>`;
      document.querySelectorAll('.coin').forEach(c => c.classList.remove('win-glow'));

      playSFX('spin');

      let playerRolls = [], playerHeads = 0, activePIndices = [];
      for (let i = 0; i < pTotalMax; i++) {
        if (!pCoinStates[i]?.startsWith('broken')) {
          activePIndices.push(i);
          const roll = Math.random() * 100;
          const isHeads = roll < pChance;
          if (isHeads) playerHeads++;
          playerRolls.push({ isHeads, roll: roll.toFixed(1) });
        }
      }

      let enemyRolls = [], enemyHeads = 0, activeEIndices = [];
      for (let i = 0; i < eTotalMax; i++) {
        if (!eCoinStates[i]?.startsWith('broken')) {
          activeEIndices.push(i);
          const roll = Math.random() * 100;
          const isHeads = roll < eChance;
          if (isHeads) enemyHeads++;
          enemyRolls.push({ isHeads, roll: roll.toFixed(1) });
        }
      }

      const playerFinalPower = pBase + (playerHeads * pCP);
      const enemyFinalPower = eBase + (enemyHeads * eCP);

      let pHTML = '', eHTML = '';
      for (let i = 0; i < pTotalMax; i++) pHTML += pCoinStates[i]?.startsWith('broken') ? `<div class="coin ${pCoinStates[i]}"></div>` : `<div class="coin flipping" id="p-coin-${i}"></div>`;
      for (let i = 0; i < eTotalMax; i++) eHTML += eCoinStates[i]?.startsWith('broken') ? `<div class="coin ${eCoinStates[i]}"></div>` : `<div class="coin flipping" id="e-coin-${i}"></div>`;

      document.getElementById('p-result-skill-tag').innerHTML = `<span class="skill-badge ${pUsedType===5?'ego':('s'+pUsedType)}">${getSkillName(true, pUsedType)}</span>`;
      document.getElementById('p-coins-stage').innerHTML = pHTML;
      document.getElementById('e-result-skill-tag').innerHTML = `<span class="skill-badge ${eUsedType===5?'ego':('s'+eUsedType)}">${getSkillName(false, eUsedType)}</span>`;
      document.getElementById('e-coins-stage').innerHTML = eHTML;

      const maxStep = Math.max(activePIndices.length, activeEIndices.length);

      for (let i = 0; i < maxStep; i++) {
        setTimeout(() => {
          if (i < activePIndices.length) {
            const coinIdx = activePIndices[i];
            const pElem = document.getElementById(`p-coin-${coinIdx}`);
            if (pElem) {
              const res = playerRolls[i];
              pCoinStates[coinIdx] = res.isHeads ? 'heads' : 'tails';
              pElem.className = `coin ${res.isHeads ? 'heads' : 'tails'}`;
              pElem.innerHTML = `<span class="coin-sub">${res.roll}%</span>`;
              playSFX(res.isHeads ? 'heads' : 'tails');
            }
          }
          if (i < activeEIndices.length) {
            const coinIdx = activeEIndices[i];
            const eElem = document.getElementById(`e-coin-${coinIdx}`);
            if (eElem) {
              const res = enemyRolls[i];
              eCoinStates[coinIdx] = res.isHeads ? 'heads' : 'tails';
              eElem.className = `coin ${res.isHeads ? 'heads' : 'tails'}`;
              eElem.innerHTML = `<span class="coin-sub">${res.roll}%</span>`;
              playSFX(res.isHeads ? 'heads' : 'tails');
            }
          }
        }, 500);
      }

      setTimeout(() => {
        document.getElementById('p-power-score').innerText = `POWER: ${playerFinalPower}`;
        document.getElementById('e-power-score').innerText = `POWER: ${enemyFinalPower}`;
        triggerSparks();

        if (playerFinalPower === enemyFinalPower) {
          if(statusText) statusText.innerHTML = `<div class="result-banner clash">DRAW (RE-TRY)</div>`;
          currentClashRound++; 
          setTimeout(() => { runClashRound(); }, 400);
        } else if (playerFinalPower > enemyFinalPower) {
          const breakCoinIdx = activeEIndices[activeEIndices.length - 1];
          const breakTarget = document.getElementById(`e-coin-${breakCoinIdx}`);
          triggerShatterEffect(breakTarget);
          
          eCoinStates[breakCoinIdx] = eCoinStates[breakCoinIdx] === 'heads' ? 'broken-heads' : 'broken-tails';
          if (breakTarget) { breakTarget.className = `coin ${eCoinStates[breakCoinIdx]}`; breakTarget.innerHTML = ''; }
          eRemCoins--;

          if (eRemCoins > 0) {
            currentClashRound++; 
            setTimeout(() => { runClashRound(); }, 500);
          } else {
            let activeWins = activePIndices.filter(idx => !pCoinStates[idx]?.startsWith('broken'));
            let hitIndex = 0;
            let hitInterval = setInterval(() => {
              if (hitIndex < activeWins.length) {
                let idx = activeWins[hitIndex];
                document.getElementById(`p-coin-${idx}`)?.classList.add('win-glow');
                let coinDmg = pBase + (pCoinStates[idx] === 'heads' ? pCP : 0);
                
                // 보호막 차감 로직
                if (eShield > 0) {
                  let absorbed = Math.min(eShield, coinDmg);
                  eShield -= absorbed;
                  coinDmg -= absorbed;
                  if (eShield <= 0) document.getElementById('e-shield-bar').style.width = '0%';
                }
                
                applyDamage(false, coinDmg);
                hitIndex++;
              } else {
                clearInterval(hitInterval);
                setTimeout(() => { finishMatch(); }, 1000);
              }
            }, 400);
          }
        } else {
          const breakCoinIdx = activePIndices[activePIndices.length - 1];
          const breakTarget = document.getElementById(`p-coin-${breakCoinIdx}`);
          triggerShatterEffect(breakTarget);

          pCoinStates[breakCoinIdx] = pCoinStates[breakCoinIdx] === 'heads' ? 'broken-heads' : 'broken-tails';
          if (breakTarget) { breakTarget.className = `coin ${pCoinStates[breakCoinIdx]}`; breakTarget.innerHTML = ''; }
          pRemCoins--;

          if (pRemCoins > 0) {
            currentClashRound++; 
            setTimeout(() => { runClashRound(); }, 500);
          } else {
            let activeWins = activeEIndices.filter(idx => !eCoinStates[idx]?.startsWith('broken'));
            let hitIndex = 0;
            let hitInterval = setInterval(() => {
              if (hitIndex < activeWins.length) {
                let idx = activeWins[hitIndex];
                document.getElementById(`e-coin-${idx}`)?.classList.add('win-glow');
                let coinDmg = eBase + (eCoinStates[idx] === 'heads' ? eCP : 0);
                
                if (pShield > 0) {
                  let absorbed = Math.min(pShield, coinDmg);
                  pShield -= absorbed;
                  coinDmg -= absorbed;
                  if (pShield <= 0) document.getElementById('p-shield-bar').style.width = '0%';
                }

                applyDamage(true, coinDmg);
                hitIndex++;
              } else {
                clearInterval(hitInterval);
                setTimeout(() => { finishMatch(); }, 1000);
              }
            }, 400);
          }
        }
      }, 600);
    }

    function finishMatch() {
      if (pIsStaggeredNextTurn) {
        pIsStaggeredNextTurn = false;
      } else {
        pStaggerLevel = 0;
        document.getElementById('p-coins-stage').innerHTML = '';
      }

      if (eIsStaggeredNextTurn) {
        eIsStaggeredNextTurn = false;
      } else {
        eStaggerLevel = 0;
        document.getElementById('e-coins-stage').innerHTML = '';
      }

      if (playerSlots[pSelectedIndex] === 5) playerSlots[pSelectedIndex] = 2;
      if (enemySlots[eSelectedIndex] === 5) enemySlots[eSelectedIndex] = 2;
      if (playerSlots[pSelectedIndex] === 4) playerSlots[pSelectedIndex] = 2;
      if (enemySlots[eSelectedIndex] === 4) enemySlots[eSelectedIndex] = 2;
      
      document.getElementById('p-ego-btn').classList.remove('active');
      document.getElementById('e-ego-btn').classList.remove('active');
      document.getElementById('p-def-btn').classList.remove('active');
      document.getElementById('e-def-btn').classList.remove('active');

      playerSlots[pSelectedIndex] = playerNext;
      enemySlots[eSelectedIndex] = enemyNext;
      playerNext = drawNextSkill(true);
      enemyNext = drawNextSkill(false);
      renderSlots();
      
      document.getElementById('clash-btn').disabled = false;
    }

    initTheme();
    updatePresetDropdowns();
    playerNext = drawNextSkill(true);
    enemyNext = drawNextSkill(false);
    updateInfo();
  </script>
</body>
</html>

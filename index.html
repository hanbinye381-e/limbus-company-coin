<!DOCTYPE html>
<html lang="ko" data-theme="limbus">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG 중앙 코인 대결 시뮬레이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Oswald:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* 림버스 컴퍼니 테마 */
    :root[data-theme="limbus"] {
      --font-title: 'Oswald', 'Noto Sans KR', sans-serif;
      --font-body: 'Noto Sans KR', sans-serif;
      --bg-color: #050507;
      --card-bg: linear-gradient(180deg, #181412 0%, #0d0b0a 100%);
      --sub-card-bg: #090807;
      --border-style: 2px solid #8e2a18;
      --card-box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 12px rgba(142, 42, 24, 0.4);
      --card-radius: 0px;
      --primary-color: #ff3322;
      --primary-hover: #d62211;
      --accent-color: #e6a100;
      --text-color: #dcd8d0;
      --title-color: #f0a800;
      --title-shadow: 0 0 8px rgba(240, 168, 0, 0.6), 2px 2px 0px #500000;
      --btn-bg: linear-gradient(180deg, #991c0e 0%, #520902 100%);
      --btn-border: 2px solid #e6a100;
      --spark-color-1: #e6a100;
      --spark-color-2: #ff3322;
      --glow-filter: drop-shadow(0 0 12px rgba(230, 161, 0, 0.9));
      --badge-clip: polygon(15% 0%, 85% 0%, 100% 50%, 85% 100%, 15% 100%, 0% 50%);
    }

    /* 라이브러리 오브 루이나 테마 */
    :root[data-theme="ruina"] {
      --font-title: 'Cinzel', 'Noto Sans KR', serif;
      --font-body: 'Cinzel', 'Noto Sans KR', serif;
      --bg-color: #03060a;
      --card-bg: linear-gradient(180deg, #0a1322 0%, #040810 100%);
      --sub-card-bg: #020509;
      --border-style: 2px double #c59f52;
      --card-box-shadow: inset 0 0 20px rgba(0,0,0,0.95), 0 0 15px rgba(197, 159, 82, 0.3);
      --card-radius: 0px;
      --primary-color: #38ef7d;
      --primary-hover: #11998e;
      --accent-color: #38e8e5;
      --text-color: #eaeff5;
      --title-color: #38e8e5;
      --title-shadow: 0 0 10px rgba(56, 232, 229, 0.7), 0 0 20px rgba(197, 159, 82, 0.5);
      --btn-bg: linear-gradient(180deg, #0e2b47 0%, #051322 100%);
      --btn-border: 2px double #c59f52;
      --spark-color-1: #38e8e5;
      --spark-color-2: #c59f52;
      --glow-filter: drop-shadow(0 0 14px rgba(56, 232, 229, 0.9));
      --badge-clip: none;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem 2rem;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }
    
    .main-wrapper { width: 100%; max-width: 1800px; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: var(--border-style);
    }

    h1 {
      font-family: var(--font-title);
      font-size: 2.1rem;
      margin: 0;
      color: var(--title-color);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: var(--title-shadow);
      transition: all 0.3s;
    }

    .theme-select-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 0.4rem 0.9rem;
      border: var(--border-style);
      box-shadow: var(--card-box-shadow);
    }
    .theme-select-box label { margin: 0; font-size: 0.85rem; color: #aaa; letter-spacing: 1px; }
    .theme-select-box select {
      padding: 0.3rem 0.6rem;
      font-size: 0.85rem;
      width: auto;
      font-family: var(--font-body);
      background: var(--sub-card-bg);
      color: var(--text-color);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .battle-layout {
      display: grid;
      grid-template-columns: 420px 1fr 420px;
      gap: 1.8rem;
      align-items: start;
    }

    @media (max-width: 1200px) { .battle-layout { grid-template-columns: 1fr; } }

    .side-box {
      background: var(--card-bg);
      padding: 1.4rem;
      border: var(--border-style);
      box-shadow: var(--card-box-shadow);
      transition: all 0.3s;
      position: relative;
    }

    .side-title {
      font-family: var(--font-title);
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .player .side-title { color: #38ef7d; text-shadow: 0 0 8px rgba(56, 239, 125, 0.4); }
    .enemy .side-title { color: #ff3322; text-shadow: 0 0 8px rgba(255, 51, 34, 0.4); }

    .slot-container {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 0.8rem;
      margin-bottom: 0.9rem;
      text-align: center;
    }
    .slot-header {
      font-size: 0.75rem;
      color: #888892;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .slots-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      align-items: center;
    }

    .def-toggle-btn {
      padding: 0.4rem 0.6rem;
      font-size: 0.75rem;
      font-weight: bold;
      background: #332211;
      color: #ffaa00;
      border: 1px solid #aa6600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .def-toggle-btn:hover { background: #553311; }
    .def-toggle-btn.active { background: #aa6600; color: #fff; }

    .next-box {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px dashed rgba(255,255,255,0.15);
      font-size: 0.75rem;
      color: var(--accent-color);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .matchup-indicator {
      margin-top: 0.7rem;
      padding: 0.45rem;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      background: var(--card-bg);
      border: var(--border-style);
      letter-spacing: 1px;
    }
    .matchup-indicator.very-advantage { color: #38ef7d; border-color: #38ef7d; background: rgba(56, 239, 125, 0.08); }
    .matchup-indicator.advantage { color: #70a1ff; border-color: #1e90ff; background: rgba(112, 161, 255, 0.08); }
    .matchup-indicator.balanced { color: var(--accent-color); border-color: var(--accent-color); background: rgba(230, 161, 0, 0.08); }
    .matchup-indicator.disadvantage { color: #ff6b81; border-color: #ff3322; background: rgba(255, 51, 34, 0.08); }
    .matchup-indicator.very-disadvantage { color: #ff3322; background: rgba(255, 51, 34, 0.15); border-color: #ff3322; }

    .skill-badge {
      padding: 0.5rem 0.9rem;
      font-weight: bold;
      font-size: 0.8rem;
      background: #141418;
      color: #fff;
      border: 1px solid #444452;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      clip-path: var(--badge-clip);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .skill-badge:hover { transform: translateY(-2px); border-color: #888; }
    .skill-badge.s1 { background: #0c182b; color: #70a1ff; border-color: #1f3b6e; }
    .skill-badge.s2 { background: #121333; color: #9aa8df; border-color: #2e3875; }
    .skill-badge.s3 { background: #300a12; color: #ff94a0; border-color: #6e1f2d; }
    .skill-badge.s4 { background: #2b200a; color: #ffd166; border-color: #75551f; }
    
    .skill-badge.selected {
      border-color: var(--accent-color) !important;
      box-shadow: 0 0 12px var(--accent-color);
      transform: scale(1.06);
    }
    .skill-badge.next-badge { cursor: default; font-size: 0.7rem; padding: 0.25rem 0.6rem; opacity: 0.9; }

    .skill-config-box {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 0.8rem;
      margin-bottom: 0.9rem;
    }
    .skill-config-title {
      font-size: 0.75rem;
      color: #888892;
      margin-bottom: 0.6rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .config-card {
      background: var(--card-bg);
      border: var(--border-style);
      padding: 0.5rem 0.3rem;
      text-align: center;
    }
    .config-card label { font-size: 0.65rem; color: #9999a6; display: block; margin-bottom: 2px; margin-top: 4px; }
    .config-card label:first-child { margin-top: 0; }
    .config-card input[type="text"], .config-card input[type="number"], .config-card select {
      font-size: 0.75rem !important;
      padding: 0.25rem !important;
      text-align: center;
      margin-bottom: 2px;
      font-family: var(--font-body);
    }

    .preset-manager {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px dashed rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preset-btn-group { display: flex; gap: 6px; }
    .preset-btn {
      flex: 1; padding: 0.4rem; font-size: 0.72rem; background: #181820; color: #ccc;
      border: 1px solid #333344; cursor: pointer; transition: all 0.2s; font-family: var(--font-body);
    }
    .preset-btn:hover { background: #252532; color: #fff; }

    .coin-preview-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 4px;
      width: 100%;
      margin-top: 0.6rem;
    }
    .coin-preview-item {
      font-size: 0.6rem;
      padding: 0.3rem;
      background: var(--card-bg);
      color: var(--accent-color);
      text-align: center;
      border: var(--border-style);
      line-height: 1.2;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 0.9rem;
    }
    .control-group { width: 100%; margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; color: #bbbba6; }
    input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 0.5rem 0.6rem;
      background: var(--sub-card-bg);
      border: var(--border-style);
      color: #fff;
      font-size: 0.85rem;
      font-family: var(--font-body);
      transition: border-color 0.2s;
    }
    input[type="number"]:focus, input[type="text"]:focus, select:focus {
      border-color: var(--accent-color);
      outline: none;
    }
    
    .info-badge {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 0.5rem;
      font-size: 0.8rem;
      margin-top: 0.4rem;
      text-align: center;
      color: #ccc;
    }

    .center-stage {
      position: relative;
      background: var(--card-bg);
      border: var(--border-style);
      padding: 1.8rem;
      box-shadow: var(--card-box-shadow);
      text-align: center;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: all 0.3s;
    }

    button.clash-btn {
      width: 100%;
      padding: 1.1rem;
      font-size: 1.3rem;
      font-weight: bold;
      color: #fff;
      font-family: var(--font-title);
      letter-spacing: 3px;
      text-transform: uppercase;
      background: var(--btn-bg);
      border: var(--btn-border);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    button.clash-btn:hover { filter: brightness(1.25); transform: translateY(-1px); }
    button.clash-btn:disabled { background: #1c1c24 !important; color: #555; cursor: not-allowed; box-shadow: none; transform: none; border-color: #333; }

    .clash-count-badge {
      font-family: var(--font-title);
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .result-banner {
      font-family: var(--font-title);
      font-size: 1.7rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .result-banner.player { color: #38ef7d; text-shadow: 0 0 10px rgba(56, 239, 125, 0.4); }
    .result-banner.enemy { color: #ff3322; text-shadow: 0 0 10px rgba(255, 51, 34, 0.4); }
    .result-banner.clash { color: var(--accent-color); text-shadow: 0 0 12px var(--accent-color); animation: clashPulse 0.3s infinite alternate; }

    @keyframes clashPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .center-arena-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.2rem;
      position: relative;
      z-index: 2;
    }

    .side-result-box {
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 1.2rem;
      min-height: 240px;
    }

    .hp-container {
      margin-bottom: 0.8rem;
      background: #111;
      border: 1px solid #444;
      padding: 4px;
      border-radius: 3px;
    }
    .hp-bar-bg {
      width: 100%;
      height: 12px;
      background: #222;
      position: relative;
      overflow: hidden;
    }
    .hp-bar-fill {
      height: 100%;
      width: 100%;
      background: #38ef7d;
      transition: width 0.3s ease, background-color 0.3s;
    }
    .hp-bar-fill.enemy-hp { background: #ff3322; }
    .hp-text {
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .power-score-badge {
      font-family: var(--font-title);
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 4px;
    }

    .coins-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 0.8rem;
    }

    .coin {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.75rem;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: none !important;
      background-color: transparent !important;
      box-shadow: none !important;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .coin.flipping {
      animation: coinFlip 0.3s infinite linear;
      background-image: url('coin-heads.png');
      filter: brightness(0.9);
    }
    .coin.heads { background-image: url('coin-heads.png'); transform: scale(1.05); color: transparent; }
    .coin.tails { background-image: url('coin-tails.png'); transform: scale(1); color: transparent; }

    .coin.win-glow {
      background-image: url('coin-win.png') !important;
      filter: var(--glow-filter);
      transform: scale(1.12);
      color: transparent;
    }

    .coin.broken-heads {
      background-image: url('coin-broken-heads.png') !important;
      opacity: 0.6;
      transform: scale(0.85);
      animation: coinShatter 0.4s ease-out forwards;
      color: transparent;
    }
    .coin.broken-tails {
      background-image: url('coin-broken-tails.png') !important;
      opacity: 0.6;
      transform: scale(0.85);
      animation: coinShatter 0.4s ease-out forwards;
      color: transparent;
    }

    @keyframes coinShatter {
      0% { transform: scale(1.1) rotate(0deg); opacity: 1; filter: brightness(1.8); }
      30% { transform: scale(1.2) rotate(12deg); }
      100% { transform: scale(0.85) rotate(-8deg); opacity: 0.6; }
    }
    @keyframes coinFlip {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }
    .coin-sub {
      position: absolute;
      bottom: -16px;
      font-size: 0.6rem;
      color: #aaa;
      font-weight: normal;
      background: rgba(0,0,0,0.85);
      padding: 1px 4px;
      font-family: var(--font-body);
    }

    .spark-container {
      position: absolute;
      top: 55%; left: 50%; width: 0; height: 0; pointer-events: none; z-index: 10;
    }
    .spark {
      position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 10px var(--spark-color-1), 0 0 20px var(--spark-color-2);
      animation: sparkFly 0.6s ease-out forwards;
    }
    @keyframes sparkFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
    }
    .shatter-piece {
      position: absolute; width: 8px; height: 8px; background: var(--accent-color);
      box-shadow: 0 0 8px var(--primary-color); animation: shatterFly 0.5s ease-out forwards; pointer-events: none;
    }
    @keyframes shatterFly {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--sdx), var(--sdy)) scale(0.1); }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-bar">
      <h1>TRPG COIN CLASH SIMULATOR</h1>

      <div class="theme-select-box">
        <label for="theme-select">THEME:</label>
        <select id="theme-select" onchange="changeTheme(this.value)">
          <option value="limbus">LIMBUS COMPANY</option>
          <option value="ruina">LIBRARY OF RUINA</option>
        </select>
      </div>
    </div>

    <div class="battle-layout">
      <!-- 1. 아군 설정창 -->
      <div class="side-box player">
        <div class="side-title">PLAYER</div>
        
        <div class="slot-container">
          <div class="slot-header">보유 스킬 슬롯</div>
          <div class="slots-wrapper">
            <div id="p-slots-display" style="display:flex; gap:6px;"></div>
            <button class="def-toggle-btn" id="p-def-btn" onclick="toggleDefenseSlot(true)">수비</button>
          </div>
          <div class="next-box" id="p-next-display">
            <span>[NEXT]:</span>
            <span class="skill-badge next-badge s1">1스킬</span>
          </div>
          <div class="matchup-indicator balanced" id="p-matchup">상성 분석 중...</div>
        </div>

        <div class="skill-config-box">
          <div class="skill-config-title">스킬 / 수비 옵션 설정</div>
          <div class="config-grid">
            <div class="config-card">
              <label>1스킬 이름</label>
              <input type="text" id="p-s1-name" value="1스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="p-s1-base" value="3" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="p-s1-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="p-s1-coins" value="1" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>2스킬 이름</label>
              <input type="text" id="p-s2-name" value="2스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="p-s2-base" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="p-s2-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="p-s2-coins" value="2" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>3스킬 이름</label>
              <input type="text" id="p-s3-name" value="3스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="p-s3-base" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="p-s3-coinpower" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="p-s3-coins" value="3" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
          </div>

          <div class="config-card" style="margin-top: 6px; width: 100%;">
            <label style="color: #ffd166; font-weight: bold;">수비 스킬 설정 (4번 슬롯)</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; margin-top: 4px;">
              <div>
                <label>유형</label>
                <select id="p-s4-type" onchange="renderSlots()">
                  <option value="guard">방어</option>
                  <option value="evade">회피</option>
                  <option value="counter">반격</option>
                </select>
              </div>
              <div><label>기본 위력</label><input type="number" id="p-s4-base" value="10" onchange="validateInputs(); renderSlots();"></div>
              <div><label>코인 위력</label><input type="number" id="p-s4-coinpower" value="4" onchange="validateInputs(); renderSlots();"></div>
              <div><label>코인 수</label><input type="number" id="p-s4-coins" value="1" min="1" max="5" onchange="validateInputs(); renderSlots();"></div>
            </div>
          </div>
          
          <div class="preset-manager">
            <div class="preset-btn-group">
              <button class="preset-btn" onclick="savePreset(true)">스킬셋 저장</button>
              <button class="preset-btn" onclick="deletePreset(true)">저장 삭제</button>
            </div>
            <select id="p-preset-select" onchange="loadPreset(true)">
              <option value="">-- 저장된 스킬셋 선택 --</option>
            </select>
          </div>

          <div class="coin-preview-box" id="p-coin-preview"></div>
        </div>

        <div class="control-row">
          <div class="control-group" style="margin-bottom:0;">
            <label for="p-max-hp">최대 체력</label>
            <input type="number" id="p-max-hp" value="100" min="1" max="9999" onchange="validateInputs(); updateHpDisplay();">
          </div>
          <div class="control-group" style="margin-bottom:0;">
            <label for="p-hp">현재 체력</label>
            <input type="number" id="p-hp" value="100" min="0" max="9999" onchange="validateInputs(); updateHpDisplay();">
          </div>
        </div>

        <div class="control-group" style="margin-top: 0.8rem;">
          <label for="p-sanity">정신력 (-45 ~ +45)</label>
          <input type="number" id="p-sanity" value="0" min="-45" max="45" onchange="validateInputs(); updateInfo();">
        </div>

        <div class="info-badge" id="p-info">앞면 확률: 50%</div>
      </div>

      <!-- 2. 중앙 대결 무대 -->
      <div class="center-stage" id="center-stage">
        <div class="spark-container" id="spark-layer"></div>

        <div>
          <button class="clash-btn" id="clash-btn" onclick="startMatch()">START CLASH</button>
          
          <div id="result-box-container" style="margin-top: 1.2rem;">
            <div id="clash-round-badge" class="clash-count-badge" style="display: none;">ROUND 1</div>
            <div id="clash-status-text" style="color: #888; font-size: 1.05rem;">
              좌우 설정창에서 스킬을 선택한 후 합을 진행하세요.
            </div>

            <div class="center-arena-grid">
              <!-- 아군 결과 박스 -->
              <div class="side-result-box">
                <div class="hp-container">
                  <div class="hp-bar-bg"><div class="hp-bar-fill" id="p-hp-bar" style="width: 100%;"></div></div>
                  <div class="hp-text" id="p-hp-text">HP: 100 / 100</div>
                </div>
                <div id="p-result-skill-tag" style="margin-bottom: 0.4rem;"><span class="skill-badge s1">아군 스킬</span></div>
                <div id="p-result-count-text" style="font-size: 0.85rem; color: #aaa;">-</div>
                <div id="p-power-score" class="power-score-badge">-</div>
                <div class="coins-wrapper" id="p-coins-stage"></div>
              </div>

              <!-- 적군 결과 박스 -->
              <div class="side-result-box">
                <div class="hp-container">
                  <div class="hp-bar-bg"><div class="hp-bar-fill enemy-hp" id="e-hp-bar" style="width: 100%;"></div></div>
                  <div class="hp-text" id="e-hp-text">HP: 100 / 100</div>
                </div>
                <div id="e-result-skill-tag" style="margin-bottom: 0.4rem;"><span class="skill-badge s1">적군 스킬</span></div>
                <div id="e-result-count-text" style="font-size: 0.85rem; color: #aaa;">-</div>
                <div id="e-power-score" class="power-score-badge">-</div>
                <div class="coins-wrapper" id="e-coins-stage"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. 적군 설정창 -->
      <div class="side-box enemy">
        <div class="side-title">ENEMY</div>
        
        <div class="slot-container">
          <div class="slot-header">보유 스킬 슬롯</div>
          <div class="slots-wrapper">
            <div id="e-slots-display" style="display:flex; gap:6px;"></div>
            <button class="def-toggle-btn" id="e-def-btn" onclick="toggleDefenseSlot(false)">수비</button>
          </div>
          <div class="next-box" id="e-next-display">
            <span>[NEXT]:</span>
            <span class="skill-badge next-badge s1">1스킬</span>
          </div>
          <div class="matchup-indicator balanced" id="e-matchup">상성 분석 중...</div>
        </div>

        <div class="skill-config-box">
          <div class="skill-config-title">스킬 / 수비 옵션 설정</div>
          <div class="config-grid">
            <div class="config-card">
              <label>1스킬 이름</label>
              <input type="text" id="e-s1-name" value="1스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="e-s1-base" value="3" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="e-s1-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="e-s1-coins" value="1" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>2스킬 이름</label>
              <input type="text" id="e-s2-name" value="2스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="e-s2-base" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="e-s2-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="e-s2-coins" value="2" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>3스킬 이름</label>
              <input type="text" id="e-s3-name" value="3스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="e-s3-base" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="e-s3-coinpower" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="e-s3-coins" value="3" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
          </div>

          <div class="config-card" style="margin-top: 6px; width: 100%;">
            <label style="color: #ffd166; font-weight: bold;">수비 스킬 설정 (4번 슬롯)</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; margin-top: 4px;">
              <div>
                <label>유형</label>
                <select id="e-s4-type" onchange="renderSlots()">
                  <option value="guard">방어</option>
                  <option value="evade">회피</option>
                  <option value="counter">반격</option>
                </select>
              </div>
              <div><label>기본 위력</label><input type="number" id="e-s4-base" value="10" onchange="validateInputs(); renderSlots();"></div>
              <div><label>코인 위력</label><input type="number" id="e-s4-coinpower" value="4" onchange="validateInputs(); renderSlots();"></div>
              <div><label>코인 수</label><input type="number" id="e-s4-coins" value="1" min="1" max="5" onchange="validateInputs(); renderSlots();"></div>
            </div>
          </div>

          <div class="preset-manager">
            <div class="preset-btn-group">
              <button class="preset-btn" onclick="savePreset(false)">스킬셋 저장</button>
              <button class="preset-btn" onclick="deletePreset(false)">저장 삭제</button>
            </div>
            <select id="e-preset-select" onchange="loadPreset(false)">
              <option value="">-- 저장된 스킬셋 선택 --</option>
            </select>
          </div>

          <div class="coin-preview-box" id="e-coin-preview"></div>
        </div>

        <div class="control-row">
          <div class="control-group" style="margin-bottom:0;">
            <label for="e-max-hp">최대 체력</label>
            <input type="number" id="e-max-hp" value="100" min="1" max="9999" onchange="validateInputs(); updateHpDisplay();">
          </div>
          <div class="control-group" style="margin-bottom:0;">
            <label for="e-hp">현재 체력</label>
            <input type="number" id="e-hp" value="100" min="0" max="9999" onchange="validateInputs(); updateHpDisplay();">
          </div>
        </div>

        <div class="control-group" style="margin-top: 0.8rem;">
          <label for="e-sanity">정신력 (-45 ~ +45)</label>
          <input type="number" id="e-sanity" value="0" min="-45" max="45" onchange="validateInputs(); updateInfo();">
        </div>

        <div class="info-badge" id="e-info">앞면 확률: 50%</div>
      </div>
    </div>
  </div>

  <script>
    const baseCycle = [1, 1, 1, 2, 2, 3];
    let playerPool = [];
    let enemyPool = [];

    let playerSlots = [1, 2];
    let enemySlots = [1, 2];

    let playerNext = 1;
    let enemyNext = 1;

    let pSelectedIndex = 0;
    let eSelectedIndex = 0;

    let currentClashRound = 1;
    let pRemCoins = 0;
    let eRemCoins = 0;
    
    let pCoinStates = [];
    let eCoinStates = [];

    function changeTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('trpg_sim_theme', themeName);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('trpg_sim_theme') || 'limbus';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.getElementById('theme-select').value = savedTheme;
    }

    function toggleDefenseSlot(isPlayer) {
      const slots = isPlayer ? playerSlots : enemySlots;
      const btn = document.getElementById(isPlayer ? 'p-def-btn' : 'e-def-btn');
      
      if (slots[1] === 4) {
        slots[1] = 2;
        btn.classList.remove('active');
      } else {
        slots[1] = 4;
        btn.classList.add('active');
      }
      renderSlots();
    }

    function calculateHeadsChance(sanity) {
      let s = Number(sanity) || 0;
      let chance = 50 + s;
      if (chance > 95) chance = 95;
      if (chance < 5) chance = 5;
      return chance;
    }

    function updateHpDisplay() {
      validateInputs();
      ['p', 'e'].forEach(prefix => {
        let maxHp = parseInt(document.getElementById(`${prefix}-max-hp`).value) || 100;
        let hp = parseInt(document.getElementById(`${prefix}-hp`).value) || 0;
        if (hp > maxHp) { hp = maxHp; document.getElementById(`${prefix}-hp`).value = hp; }
        
        let pct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
        document.getElementById(`${prefix}-hp-bar`).style.width = `${pct}%`;
        document.getElementById(`${prefix}-hp-text`).innerText = `HP: ${hp} / ${maxHp}`;
      });
    }

    function applyDamage(isPlayer, amount) {
      if (amount <= 0) return;
      const prefix = isPlayer ? 'p' : 'e';
      let hpElem = document.getElementById(`${prefix}-hp`);
      let hp = parseInt(hpElem.value) || 0;
      hp = Math.max(0, hp - amount);
      hpElem.value = hp;
      updateHpDisplay();
    }

    function validateInputs() {
      let ps = document.getElementById('p-sanity');
      let es = document.getElementById('e-sanity');
      if (ps.value === '') ps.value = 0;
      if (es.value === '') es.value = 0;
      if (ps.value > 45) ps.value = 45; if (ps.value < -45) ps.value = -45;
      if (es.value > 45) es.value = 45; if (es.value < -45) es.value = -45;

      ['p', 'e'].forEach(prefix => {
        let maxHpElem = document.getElementById(`${prefix}-max-hp`);
        let hpElem = document.getElementById(`${prefix}-hp`);
        if (maxHpElem && (maxHpElem.value === '' || maxHpElem.value < 1)) maxHpElem.value = 100;
        if (hpElem && hpElem.value === '') hpElem.value = maxHpElem.value;

        [1, 2, 3, 4].forEach(num => {
          let coinsElem = document.getElementById(`${prefix}-s${num}-coins`);
          if (coinsElem) {
            if (coinsElem.value > 9) coinsElem.value = 9;
            if (coinsElem.value < 1 || coinsElem.value === '') coinsElem.value = 1;
          }
          let baseElem = document.getElementById(`${prefix}-s${num}-base`);
          if (baseElem && baseElem.value === '') baseElem.value = 0;
          let cpElem = document.getElementById(`${prefix}-s${num}-coinpower`);
          if (cpElem && cpElem.value === '') cpElem.value = 0;
        });
      });
    }

    function getSkillName(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      if (skillType === 4) {
        const subType = document.getElementById(`${prefix}-s4-type`)?.value || 'guard';
        const typeMap = { guard: '방어', evade: '회피', counter: '반격' };
        return `[수비] ${typeMap[subType]}`;
      }
      const inputVal = document.getElementById(`${prefix}-s${skillType}-name`)?.value;
      return inputVal && inputVal.trim() !== '' ? inputVal : `${skillType}스킬`;
    }

    function getSkillCoins(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const val = parseInt(document.getElementById(`${prefix}-s${skillType}-coins`)?.value);
      return isNaN(val) ? 1 : val;
    }

    function getSkillBasePower(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const val = parseInt(document.getElementById(`${prefix}-s${skillType}-base`)?.value);
      return isNaN(val) ? 0 : val;
    }

    function getSkillCoinPower(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const val = parseInt(document.getElementById(`${prefix}-s${skillType}-coinpower`)?.value);
      return isNaN(val) ? 0 : val;
    }

    function drawNextSkill(isPlayer) {
      let pool = isPlayer ? playerPool : enemyPool;
      if (pool.length === 0) pool = [...baseCycle];
      const idx = Math.floor(Math.random() * pool.length);
      const drawn = pool.splice(idx, 1)[0];
      if (isPlayer) playerPool = pool; else enemyPool = pool;
      return drawn;
    }

    function updateInfo() {
      validateInputs();
      const pSanity = document.getElementById('p-sanity').value;
      const eSanity = document.getElementById('e-sanity').value;
      document.getElementById('p-info').innerText = `앞면 확률: ${calculateHeadsChance(pSanity)}%`;
      document.getElementById('e-info').innerText = `앞면 확률: ${calculateHeadsChance(eSanity)}%`;
      renderSlots();
    }

    function selectSkill(isPlayer, index) {
      if (isPlayer) pSelectedIndex = index; else eSelectedIndex = index;
      renderSlots();
    }

    function savePreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const name = prompt("저장할 스킬 셋의 이름을 입력하세요:", isPlayer ? "아군 프리셋 1" : "적군 프리셋 1");
      if (!name || name.trim() === "") return;

      const presetData = {
        name: name.trim(),
        s1: { name: document.getElementById(`${prefix}-s1-name`).value, base: document.getElementById(`${prefix}-s1-base`).value, cp: document.getElementById(`${prefix}-s1-coinpower`).value, coins: document.getElementById(`${prefix}-s1-coins`).value },
        s2: { name: document.getElementById(`${prefix}-s2-name`).value, base: document.getElementById(`${prefix}-s2-base`).value, cp: document.getElementById(`${prefix}-s2-coinpower`).value, coins: document.getElementById(`${prefix}-s2-coins`).value },
        s3: { name: document.getElementById(`${prefix}-s3-name`).value, base: document.getElementById(`${prefix}-s3-base`).value, cp: document.getElementById(`${prefix}-s3-coinpower`).value, coins: document.getElementById(`${prefix}-s3-coins`).value },
        s4: { type: document.getElementById(`${prefix}-s4-type`).value, base: document.getElementById(`${prefix}-s4-base`).value, cp: document.getElementById(`${prefix}-s4-coinpower`).value, coins: document.getElementById(`${prefix}-s4-coins`).value }
      };

      let presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      presets.push(presetData);
      localStorage.setItem('trpg_skill_presets', JSON.stringify(presets));
      alert("스킬 셋이 저장되었습니다.");
      updatePresetDropdowns();
    }

    function updatePresetDropdowns() {
      const presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      ['p', 'e'].forEach(prefix => {
        const select = document.getElementById(`${prefix}-preset-select`);
        const currentVal = select.value;
        select.innerHTML = `<option value="">-- 저장된 스킬셋 선택 --</option>` +
          presets.map((p, idx) => `<option value="${idx}">${p.name}</option>`).join('');
        select.value = currentVal;
      });
    }

    function loadPreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const select = document.getElementById(`${prefix}-preset-select`);
      const idx = select.value;
      if (idx === "") return;

      const presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      const p = presets[idx];
      if (!p) return;

      document.getElementById(`${prefix}-s1-name`).value = p.s1.name;
      document.getElementById(`${prefix}-s1-base`).value = p.s1.base;
      document.getElementById(`${prefix}-s1-coinpower`).value = p.s1.cp;
      document.getElementById(`${prefix}-s1-coins`).value = p.s1.coins;

      document.getElementById(`${prefix}-s2-name`).value = p.s2.name;
      document.getElementById(`${prefix}-s2-base`).value = p.s2.base;
      document.getElementById(`${prefix}-s2-coinpower`).value = p.s2.cp;
      document.getElementById(`${prefix}-s2-coins`).value = p.s2.coins;

      document.getElementById(`${prefix}-s3-name`).value = p.s3.name;
      document.getElementById(`${prefix}-s3-base`).value = p.s3.base;
      document.getElementById(`${prefix}-s3-coinpower`).value = p.s3.cp;
      document.getElementById(`${prefix}-s3-coins`).value = p.s3.coins;

      if (p.s4) {
        document.getElementById(`${prefix}-s4-type`).value = p.s4.type;
        document.getElementById(`${prefix}-s4-base`).value = p.s4.base;
        document.getElementById(`${prefix}-s4-coinpower`).value = p.s4.cp;
        document.getElementById(`${prefix}-s4-coins`).value = p.s4.coins;
      }

      validateInputs();
      renderSlots();
    }

    function deletePreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const select = document.getElementById(`${prefix}-preset-select`);
      const idx = select.value;
      if (idx === "") { alert("삭제할 프리셋을 선택해주세요."); return; }

      let presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      if (confirm(`'${presets[idx].name}' 스킬셋을 삭제하시겠습니까?`)) {
        presets.splice(idx, 1);
        localStorage.setItem('trpg_skill_presets', JSON.stringify(presets));
        updatePresetDropdowns();
        renderSlots();
      }
    }

    function updateMatchupAnalysis() {
      const pType = playerSlots[pSelectedIndex];
      const eType = enemySlots[eSelectedIndex];

      if (pType === 4 || eType === 4) {
        document.getElementById('p-matchup').className = 'matchup-indicator balanced';
        document.getElementById('p-matchup').innerText = pType === 4 ? "수비 스킬 준비 중" : "공격 판정 중";
        document.getElementById('e-matchup').className = 'matchup-indicator balanced';
        document.getElementById('e-matchup').innerText = eType === 4 ? "수비 스킬 준비 중" : "공격 판정 중";
        return;
      }

      const pSanity = parseInt(document.getElementById('p-sanity').value) || 0;
      const eSanity = parseInt(document.getElementById('e-sanity').value) || 0;
      const pChance = calculateHeadsChance(pSanity) / 100;
      const eChance = calculateHeadsChance(eSanity) / 100;

      const pCoins = getSkillCoins(true, pType);
      const pBase = getSkillBasePower(true, pType);
      const pCP = getSkillCoinPower(true, pType);

      const eCoins = getSkillCoins(false, eType);
      const eBase = getSkillBasePower(false, eType);
      const eCP = getSkillCoinPower(false, eType);

      const diff = (pBase + (pCoins * pChance * pCP)) - (eBase + (eCoins * eChance * eCP));

      let pStatus = "", eStatus = "", pClass = "", eClass = "";
      if (diff >= 4.0) { pStatus = "VERY ADVANTAGE"; eStatus = "VERY DISADVANTAGE"; pClass = "very-advantage"; eClass = "very-disadvantage"; }
      else if (diff >= 1.5) { pStatus = "ADVANTAGE"; eStatus = "DISADVANTAGE"; pClass = "advantage"; eClass = "disadvantage"; }
      else if (diff <= -4.0) { pStatus = "VERY DISADVANTAGE"; eStatus = "VERY ADVANTAGE"; pClass = "very-disadvantage"; eClass = "very-advantage"; }
      else if (diff <= -1.5) { pStatus = "DISADVANTAGE"; eStatus = "ADVANTAGE"; pClass = "disadvantage"; eClass = "advantage"; }
      else { pStatus = "BALANCED"; eStatus = "BALANCED"; pClass = "balanced"; eClass = "balanced"; }

      const pIndicator = document.getElementById('p-matchup');
      const eIndicator = document.getElementById('e-matchup');
      pIndicator.className = `matchup-indicator ${pClass}`; pIndicator.innerText = pStatus;
      eIndicator.className = `matchup-indicator ${eClass}`; eIndicator.innerText = eStatus;
    }

    function renderSlots() {
      const pWrapper = document.getElementById('p-slots-display');
      const eWrapper = document.getElementById('e-slots-display');

      pWrapper.innerHTML = playerSlots.map((s, idx) => {
        const isSelected = idx === pSelectedIndex ? 'selected' : '';
        return `<span class="skill-badge s${s} ${isSelected}" onclick="selectSkill(true, ${idx})">${getSkillName(true, s)} (${getSkillCoins(true, s)}C)</span>`;
      }).join('');

      eWrapper.innerHTML = enemySlots.map((s, idx) => {
        const isSelected = idx === eSelectedIndex ? 'selected' : '';
        return `<span class="skill-badge s${s} ${isSelected}" onclick="selectSkill(false, ${idx})">${getSkillName(false, s)} (${getSkillCoins(false, s)}C)</span>`;
      }).join('');

      document.getElementById('p-next-display').innerHTML = `<span>[NEXT]:</span><span class="skill-badge next-badge s${playerNext}">${getSkillName(true, playerNext)} (${getSkillCoins(true, playerNext)}C)</span>`;
      document.getElementById('e-next-display').innerHTML = `<span>[NEXT]:</span><span class="skill-badge next-badge s${enemyNext}">${getSkillName(false, enemyNext)} (${getSkillCoins(false, enemyNext)}C)</span>`;

      document.getElementById('p-coin-preview').innerHTML = [1, 2, 3, 4].map(s => 
        `<div class="coin-preview-item">${getSkillName(true, s)}<br>위력 ${getSkillBasePower(true, s)}+${getSkillCoinPower(true, s)}<br><strong>${getSkillCoins(true, s)}C</strong></div>`
      ).join('');

      document.getElementById('e-coin-preview').innerHTML = [1, 2, 3, 4].map(s => 
        `<div class="coin-preview-item">${getSkillName(false, s)}<br>위력 ${getSkillBasePower(false, s)}+${getSkillCoinPower(false, s)}<br><strong>${getSkillCoins(false, s)}C</strong></div>`
      ).join('');

      updateHpDisplay();
      updateMatchupAnalysis();
    }

    function triggerSparks() {
      const layer = document.getElementById('spark-layer');
      layer.innerHTML = '';
      const sparkCount = 45;
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const c1 = currentTheme === 'ruina' ? '#38e8e5' : '#e6a100';
      const c2 = currentTheme === 'ruina' ? '#c59f52' : '#ff3322';

      for (let i = 0; i < sparkCount; i++) {
        const spark = document.createElement('div');
        spark.className = 'spark';
        const angle = Math.random() * Math.PI * 2;
        const distance = 90 + Math.random() * 180;
        spark.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
        spark.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
        spark.style.background = Math.random() > 0.5 ? c1 : c2;
        layer.appendChild(spark);
      }
      setTimeout(() => { layer.innerHTML = ''; }, 750);
    }

    function triggerShatterEffect(targetElem) {
      if (!targetElem) return;
      const rect = targetElem.getBoundingClientRect();
      const stageRect = document.getElementById('center-stage').getBoundingClientRect();
      const cx = rect.left - stageRect.left + rect.width / 2;
      const cy = rect.top - stageRect.top + rect.height / 2;
      const layer = document.getElementById('spark-layer');
      
      for (let i = 0; i < 18; i++) {
        const piece = document.createElement('div');
        piece.className = 'shatter-piece';
        piece.style.left = `${cx}px`; piece.style.top = `${cy}px`;
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 80;
        piece.style.setProperty('--sdx', `${Math.cos(angle) * speed}px`);
        piece.style.setProperty('--sdy', `${Math.sin(angle) * speed}px`);
        layer.appendChild(piece);
      }
    }

    function startMatch() {
      validateInputs();
      updateHpDisplay();

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];
      const isPDef = (pUsedType === 4);
      const isEDef = (eUsedType === 4);

      document.getElementById('clash-btn').disabled = true;
      document.getElementById('clash-round-badge').style.display = 'block';

      if (isPDef || isEDef) {
        runSequentialDefense(isPDef, isEDef);
        return;
      }

      const pTotal = getSkillCoins(true, pUsedType);
      const eTotal = getSkillCoins(false, eUsedType);
      pRemCoins = pTotal;
      eRemCoins = eTotal;
      pCoinStates = new Array(pTotal).fill('none');
      eCoinStates = new Array(eTotal).fill('none');
      currentClashRound = 1;

      runClashRound();
    }

    // 🛡️ 수비 시 코인별 순차 판정 로직 (회피/방어/반격)
    function runSequentialDefense(isPDef, isEDef) {
      document.getElementById('clash-round-badge').innerText = 'DEFENSE PHASE';

      const pSanity = parseInt(document.getElementById('p-sanity').value) || 0;
      const eSanity = parseInt(document.getElementById('e-sanity').value) || 0;
      const pChance = calculateHeadsChance(pSanity);
      const eChance = calculateHeadsChance(eSanity);

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      const pBase = getSkillBasePower(true, pUsedType);
      const pCP = getSkillCoinPower(true, pUsedType);
      const pCoinsCount = getSkillCoins(true, pUsedType);

      const eBase = getSkillBasePower(false, eUsedType);
      const eCP = getSkillCoinPower(false, eUsedType);
      const eCoinsCount = getSkillCoins(false, eUsedType);

      // DOM 렌더링 준비
      let pHTML = '';
      for (let i = 0; i < pCoinsCount; i++) pHTML += `<div class="coin flipping" id="p-coin-${i}"></div>`;
      let eHTML = '';
      for (let i = 0; i < eCoinsCount; i++) eHTML += `<div class="coin flipping" id="e-coin-${i}"></div>`;

      document.getElementById('p-result-skill-tag').innerHTML = `<span class="skill-badge s${pUsedType}">${getSkillName(true, pUsedType)}</span>`;
      document.getElementById('p-result-count-text').innerText = '수비 진행 중...';
      document.getElementById('p-power-score').innerText = 'POWER: -';
      document.getElementById('p-coins-stage').innerHTML = pHTML;

      document.getElementById('e-result-skill-tag').innerHTML = `<span class="skill-badge s${eUsedType}">${getSkillName(false, eUsedType)}</span>`;
      document.getElementById('e-result-count-text').innerText = '공격 진행 중...';
      document.getElementById('e-power-score').innerText = 'POWER: -';
      document.getElementById('e-coins-stage').innerHTML = eHTML;

      let step = 0;
      let maxSteps = Math.max(pCoinsCount, eCoinsCount);
      let pGuardShield = 0;
      let eGuardShield = 0;
      let pCounterDmg = 0;
      let eCounterDmg = 0;

      let interval = setInterval(() => {
        if (step < pCoinsCount) {
          const res = Math.random() * 100 < pChance;
          const val = pBase + (res ? pCP : 0);
          const elem = document.getElementById(`p-coin-${step}`);
          if (elem) {
            elem.className = `coin ${res ? 'heads' : 'tails'}`;
            elem.innerHTML = `<span class="coin-sub">${val}</span>`;
          }
          if (isPDef) {
            const defType = document.getElementById('p-s4-type').value;
            if (defType === 'guard') pGuardShield += val;
            if (defType === 'counter') pCounterDmg += val;
          }
        }

        if (step < eCoinsCount) {
          const res = Math.random() * 100 < eChance;
          const val = eBase + (res ? eCP : 0);
          const elem = document.getElementById(`e-coin-${step}`);
          if (elem) {
            elem.className = `coin ${res ? 'heads' : 'tails'}`;
            elem.innerHTML = `<span class="coin-sub">${val}</span>`;
          }
          if (isEDef) {
            const defType = document.getElementById('e-s4-type').value;
            if (defType === 'guard') eGuardShield += val;
            if (defType === 'counter') eCounterDmg += val;
          }
        }

        // 수비 vs 공격 1대1 매칭 판정 (순차적)
        if (isPDef && !isEDef && step < eCoinsCount) {
          const defType = document.getElementById('p-s4-type').value;
          const eVal = eBase + (Math.random() * 100 < eChance ? eCP : 0);
          const pVal = pBase + (Math.random() * 100 < pChance ? pCP : 0);

          if (defType === 'evade') {
            if (pVal >= eVal) {
              document.getElementById('clash-status-text').innerHTML = `<span style="color:#38ef7d;">회피 성공! (회피 ${pVal} vs 공격 ${eVal})</span>`;
            } else {
              let dmg = Math.max(1, eVal - pGuardShield);
              pGuardShield = Math.max(0, pGuardShield - eVal);
              applyDamage(true, dmg);
              document.getElementById('clash-status-text').innerHTML = `<span style="color:#ff3322;">회피 실패! 아군 ${dmg} 데미지!</span>`;
            }
          } else if (defType === 'guard') {
            let dmg = Math.max(0, eVal - pGuardShield);
            pGuardShield = Math.max(0, pGuardShield - eVal);
            applyDamage(true, dmg);
            document.getElementById('clash-status-text').innerHTML = `<span style="color:#ffd166;">방어막으로 경감! 아군 ${dmg} 데미지!</span>`;
          }
        } else if (!isPDef && isEDef && step < pCoinsCount) {
          const defType = document.getElementById('e-s4-type').value;
          const pVal = pBase + (Math.random() * 100 < pChance ? pCP : 0);
          const eVal = eBase + (Math.random() * 100 < eChance ? eCP : 0);

          if (defType === 'evade') {
            if (eVal >= pVal) {
              document.getElementById('clash-status-text').innerHTML = `<span style="color:#ff3322;">적 회피 성공! (적 회피 ${eVal} vs 아군 ${pVal})</span>`;
            } else {
              applyDamage(false, pVal);
              document.getElementById('clash-status-text').innerHTML = `<span style="color:#38ef7d;">적 회피 실패! 적에게 ${pVal} 데미지!</span>`;
            }
          } else if (defType === 'guard') {
            let dmg = Math.max(0, pVal - eGuardShield);
            eGuardShield = Math.max(0, eGuardShield - pVal);
            applyDamage(false, dmg);
            document.getElementById('clash-status-text').innerHTML = `<span style="color:#ffd166;">적 방어! 적에게 ${dmg} 데미지!</span>`;
          }
        }

        step++;
        if (step >= maxSteps) {
          clearInterval(interval);
          // 반격(Counter) 후속 처리: 공격 판정이 모두 끝난 뒤 적/아군을 타격
          if (isPDef && !isEDef) {
            const defType = document.getElementById('p-s4-type').value;
            if (defType === 'counter' && pCounterDmg > 0) {
              applyDamage(false, pCounterDmg);
              document.getElementById('clash-status-text').innerHTML += `<br><span style="color:#38e8e5;">[반격 성공] 적에게 총 ${pCounterDmg} 반격 데미지!</span>`;
            }
          } else if (!isPDef && isEDef) {
            const defType = document.getElementById('e-s4-type').value;
            if (defType === 'counter' && eCounterDmg > 0) {
              applyDamage(true, eCounterDmg);
              document.getElementById('clash-status-text').innerHTML += `<br><span style="color:#38e8e5;">[적 반격 성공] 아군에게 총 ${eCounterDmg} 반격 데미지!</span>`;
            }
          }
          setTimeout(() => { finishMatch(); }, 1600);
        }
      }, 500);
    }

    function runClashRound() {
      const pSanity = parseInt(document.getElementById('p-sanity').value) || 0;
      const pChance = calculateHeadsChance(pSanity);
      const eSanity = parseInt(document.getElementById('e-sanity').value) || 0;
      const eChance = calculateHeadsChance(eSanity);

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      const pTotalMax = getSkillCoins(true, pUsedType);
      const eTotalMax = getSkillCoins(false, eUsedType);
      const pBase = getSkillBasePower(true, pUsedType);
      const pCP = getSkillCoinPower(true, pUsedType);
      const eBase = getSkillBasePower(false, eUsedType);
      const eCP = getSkillCoinPower(false, eUsedType);

      document.getElementById('clash-round-badge').innerText = `ROUND ${currentClashRound}`;
      document.getElementById('clash-status-text').innerHTML = `<span style="color: var(--accent-color); font-weight: bold;">ROUND ${currentClashRound} CLASHING...</span>`;
      document.querySelectorAll('.coin').forEach(c => c.classList.remove('win-glow'));

      let playerRolls = [], playerHeads = 0, activePIndices = [];
      for (let i = 0; i < pTotalMax; i++) {
        if (!pCoinStates[i].startsWith('broken')) {
          activePIndices.push(i);
          const roll = Math.random() * 100;
          const isHeads = roll < pChance;
          if (isHeads) playerHeads++;
          playerRolls.push({ isHeads, roll: roll.toFixed(1) });
        }
      }

      let enemyRolls = [], enemyHeads = 0, activeEIndices = [];
      for (let i = 0; i < eTotalMax; i++) {
        if (!eCoinStates[i].startsWith('broken')) {
          activeEIndices.push(i);
          const roll = Math.random() * 100;
          const isHeads = roll < eChance;
          if (isHeads) enemyHeads++;
          enemyRolls.push({ isHeads, roll: roll.toFixed(1) });
        }
      }

      const playerFinalPower = pBase + (playerHeads * pCP);
      const enemyFinalPower = eBase + (enemyHeads * eCP);

      let pHTML = '';
      for (let i = 0; i < pTotalMax; i++) {
        pHTML += pCoinStates[i].startsWith('broken') ? `<div class="coin ${pCoinStates[i]}"></div>` : `<div class="coin flipping" id="p-coin-${i}"></div>`;
      }
      let eHTML = '';
      for (let i = 0; i < eTotalMax; i++) {
        eHTML += eCoinStates[i].startsWith('broken') ? `<div class="coin ${eCoinStates[i]}"></div>` : `<div class="coin flipping" id="e-coin-${i}"></div>`;
      }

      document.getElementById('p-result-skill-tag').innerHTML = `<span class="skill-badge s${pUsedType}">${getSkillName(true, pUsedType)}</span>`;
      document.getElementById('p-result-count-text').innerText = '판정 중...';
      document.getElementById('p-power-score').innerText = 'POWER: -';
      document.getElementById('p-coins-stage').innerHTML = pHTML;

      document.getElementById('e-result-skill-tag').innerHTML = `<span class="skill-badge s${eUsedType}">${getSkillName(false, eUsedType)}</span>`;
      document.getElementById('e-result-count-text').innerText = '판정 중...';
      document.getElementById('e-power-score').innerText = 'POWER: -';
      document.getElementById('e-coins-stage').innerHTML = eHTML;

      const maxStep = Math.max(activePIndices.length, activeEIndices.length);
      const fixedTotalDuration = 500;

      for (let i = 0; i < maxStep; i++) {
        setTimeout(() => {
          if (i < activePIndices.length) {
            const coinIdx = activePIndices[i];
            const pElem = document.getElementById(`p-coin-${coinIdx}`);
            if (pElem) {
              const res = playerRolls[i];
              pCoinStates[coinIdx] = res.isHeads ? 'heads' : 'tails';
              pElem.className = `coin ${res.isHeads ? 'heads' : 'tails'}`;
              pElem.innerHTML = `<span class="coin-sub">${res.roll}%</span>`;
            }
          }
          if (i < activeEIndices.length) {
            const coinIdx = activeEIndices[i];
            const eElem = document.getElementById(`e-coin-${coinIdx}`);
            if (eElem) {
              const res = enemyRolls[i];
              eCoinStates[coinIdx] = res.isHeads ? 'heads' : 'tails';
              eElem.className = `coin ${res.isHeads ? 'heads' : 'tails'}`;
              eElem.innerHTML = `<span class="coin-sub">${res.roll}%</span>`;
            }
          }
        }, fixedTotalDuration);
      }

      setTimeout(() => {
        document.getElementById('p-result-count-text').innerText = `HEADS ${playerHeads} / ${pRemCoins}`;
        document.getElementById('e-result-count-text').innerText = `HEADS ${enemyHeads} / ${eRemCoins}`;
        document.getElementById('p-power-score').innerText = `POWER: ${playerFinalPower}`;
        document.getElementById('e-power-score').innerText = `POWER: ${enemyFinalPower}`;

        triggerSparks();

        if (playerFinalPower === enemyFinalPower) {
          document.getElementById('clash-status-text').innerHTML = `<div class="result-banner clash">DRAW (RE-TRY)</div>`;
          currentClashRound++; 
          setTimeout(() => { runClashRound(); }, 400);

        } else if (playerFinalPower > enemyFinalPower) {
          const breakCoinIdx = activeEIndices[activeEIndices.length - 1];
          const breakTarget = document.getElementById(`e-coin-${breakCoinIdx}`);
          triggerShatterEffect(breakTarget);
          
          const isHeadsTarget = eCoinStates[breakCoinIdx] === 'heads';
          eCoinStates[breakCoinIdx] = isHeadsTarget ? 'broken-heads' : 'broken-tails';
          if (breakTarget) { breakTarget.className = `coin ${eCoinStates[breakCoinIdx]}`; breakTarget.innerHTML = ''; }

          eRemCoins--;

          if (eRemCoins > 0) {
            document.getElementById('clash-status-text').innerHTML = `<div class="result-banner player">CLASH WIN</div>`;
            currentClashRound++; 
            setTimeout(() => { runClashRound(); }, 500);
          } else {
            // ⚔️ 합 승리 후 남은 코인들로 적을 '하나씩 순차 타격'
            document.getElementById('clash-status-text').innerHTML = `<div class="result-banner player">PLAYER WIN (ONE-SIDED ATTACK)</div>`;
            
            let activeWins = activePIndices.filter(idx => !pCoinStates[idx].startsWith('broken'));
            let hitIndex = 0;

            let hitInterval = setInterval(() => {
              if (hitIndex < activeWins.length) {
                let idx = activeWins[hitIndex];
                let elem = document.getElementById(`p-coin-${idx}`);
                if (elem) elem.classList.add('win-glow');

                let coinDmg = pBase + (pCoinStates[idx] === 'heads' ? pCP : 0);
                applyDamage(false, coinDmg);

                document.getElementById('clash-status-text').innerHTML = `
                  <div class="result-banner player">SEQUENTIAL STRIKE (${hitIndex + 1}/${activeWins.length})</div>
                  <div style="font-size:0.9rem; color:#38ef7d;">적에게 ${coinDmg} 데미지 타격!</div>
                `;
                hitIndex++;
              } else {
                clearInterval(hitInterval);
                setTimeout(() => { finishMatch(); }, 1000);
              }
            }, 400);
          }

        } else {
          const breakCoinIdx = activePIndices[activePIndices.length - 1];
          const breakTarget = document.getElementById(`p-coin-${breakCoinIdx}`);
          triggerShatterEffect(breakTarget);

          const isHeadsTarget = pCoinStates[breakCoinIdx] === 'heads';
          pCoinStates[breakCoinIdx] = isHeadsTarget ? 'broken-heads' : 'broken-tails';
          if (breakTarget) { breakTarget.className = `coin ${pCoinStates[breakCoinIdx]}`; breakTarget.innerHTML = ''; }

          pRemCoins--;

          if (pRemCoins > 0) {
            document.getElementById('clash-status-text').innerHTML = `<div class="result-banner enemy">CLASH LOSE</div>`;
            currentClashRound++; 
            setTimeout(() => { runClashRound(); }, 500);
          } else {
            // ⚔️ 합 패배 후 적이 남은 코인들로 아군을 '하나씩 순차 타격'
            document.getElementById('clash-status-text').innerHTML = `<div class="result-banner enemy">ENEMY WIN (ONE-SIDED ATTACK)</div>`;
            
            let activeWins = activeEIndices.filter(idx => !eCoinStates[idx].startsWith('broken'));
            let hitIndex = 0;

            let hitInterval = setInterval(() => {
              if (hitIndex < activeWins.length) {
                let idx = activeWins[hitIndex];
                let elem = document.getElementById(`e-coin-${idx}`);
                if (elem) elem.classList.add('win-glow');

                let coinDmg = eBase + (eCoinStates[idx] === 'heads' ? eCP : 0);
                applyDamage(true, coinDmg);

                document.getElementById('clash-status-text').innerHTML = `
                  <div class="result-banner enemy">ENEMY STRIKE (${hitIndex + 1}/${activeWins.length})</div>
                  <div style="font-size:0.9rem; color:#ff3322;">아군에게 ${coinDmg} 피격!</div>
                `;
                hitIndex++;
              } else {
                clearInterval(hitInterval);
                setTimeout(() => { finishMatch(); }, 1000);
              }
            }, 400);
          }
        }
      }, fixedTotalDuration + 100);
    }

    function finishMatch() {
      playerSlots[pSelectedIndex] = playerNext;
      enemySlots[eSelectedIndex] = enemyNext;
      playerNext = drawNextSkill(true);
      enemyNext = drawNextSkill(false);
      renderSlots();
      document.getElementById('clash-btn').disabled = false;
    }

    initTheme();
    playerNext = drawNextSkill(true);
    enemyNext = drawNextSkill(false);
    updatePresetDropdowns();
    updateInfo();
  </script>
</body>
</html>

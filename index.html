<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG 스킬 슬롯 & 순차 연출 시뮬레이터</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121214;
      color: #eeeeee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background-color: #1e1e24;
      padding: 1.8rem;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      width: 100%;
      max-width: 1000px;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #ff4757;
    }

    /* 좌/우 설정창 레이아웃 */
    .arena {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.2rem;
    }
    @media (max-width: 768px) {
      .arena { grid-template-columns: 1fr; }
    }
    .side-box {
      background: #25252e;
      padding: 1.2rem;
      border-radius: 10px;
      border-top: 4px solid #555;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .side-box.player { border-color: #2ed573; }
    .side-box.enemy { border-color: #ff4757; }
    
    .side-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 0.8rem;
      text-align: center;
    }
    .player .side-title { color: #2ed573; }
    .enemy .side-title { color: #ff4757; }

    /* 슬롯 및 NEXT 표시 영역 */
    .slot-container {
      width: 100%;
      background: #18181c;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 0.6rem;
      margin-bottom: 0.8rem;
      text-align: center;
    }
    .slot-header {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 0.4rem;
    }
    .slots-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
    }
    .next-box {
      margin-top: 0.5rem;
      padding-top: 0.4rem;
      border-top: 1px dashed #444;
      font-size: 0.8rem;
      color: #ffa502;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .skill-badge {
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      background: #333;
      color: #fff;
      border: 2px solid #555;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .skill-badge:hover { transform: translateY(-2px); }
    .skill-badge.s1 { background: #2f3542; color: #70a1ff; border-color: #1e90ff; }
    .skill-badge.s2 { background: #1e3799; color: #6a89cc; border-color: #4a69bd; }
    .skill-badge.s3 { background: #b71540; color: #ffffff; border-color: #ff6b81; }
    
    .skill-badge.selected {
      border-color: #ffa502 !important;
      box-shadow: 0 0 10px #ffa502;
      transform: scale(1.05);
    }
    .skill-badge.next-badge {
      cursor: default;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      opacity: 0.85;
    }

    /* 스킬별 설정 테이블 */
    .skill-config-box {
      width: 100%;
      background: #18181c;
      padding: 0.61rem;
      border-radius: 6px;
      margin-bottom: 0.8rem;
    }
    .skill-config-title {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 0.4rem;
      text-align: center;
    }
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .config-card {
      background: #25252e;
      padding: 0.4rem;
      border-radius: 6px;
      text-align: center;
    }
    .config-card label {
      font-size: 0.75rem;
      color: #ccc;
      display: block;
      margin-bottom: 2px;
    }
    .config-card input[type="text"] {
      font-size: 0.75rem !important;
      padding: 0.3rem !important;
      text-align: center;
      margin-bottom: 4px;
    }
    .config-card input[type="number"] {
      font-size: 0.75rem !important;
      padding: 0.3rem !important;
      text-align: center;
    }

    .coin-preview-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      width: 100%;
      margin-top: 0.4rem;
    }
    .coin-preview-item {
      font-size: 0.72rem;
      padding: 0.3rem;
      border-radius: 4px;
      background: #18181c;
      color: #ffa502;
      text-align: center;
      border: 1px solid #333;
    }

    .control-group {
      width: 100%;
      margin-bottom: 0.8rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.3rem;
      color: #ccc;
    }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 0.55rem;
      background: #18181c;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    input[type="number"]:focus, input[type="text"]:focus {
      border-color: #ff4757;
      outline: none;
    }
    
    .info-badge {
      width: 100%;
      background: #18181c;
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 0.3rem;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background-color: #ff4757;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    button:hover { background-color: #ff6b81; }
    button:disabled { background-color: #555 !important; color: #888; cursor: not-allowed; }

    /* 중앙 코인 연출 영역 */
    .clash-display {
      margin-top: 1.2rem;
      padding: 1.2rem;
      background-color: #18181c;
      border-radius: 10px;
      min-height: 200px;
    }
    .clash-center-arena {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 0.8rem;
    }
    .result-banner {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 0.8rem;
    }
    .result-banner.player { color: #2ed573; }
    .result-banner.enemy { color: #ff4757; }
    .result-banner.draw { color: #ffa502; }

    .coins-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 0.8rem;
    }
    .coin {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.8rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .coin.flipping {
      animation: coinFlip 0.3s infinite linear;
      background-color: #ffa502;
      color: #121214;
    }
    .coin.heads {
      background-color: #2ed573;
      color: #121214;
      transform: scale(1.1);
    }
    .coin.tails {
      background-color: #747d8c;
      color: #ffffff;
      transform: scale(1);
    }
    
    @keyframes coinFlip {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }
    .coin-sub { font-size: 0.65rem; opacity: 0.85; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>⚔️ TRPG 코인 순차 판정 시뮬레이터</h1>

    <div class="arena">
      <!-- 아군 설정창 (왼쪽) -->
      <div class="side-box player">
        <div class="side-title">🛡️ 아군 (Player)</div>
        
        <div class="slot-container">
          <div class="slot-header">현재 보유 스킬 슬롯 (클릭하여 사용할 스킬 선택)</div>
          <div class="slots-wrapper" id="p-slots-display"></div>
          <div class="next-box" id="p-next-display">
            <span>[NEXT]:</span>
            <span class="skill-badge next-badge s1">1스킬</span>
          </div>
        </div>

        <div class="skill-config-box">
          <div class="skill-config-title">스킬 이름 & 코인 개수 설정</div>
          <div class="config-grid">
            <div class="config-card">
              <label>1스킬</label>
              <input type="text" id="p-s1-name" value="1스킬" onchange="renderSlots()">
              <label>코인 수</label>
              <input type="number" id="p-s1-coins" value="1" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>2스킬</label>
              <input type="text" id="p-s2-name" value="2스킬" onchange="renderSlots()">
              <label>코인 수</label>
              <input type="number" id="p-s2-coins" value="2" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>3스킬</label>
              <input type="text" id="p-s3-name" value="3스킬" onchange="renderSlots()">
              <label>코인 수</label>
              <input type="number" id="p-s3-coins" value="3" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
          </div>
          <div class="coin-preview-box" id="p-coin-preview"></div>
        </div>

        <div class="control-group">
          <label for="p-sanity">정신력 (-45 ~ +45)</label>
          <input type="number" id="p-sanity" value="0" min="-45" max="45" onchange="validateInputs(); updateInfo();">
        </div>

        <div class="info-badge" id="p-info">앞면 확률: 50%</div>
      </div>

      <!-- 적군 설정창 (오른쪽) -->
      <div class="side-box enemy">
        <div class="side-title">⚔️ 적군 (Enemy)</div>
        
        <div class="slot-container">
          <div class="slot-header">현재 보유 스킬 슬롯 (클릭하여 사용할 스킬 선택)</div>
          <div class="slots-wrapper" id="e-slots-display"></div>
          <div class="next-box" id="e-next-display">
            <span>[NEXT]:</span>
            <span class="skill-badge next-badge s1">1스킬</span>
          </div>
        </div>

        <div class="skill-config-box">
          <div class="skill-config-title">스킬 이름 & 코인 개수 설정</div>
          <div class="config-grid">
            <div class="config-card">
              <label>1스킬</label>
              <input type="text" id="e-s1-name" value="1스킬" onchange="renderSlots()">
              <label>코인 수</label>
              <input type="number" id="e-s1-coins" value="1" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>2스킬</label>
              <input type="text" id="e-s2-name" value="2스킬" onchange="renderSlots()">
              <label>코인 수</label>
              <input type="number" id="e-s2-coins" value="2" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>3스킬</label>
              <input type="text" id="e-s3-name" value="3스킬" onchange="renderSlots()">
              <label>코인 수</label>
              <input type="number" id="e-s3-coins" value="3" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
          </div>
          <div class="coin-preview-box" id="e-coin-preview"></div>
        </div>

        <div class="control-group">
          <label for="e-sanity">정신력 (-45 ~ +45)</label>
          <input type="number" id="e-sanity" value="0" min="-45" max="45" onchange="validateInputs(); updateInfo();">
        </div>

        <div class="info-badge" id="e-info">앞면 확률: 50%</div>
      </div>
    </div>

    <button id="clash-btn" onclick="startClash()">⚔️ 선택된 스킬로 판정 진행</button>

    <!-- 중앙 코인 결과 연출 구역 -->
    <div class="clash-display" id="result-box">
      <span style="color: #888;">원하는 스킬을 선택한 후 판정을 진행하세요.</span>
    </div>
  </div>

  <script>
    const baseCycle = [1, 1, 1, 2, 2, 3];
    let playerPool = [];
    let enemyPool = [];

    let playerSlots = [1, 2];
    let enemySlots = [1, 2];

    let playerNext = 1;
    let enemyNext = 1;

    let pSelectedIndex = 0;
    let eSelectedIndex = 0;

    function calculateHeadsChance(sanity) {
      let s = Number(sanity) || 0;
      let chance = 50 + s;
      if (chance > 95) chance = 95;
      if (chance < 5) chance = 5;
      return chance;
    }

    function validateInputs() {
      let ps = document.getElementById('p-sanity');
      let es = document.getElementById('e-sanity');

      if (ps.value === '') ps.value = 0;
      if (es.value === '') es.value = 0;

      if (ps.value > 45) ps.value = 45;
      if (ps.value < -45) ps.value = -45;
      if (es.value > 45) es.value = 45;
      if (es.value < -45) es.value = -45;

      ['p', 'e'].forEach(prefix => {
        [1, 2, 3].forEach(num => {
          let elem = document.getElementById(`${prefix}-s${num}-coins`);
          if (elem) {
            if (elem.value > 9) elem.value = 9;
            if (elem.value < 1 || elem.value === '') elem.value = 1;
          }
        });
      });
    }

    function getSkillName(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const inputVal = document.getElementById(`${prefix}-s${skillType}-name`)?.value;
      return inputVal && inputVal.trim() !== '' ? inputVal : `${skillType}스킬`;
    }

    function getSkillCoins(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const val = parseInt(document.getElementById(`${prefix}-s${skillType}-coins`)?.value);
      return isNaN(val) ? 1 : val;
    }

    function drawNextSkill(isPlayer) {
      let pool = isPlayer ? playerPool : enemyPool;
      if (pool.length === 0) {
        pool = [...baseCycle];
      }
      const idx = Math.floor(Math.random() * pool.length);
      const drawn = pool.splice(idx, 1)[0];

      if (isPlayer) playerPool = pool;
      else enemyPool = pool;

      return drawn;
    }

    function updateInfo() {
      validateInputs();
      const pSanity = document.getElementById('p-sanity').value;
      const eSanity = document.getElementById('e-sanity').value;

      document.getElementById('p-info').innerText = `앞면 확률: ${calculateHeadsChance(pSanity)}%`;
      document.getElementById('e-info').innerText = `앞면 확률: ${calculateHeadsChance(eSanity)}%`;

      renderSlots();
    }

    function selectSkill(isPlayer, index) {
      if (isPlayer) pSelectedIndex = index;
      else eSelectedIndex = index;
      renderSlots();
    }

    function renderSlots() {
      const pWrapper = document.getElementById('p-slots-display');
      const eWrapper = document.getElementById('e-slots-display');

      pWrapper.innerHTML = playerSlots.map((s, idx) => {
        const isSelected = idx === pSelectedIndex ? 'selected' : '';
        const name = getSkillName(true, s);
        const coins = getSkillCoins(true, s);
        return `<span class="skill-badge s${s} ${isSelected}" onclick="selectSkill(true, ${idx})">${name} (${coins}코인)</span>`;
      }).join('');

      eWrapper.innerHTML = enemySlots.map((s, idx) => {
        const isSelected = idx === eSelectedIndex ? 'selected' : '';
        const name = getSkillName(false, s);
        const coins = getSkillCoins(false, s);
        return `<span class="skill-badge s${s} ${isSelected}" onclick="selectSkill(false, ${idx})">${name} (${coins}코인)</span>`;
      }).join('');

      const pNextName = getSkillName(true, playerNext);
      const pNextCoins = getSkillCoins(true, playerNext);
      document.getElementById('p-next-display').innerHTML = `
        <span>[NEXT]:</span>
        <span class="skill-badge next-badge s${playerNext}">${pNextName} (${pNextCoins}코인)</span>
      `;

      const eNextName = getSkillName(false, enemyNext);
      const eNextCoins = getSkillCoins(false, enemyNext);
      document.getElementById('e-next-display').innerHTML = `
        <span>[NEXT]:</span>
        <span class="skill-badge next-badge s${enemyNext}">${eNextName} (${eNextCoins}코인)</span>
      `;

      document.getElementById('p-coin-preview').innerHTML = [1, 2, 3].map(s => 
        `<div class="coin-preview-item">${getSkillName(true, s)}: <strong>${getSkillCoins(true, s)}코인</strong></div>`
      ).join('');

      document.getElementById('e-coin-preview').innerHTML = [1, 2, 3].map(s => 
        `<div class="coin-preview-item">${getSkillName(false, s)}: <strong>${getSkillCoins(false, s)}코인</strong></div>`
      ).join('');
    }

    function startClash() {
      validateInputs();

      const btnC = document.getElementById('clash-btn');
      const resultBox = document.getElementById('result-box');

      btnC.disabled = true;

      const pSanity = parseInt(document.getElementById('p-sanity').value) || 0;
      const pChance = calculateHeadsChance(pSanity);

      const eSanity = parseInt(document.getElementById('e-sanity').value) || 0;
      const eChance = calculateHeadsChance(eSanity);

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      const playerCount = getSkillCoins(true, pUsedType);
      const enemyCount = getSkillCoins(false, eUsedType);

      const pSkillName = getSkillName(true, pUsedType);
      const eSkillName = getSkillName(false, eUsedType);

      // 독립 시행 결과 준비
      let playerCoins = [];
      let playerHeads = 0;
      for (let i = 0; i < playerCount; i++) {
        const roll = Math.random() * 100;
        const isHeads = roll < pChance;
        if (isHeads) playerHeads++;
        playerCoins.push({ isHeads, roll: roll.toFixed(1) });
      }

      let enemyCoins = [];
      let enemyHeads = 0;
      for (let i = 0; i < enemyCount; i++) {
        const roll = Math.random() * 100;
        const isHeads = roll < eChance;
        if (isHeads) enemyHeads++;
        enemyCoins.push({ isHeads, roll: roll.toFixed(1) });
      }

      // 회전 중인 초기 상태 표시
      let pSpinningHTML = '';
      for(let i = 0; i < playerCount; i++) {
        pSpinningHTML += `<div class="coin flipping" id="p-coin-${i}">?</div>`;
      }

      let eSpinningHTML = '';
      for(let i = 0; i < enemyCount; i++) {
        eSpinningHTML += `<div class="coin flipping" id="e-coin-${i}">?</div>`;
      }

      resultBox.innerHTML = `
        <div id="clash-status-text" style="color: #ffa502; font-weight: bold; margin-bottom: 0.4rem;">코인을 던지는 중...</div>
        <div class="clash-center-arena">
          <div>
            <div><span class="skill-badge s${pUsedType}">${pSkillName} 사용</span></div>
            <div class="coins-wrapper">${pSpinningHTML}</div>
          </div>
          <div>
            <div><span class="skill-badge s${eUsedType}">${eSkillName} 사용</span></div>
            <div class="coins-wrapper">${eSpinningHTML}</div>
          </div>
        </div>
      `;

      // 코인 1개씩 순차적으로 멈추는 애니메이션 (박진감 강화)
      const maxCoins = Math.max(playerCount, enemyCount);
      const stepDelay = 350; // 0.35초 간격으로 하나씩 멈춤

      for (let i = 0; i < maxCoins; i++) {
        setTimeout(() => {
          // 아군 코인 공개
          if (i < playerCount) {
            const pElem = document.getElementById(`p-coin-${i}`);
            if (pElem) {
              const c = playerCoins[i];
              pElem.className = `coin ${c.isHeads ? 'heads' : 'tails'}`;
              pElem.innerHTML = `${c.isHeads ? '앞면' : '뒷면'}<span class="coin-sub">${c.roll}%</span>`;
            }
          }
          // 적군 코인 공개
          if (i < enemyCount) {
            const eElem = document.getElementById(`e-coin-${i}`);
            if (eElem) {
              const c = enemyCoins[i];
              eElem.className = `coin ${c.isHeads ? 'heads' : 'tails'}`;
              eElem.innerHTML = `${c.isHeads ? '앞면' : '뒷면'}<span class="coin-sub">${c.roll}%</span>`;
            }
          }
        }, (i + 1) * stepDelay);
      }

      // 모든 코인이 멈춘 후 최종 승패 결과 공개
      const totalAnimTime = (maxCoins + 1) * stepDelay;
      setTimeout(() => {
        let resultText = "무승부 (DRAW)";
        let winner = "draw";
        if (playerHeads > enemyHeads) {
          resultText = "아군 승리! (PLAYER WIN)";
          winner = "player";
        } else if (enemyHeads > playerHeads) {
          resultText = "적군 승리! (ENEMY WIN)";
          winner = "enemy";
        }

        const statusText = document.getElementById('clash-status-text');
        if (statusText) {
          statusText.innerHTML = `<span class="result-banner ${winner}">${resultText}</span> (아군 앞면: ${playerHeads} / 적군 앞면: ${enemyHeads})`;
        }

        // 스킬 소모 및 NEXT 보충
        playerSlots[pSelectedIndex] = playerNext;
        enemySlots[eSelectedIndex] = enemyNext;

        playerNext = drawNextSkill(true);
        enemyNext = drawNextSkill(false);

        renderSlots();
        btnC.disabled = false;
      }, totalAnimTime);
    }

    playerNext = drawNextSkill(true);
    enemyNext = drawNextSkill(false);
    updateInfo();
  </script>
</body>
</html>

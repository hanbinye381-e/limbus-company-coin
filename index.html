<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG 중앙 코인 대결 시뮬레이터</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0d0f;
      color: #e2e2e6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem 2rem;
      overflow-x: hidden;
    }
    
    .main-wrapper {
      width: 100%;
      max-width: 1800px;
    }
    h1 {
      font-size: 1.7rem;
      margin-bottom: 1.5rem;
      color: #ff4757;
      text-align: center;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(255, 71, 87, 0.3);
    }

    .battle-layout {
      display: grid;
      grid-template-columns: 420px 1fr 420px;
      gap: 1.8rem;
      align-items: start;
    }

    @media (max-width: 1200px) {
      .battle-layout {
        grid-template-columns: 1fr;
      }
    }

    .side-box {
      background: #16161a;
      padding: 1.4rem;
      border-radius: 12px;
      border: 1px solid #2a2a35;
      border-top: 4px solid #555;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .side-box.player { border-top-color: #2ed573; }
    .side-box.enemy { border-top-color: #ff4757; }

    .side-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .player .side-title { color: #2ed573; }
    .enemy .side-title { color: #ff4757; }

    .slot-container {
      width: 100%;
      background: #111115;
      border: 1px solid #282832;
      border-radius: 8px;
      padding: 0.8rem;
      margin-bottom: 0.9rem;
      text-align: center;
    }
    .slot-header {
      font-size: 0.75rem;
      color: #888892;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .slots-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
    }
    .next-box {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px dashed #2a2a35;
      font-size: 0.75rem;
      color: #fbc531;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .matchup-indicator {
      margin-top: 0.7rem;
      padding: 0.45rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      text-align: center;
      background: #16161a;
      border: 1px solid #333340;
    }
    .matchup-indicator.very-advantage { color: #2ed573; border-color: #2ed573; background: rgba(46, 213, 115, 0.05); }
    .matchup-indicator.advantage { color: #70a1ff; border-color: #1e90ff; background: rgba(112, 161, 255, 0.05); }
    .matchup-indicator.balanced { color: #fbc531; border-color: #fbc531; background: rgba(251, 197, 49, 0.05); }
    .matchup-indicator.disadvantage { color: #ff6b81; border-color: #ff4757; background: rgba(255, 107, 129, 0.05); }
    .matchup-indicator.very-disadvantage { color: #ff4757; background: rgba(255, 71, 87, 0.1); border-color: #ff4757; }

    .skill-badge {
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      background: #22222a;
      color: #fff;
      border: 1px solid #444452;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .skill-badge:hover { transform: translateY(-2px); border-color: #666; }
    .skill-badge.s1 { background: #1a2639; color: #70a1ff; border-color: #29487d; }
    .skill-badge.s2 { background: #172042; color: #8293c7; border-color: #2a3b75; }
    .skill-badge.s3 { background: #3c141d; color: #ff8795; border-color: #752233; }
    
    .skill-badge.selected {
      border-color: #fbc531 !important;
      box-shadow: 0 0 10px rgba(251, 197, 49, 0.4);
      transform: scale(1.04);
    }
    .skill-badge.next-badge {
      cursor: default;
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      opacity: 0.9;
    }

    .skill-config-box {
      width: 100%;
      background: #111115;
      border: 1px solid #282832;
      padding: 0.8rem;
      border-radius: 8px;
      margin-bottom: 0.9rem;
    }
    .skill-config-title {
      font-size: 0.75rem;
      color: #888892;
      margin-bottom: 0.6rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .config-card {
      background: #1a1a20;
      border: 1px solid #282832;
      padding: 0.5rem 0.3rem;
      border-radius: 6px;
      text-align: center;
    }
    .config-card label {
      font-size: 0.65rem;
      color: #9999a6;
      display: block;
      margin-bottom: 2px;
      margin-top: 4px;
    }
    .config-card label:first-child { margin-top: 0; }
    .config-card input[type="text"], .config-card input[type="number"] {
      font-size: 0.75rem !important;
      padding: 0.25rem !important;
      text-align: center;
      margin-bottom: 2px;
    }

    /* 저장 & 불러오기 관리 구역 */
    .preset-manager {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px dashed #2a2a35;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preset-btn-group {
      display: flex;
      gap: 6px;
    }
    .preset-btn {
      flex: 1;
      padding: 0.4rem;
      font-size: 0.72rem;
      background: #252530;
      color: #ccc;
      border: 1px solid #3d3d4e;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn:hover { background: #323242; color: #fff; }

    .coin-preview-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      width: 100%;
      margin-top: 0.6rem;
    }
    .coin-preview-item {
      font-size: 0.65rem;
      padding: 0.3rem;
      border-radius: 4px;
      background: #16161a;
      color: #fbc531;
      text-align: center;
      border: 1px solid #282832;
      line-height: 1.3;
    }

    .control-group {
      width: 100%;
      margin-bottom: 0.9rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 0.3rem;
      color: #bbbba6;
    }
    input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 0.5rem 0.6rem;
      background: #111115;
      border: 1px solid #2a2a35;
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus, input[type="text"]:focus, select:focus {
      border-color: #ff4757;
      outline: none;
    }
    
    .info-badge {
      width: 100%;
      background: #111115;
      border: 1px solid #282832;
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-top: 0.4rem;
      text-align: center;
      color: #ccc;
    }

    .center-stage {
      position: relative;
      background: #16161a;
      border: 1px solid #2a2a35;
      padding: 1.8rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      text-align: center;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    button.clash-btn {
      width: 100%;
      padding: 1.1rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff4757, #ff3838);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
    }
    button.clash-btn:hover { background: linear-gradient(135deg, #ff6b81, #ff4757); transform: translateY(-1px); }
    button.clash-btn:disabled { background: #2a2a35 !important; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }

    .result-banner {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
    }
    .result-banner.player { color: #2ed573; text-shadow: 0 0 10px rgba(46, 213, 115, 0.3); }
    .result-banner.enemy { color: #ff4757; text-shadow: 0 0 10px rgba(255, 71, 87, 0.3); }
    .result-banner.clash { color: #fbc531; text-shadow: 0 0 12px rgba(251, 197, 49, 0.5); animation: clashPulse 0.3s infinite alternate; }

    @keyframes clashPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .center-arena-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.2rem;
      position: relative;
      z-index: 2;
    }

    .side-result-box {
      background: #111115;
      border: 1px solid #282832;
      padding: 1.2rem;
      border-radius: 10px;
      min-height: 240px;
    }

    .power-score-badge {
      font-size: 1.3rem;
      font-weight: bold;
      color: #fbc531;
      margin-top: 4px;
    }

    .coins-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 1rem;
    }

    .coin {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.8rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 2px solid #b7950b;
    }
    .coin.flipping {
      animation: coinFlip 0.3s infinite linear;
      background: linear-gradient(135deg, #f1c40f, #d4ac0d);
      color: #111;
      border-color: #b7950b;
    }
    .coin.heads {
      background: linear-gradient(135deg, #f7dc6f, #f1c40f);
      color: #111115;
      border-color: #f39c12;
      box-shadow: 0 0 12px rgba(241, 196, 15, 0.4), inset 0 2px 4px rgba(255,255,255,0.4);
      transform: scale(1.08);
    }
    .coin.tails {
      background: linear-gradient(135deg, #85929e, #5d6d7e);
      color: #ffffff;
      border-color: #34495e;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
      transform: scale(1);
    }
    
    @keyframes coinFlip {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }
    .coin-sub { font-size: 0.65rem; opacity: 0.85; margin-top: 2px; font-weight: normal; }

    .spark-container {
      position: absolute;
      top: 55%;
      left: 50%;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 10;
    }
    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px #fbc531, 0 0 20px #ff4757;
      animation: sparkFly 0.6s ease-out forwards;
    }
    @keyframes sparkFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1.5);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0.2);
      }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <h1>⚔️ TRPG 코인 순차 판정 시뮬레이터</h1>

    <div class="battle-layout">
      <!-- 1. 왼쪽 끝: 아군 설정창 -->
      <div class="side-box player">
        <div class="side-title">🛡️ 아군 (Player)</div>
        
        <div class="slot-container">
          <div class="slot-header">현재 보유 스킬 슬롯 (클릭 선택)</div>
          <div class="slots-wrapper" id="p-slots-display"></div>
          <div class="next-box" id="p-next-display">
            <span>[NEXT]:</span>
            <span class="skill-badge next-badge s1">1스킬</span>
          </div>
          <div class="matchup-indicator balanced" id="p-matchup">상성 분석 중...</div>
        </div>

        <div class="skill-config-box">
          <div class="skill-config-title">스킬 이름 / 위력 / 코인 수 설정</div>
          <div class="config-grid">
            <div class="config-card">
              <label>1스킬 이름</label>
              <input type="text" id="p-s1-name" value="1스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="p-s1-base" value="3" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="p-s1-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="p-s1-coins" value="1" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>2스킬 이름</label>
              <input type="text" id="p-s2-name" value="2스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="p-s2-base" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="p-s2-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="p-s2-coins" value="2" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>3스킬 이름</label>
              <input type="text" id="p-s3-name" value="3스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="p-s3-base" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="p-s3-coinpower" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="p-s3-coins" value="3" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
          </div>
          
          <!-- 프리셋 저장/불러오기 -->
          <div class="preset-manager">
            <div class="preset-btn-group">
              <button class="preset-btn" onclick="savePreset(true)">💾 스킬셋 저장</button>
              <button class="preset-btn" onclick="deletePreset(true)">🗑️ 저장 삭제</button>
            </div>
            <select id="p-preset-select" onchange="loadPreset(true)">
              <option value="">-- 저장된 스킬셋 선택 --</option>
            </select>
          </div>

          <div class="coin-preview-box" id="p-coin-preview"></div>
        </div>

        <div class="control-group">
          <label for="p-sanity">정신력 (-45 ~ +45)</label>
          <input type="number" id="p-sanity" value="0" min="-45" max="45" onchange="validateInputs(); updateInfo();">
        </div>

        <div class="info-badge" id="p-info">앞면 확률: 50%</div>
      </div>

      <!-- 2. 한가운데: 중앙 대결 연출 무대 -->
      <div class="center-stage" id="center-stage">
        <div class="spark-container" id="spark-layer"></div>

        <div>
          <button class="clash-btn" id="clash-btn" onclick="startClash()">⚔️ 선택된 스킬로 판정 시작!</button>
          
          <div id="result-box-container" style="margin-top: 1.5rem;">
            <div id="clash-status-text" style="color: #888; font-size: 1.1rem;">
              좌우 설정창에서 원하는 스킬을 선택한 후 판정을 진행하세요.
            </div>

            <div class="center-arena-grid">
              <!-- 중앙 왼쪽: 아군 코인 공개 구역 -->
              <div class="side-result-box">
                <div id="p-result-skill-tag" style="margin-bottom: 0.4rem;"><span class="skill-badge s1">아군 스킬</span></div>
                <div id="p-result-count-text" style="font-size: 0.85rem; color: #aaa;">-</div>
                <div id="p-power-score" class="power-score-badge">-</div>
                <div class="coins-wrapper" id="p-coins-stage"></div>
              </div>

              <!-- 중앙 오른쪽: 적군 코인 공개 구역 -->
              <div class="side-result-box">
                <div id="e-result-skill-tag" style="margin-bottom: 0.4rem;"><span class="skill-badge s1">적군 스킬</span></div>
                <div id="e-result-count-text" style="font-size: 0.85rem; color: #aaa;">-</div>
                <div id="e-power-score" class="power-score-badge">-</div>
                <div class="coins-wrapper" id="e-coins-stage"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. 오른쪽 끝: 적군 설정창 -->
      <div class="side-box enemy">
        <div class="side-title">⚔️ 적군 (Enemy)</div>
        
        <div class="slot-container">
          <div class="slot-header">현재 보유 스킬 슬롯 (클릭 선택)</div>
          <div class="slots-wrapper" id="e-slots-display"></div>
          <div class="next-box" id="e-next-display">
            <span>[NEXT]:</span>
            <span class="skill-badge next-badge s1">1스킬</span>
          </div>
          <div class="matchup-indicator balanced" id="e-matchup">상성 분석 중...</div>
        </div>

        <div class="skill-config-box">
          <div class="skill-config-title">스킬 이름 / 위력 / 코인 수 설정</div>
          <div class="config-grid">
            <div class="config-card">
              <label>1스킬 이름</label>
              <input type="text" id="e-s1-name" value="1스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="e-s1-base" value="3" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="e-s1-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="e-s1-coins" value="1" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>2스킬 이름</label>
              <input type="text" id="e-s2-name" value="2스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="e-s2-base" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="e-s2-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="e-s2-coins" value="2" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>3스킬 이름</label>
              <input type="text" id="e-s3-name" value="3스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="e-s3-base" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="e-s3-coinpower" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="e-s3-coins" value="3" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
          </div>

          <!-- 프리셋 저장/불러오기 -->
          <div class="preset-manager">
            <div class="preset-btn-group">
              <button class="preset-btn" onclick="savePreset(false)">💾 스킬셋 저장</button>
              <button class="preset-btn" onclick="deletePreset(false)">🗑️ 저장 삭제</button>
            </div>
            <select id="e-preset-select" onchange="loadPreset(false)">
              <option value="">-- 저장된 스킬셋 선택 --</option>
            </select>
          </div>

          <div class="coin-preview-box" id="e-coin-preview"></div>
        </div>

        <div class="control-group">
          <label for="e-sanity">정신력 (-45 ~ +45)</label>
          <input type="number" id="e-sanity" value="0" min="-45" max="45" onchange="validateInputs(); updateInfo();">
        </div>

        <div class="info-badge" id="e-info">앞면 확률: 50%</div>
      </div>
    </div>
  </div>

  <script>
    const baseCycle = [1, 1, 1, 2, 2, 3];
    let playerPool = [];
    let enemyPool = [];

    let playerSlots = [1, 2];
    let enemySlots = [1, 2];

    let playerNext = 1;
    let enemyNext = 1;

    let pSelectedIndex = 0;
    let eSelectedIndex = 0;

    function calculateHeadsChance(sanity) {
      let s = Number(sanity) || 0;
      let chance = 50 + s;
      if (chance > 95) chance = 95;
      if (chance < 5) chance = 5;
      return chance;
    }

    function validateInputs() {
      let ps = document.getElementById('p-sanity');
      let es = document.getElementById('e-sanity');

      if (ps.value === '') ps.value = 0;
      if (es.value === '') es.value = 0;

      if (ps.value > 45) ps.value = 45;
      if (ps.value < -45) ps.value = -45;
      if (es.value > 45) es.value = 45;
      if (es.value < -45) es.value = -45;

      ['p', 'e'].forEach(prefix => {
        [1, 2, 3].forEach(num => {
          let coinsElem = document.getElementById(`${prefix}-s${num}-coins`);
          if (coinsElem) {
            if (coinsElem.value > 9) coinsElem.value = 9;
            if (coinsElem.value < 1 || coinsElem.value === '') coinsElem.value = 1;
          }
          let baseElem = document.getElementById(`${prefix}-s${num}-base`);
          if (baseElem && baseElem.value === '') baseElem.value = 0;
          let cpElem = document.getElementById(`${prefix}-s${num}-coinpower`);
          if (cpElem && cpElem.value === '') cpElem.value = 0;
        });
      });
    }

    function getSkillName(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const inputVal = document.getElementById(`${prefix}-s${skillType}-name`)?.value;
      return inputVal && inputVal.trim() !== '' ? inputVal : `${skillType}스킬`;
    }

    function getSkillCoins(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const val = parseInt(document.getElementById(`${prefix}-s${skillType}-coins`)?.value);
      return isNaN(val) ? 1 : val;
    }

    function getSkillBasePower(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const val = parseInt(document.getElementById(`${prefix}-s${skillType}-base`)?.value);
      return isNaN(val) ? 0 : val;
    }

    function getSkillCoinPower(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const val = parseInt(document.getElementById(`${prefix}-s${skillType}-coinpower`)?.value);
      return isNaN(val) ? 0 : val;
    }

    function drawNextSkill(isPlayer) {
      let pool = isPlayer ? playerPool : enemyPool;
      if (pool.length === 0) {
        pool = [...baseCycle];
      }
      const idx = Math.floor(Math.random() * pool.length);
      const drawn = pool.splice(idx, 1)[0];

      if (isPlayer) playerPool = pool;
      else enemyPool = pool;

      return drawn;
    }

    function updateInfo() {
      validateInputs();
      const pSanity = document.getElementById('p-sanity').value;
      const eSanity = document.getElementById('e-sanity').value;

      document.getElementById('p-info').innerText = `앞면 확률: ${calculateHeadsChance(pSanity)}%`;
      document.getElementById('e-info').innerText = `앞면 확률: ${calculateHeadsChance(eSanity)}%`;

      renderSlots();
    }

    function selectSkill(isPlayer, index) {
      if (isPlayer) pSelectedIndex = index;
      else eSelectedIndex = index;
      renderSlots();
    }

    /* 저장 및 불러오기 프리셋 로직 */
    function savePreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const name = prompt("저장할 스킬 셋의 이름을 입력하세요:", isPlayer ? "아군 프리셋 1" : "적군 프리셋 1");
      if (!name || name.trim() === "") return;

      const presetData = {
        name: name.trim(),
        s1: {
          name: document.getElementById(`${prefix}-s1-name`).value,
          base: document.getElementById(`${prefix}-s1-base`).value,
          cp: document.getElementById(`${prefix}-s1-coinpower`).value,
          coins: document.getElementById(`${prefix}-s1-coins`).value,
        },
        s2: {
          name: document.getElementById(`${prefix}-s2-name`).value,
          base: document.getElementById(`${prefix}-s2-base`).value,
          cp: document.getElementById(`${prefix}-s2-coinpower`).value,
          coins: document.getElementById(`${prefix}-s2-coins`).value,
        },
        s3: {
          name: document.getElementById(`${prefix}-s3-name`).value,
          base: document.getElementById(`${prefix}-s3-base`).value,
          cp: document.getElementById(`${prefix}-s3-coinpower`).value,
          coins: document.getElementById(`${prefix}-s3-coins`).value,
        }
      };

      let presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      presets.push(presetData);
      localStorage.setItem('trpg_skill_presets', JSON.stringify(presets));

      alert("스킬 셋이 성공적으로 저장되었습니다!");
      updatePresetDropdowns();
    }

    function updatePresetDropdowns() {
      const presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      
      ['p', 'e'].forEach(prefix => {
        const select = document.getElementById(`${prefix}-preset-select`);
        const currentVal = select.value;
        select.innerHTML = `<option value="">-- 저장된 스킬셋 선택 --</option>` +
          presets.map((p, idx) => `<option value="${idx}">${p.name}</option>`).join('');
        select.value = currentVal;
      });
    }

    function loadPreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const select = document.getElementById(`${prefix}-preset-select`);
      const idx = select.value;
      if (idx === "") return;

      const presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      const p = presets[idx];
      if (!p) return;

      document.getElementById(`${prefix}-s1-name`).value = p.s1.name;
      document.getElementById(`${prefix}-s1-base`).value = p.s1.base;
      document.getElementById(`${prefix}-s1-coinpower`).value = p.s1.cp;
      document.getElementById(`${prefix}-s1-coins`).value = p.s1.coins;

      document.getElementById(`${prefix}-s2-name`).value = p.s2.name;
      document.getElementById(`${prefix}-s2-base`).value = p.s2.base;
      document.getElementById(`${prefix}-s2-coinpower`).value = p.s2.cp;
      document.getElementById(`${prefix}-s2-coins`).value = p.s2.coins;

      document.getElementById(`${prefix}-s3-name`).value = p.s3.name;
      document.getElementById(`${prefix}-s3-base`).value = p.s3.base;
      document.getElementById(`${prefix}-s3-coinpower`).value = p.s3.cp;
      document.getElementById(`${prefix}-s3-coins`).value = p.s3.coins;

      validateInputs();
      renderSlots();
    }

    function deletePreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const select = document.getElementById(`${prefix}-preset-select`);
      const idx = select.value;
      if (idx === "") {
        alert("삭제할 프리셋을 드롭다운에서 먼저 선택해주세요.");
        return;
      }

      let presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      if (confirm(`'${presets[idx].name}' 스킬셋을 삭제하시겠습니까?`)) {
        presets.splice(idx, 1);
        localStorage.setItem('trpg_skill_presets', JSON.stringify(presets));
        updatePresetDropdowns();
        renderSlots();
      }
    }

    function updateMatchupAnalysis() {
      const pSanity = parseInt(document.getElementById('p-sanity').value) || 0;
      const eSanity = parseInt(document.getElementById('e-sanity').value) || 0;
      
      const pChance = calculateHeadsChance(pSanity) / 100;
      const eChance = calculateHeadsChance(eSanity) / 100;

      const pType = playerSlots[pSelectedIndex];
      const eType = enemySlots[eSelectedIndex];

      const pCoins = getSkillCoins(true, pType);
      const pBase = getSkillBasePower(true, pType);
      const pCP = getSkillCoinPower(true, pType);

      const eCoins = getSkillCoins(false, eType);
      const eBase = getSkillBasePower(false, eType);
      const eCP = getSkillCoinPower(false, eType);

      // 기대 최종 위력값 비교 (기본위력 + 기대 앞면수 * 코인위력)
      const pExpectedPower = pBase + (pCoins * pChance * pCP);
      const eExpectedPower = eBase + (eCoins * eChance * eCP);
      const diff = pExpectedPower - eExpectedPower;

      let pStatus = "";
      let eStatus = "";
      let pClass = "";
      let eClass = "";

      if (diff >= 4.0) {
        pStatus = "🔥 매우 우세 (승률 높음)";
        eStatus = "❄️ 매우 불리 (위험)";
        pClass = "very-advantage";
        eClass = "very-disadvantage";
      } else if (diff >= 1.5) {
        pStatus = "📈 우세 (유리함)";
        eStatus = "📉 불리 (주의)";
        pClass = "advantage";
        eClass = "disadvantage";
      } else if (diff <= -4.0) {
        pStatus = "❄️ 매우 불리 (위험)";
        eStatus = "🔥 매우 우세 (승률 높음)";
        pClass = "very-disadvantage";
        eClass = "very-advantage";
      } else if (diff <= -1.5) {
        pStatus = "📉 불리 (주의)";
        eStatus = "📈 우세 (유리함)";
        pClass = "disadvantage";
        eClass = "advantage";
      } else {
        pStatus = "⚖️ 균형 (치열한 합 예상)";
        eStatus = "⚖️ 균형 (치열한 합 예상)";
        pClass = "balanced";
        eClass = "balanced";
      }

      const pIndicator = document.getElementById('p-matchup');
      const eIndicator = document.getElementById('e-matchup');

      pIndicator.className = `matchup-indicator ${pClass}`;
      pIndicator.innerText = pStatus;

      eIndicator.className = `matchup-indicator ${eClass}`;
      eIndicator.innerText = eStatus;
    }

    function renderSlots() {
      const pWrapper = document.getElementById('p-slots-display');
      const eWrapper = document.getElementById('e-slots-display');

      pWrapper.innerHTML = playerSlots.map((s, idx) => {
        const isSelected = idx === pSelectedIndex ? 'selected' : '';
        const name = getSkillName(true, s);
        const coins = getSkillCoins(true, s);
        return `<span class="skill-badge s${s} ${isSelected}" onclick="selectSkill(true, ${idx})">${name} (${coins}코인)</span>`;
      }).join('');

      eWrapper.innerHTML = enemySlots.map((s, idx) => {
        const isSelected = idx === eSelectedIndex ? 'selected' : '';
        const name = getSkillName(false, s);
        const coins = getSkillCoins(false, s);
        return `<span class="skill-badge s${s} ${isSelected}" onclick="selectSkill(false, ${idx})">${name} (${coins}코인)</span>`;
      }).join('');

      const pNextName = getSkillName(true, playerNext);
      const pNextCoins = getSkillCoins(true, playerNext);
      document.getElementById('p-next-display').innerHTML = `
        <span>[NEXT]:</span>
        <span class="skill-badge next-badge s${playerNext}">${pNextName} (${pNextCoins}코인)</span>
      `;

      const eNextName = getSkillName(false, enemyNext);
      const eNextCoins = getSkillCoins(false, enemyNext);
      document.getElementById('e-next-display').innerHTML = `
        <span>[NEXT]:</span>
        <span class="skill-badge next-badge s${enemyNext}">${eNextName} (${eNextCoins}코인)</span>
      `;

      document.getElementById('p-coin-preview').innerHTML = [1, 2, 3].map(s => 
        `<div class="coin-preview-item">${getSkillName(true, s)}<br>위력 ${getSkillBasePower(true, s)}+${getSkillCoinPower(true, s)}<br><strong>${getSkillCoins(true, s)}코인</strong></div>`
      ).join('');

      document.getElementById('e-coin-preview').innerHTML = [1, 2, 3].map(s => 
        `<div class="coin-preview-item">${getSkillName(false, s)}<br>위력 ${getSkillBasePower(false, s)}+${getSkillCoinPower(false, s)}<br><strong>${getSkillCoins(false, s)}코인</strong></div>`
      ).join('');

      updateMatchupAnalysis();
    }

    function triggerSparks() {
      const layer = document.getElementById('spark-layer');
      layer.innerHTML = '';
      const sparkCount = 35;

      for (let i = 0; i < sparkCount; i++) {
        const spark = document.createElement('div');
        spark.className = 'spark';
        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 160;
        const dx = `${Math.cos(angle) * distance}px`;
        const dy = `${Math.sin(angle) * distance}px`;

        spark.style.setProperty('--dx', dx);
        spark.style.setProperty('--dy', dy);
        
        if (Math.random() > 0.5) {
          spark.style.background = '#fbc531';
        } else {
          spark.style.background = '#ff4757';
        }

        layer.appendChild(spark);
      }

      setTimeout(() => {
        layer.innerHTML = '';
      }, 700);
    }

    function startClash(isReclash = false) {
      validateInputs();

      const btnC = document.getElementById('clash-btn');
      btnC.disabled = true;

      const pSanity = parseInt(document.getElementById('p-sanity').value) || 0;
      const pChance = calculateHeadsChance(pSanity);

      const eSanity = parseInt(document.getElementById('e-sanity').value) || 0;
      const eChance = calculateHeadsChance(eSanity);

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      const playerCount = getSkillCoins(true, pUsedType);
      const pBase = getSkillBasePower(true, pUsedType);
      const pCP = getSkillCoinPower(true, pUsedType);

      const enemyCount = getSkillCoins(false, eUsedType);
      const eBase = getSkillBasePower(false, eUsedType);
      const eCP = getSkillCoinPower(false, eUsedType);

      const pSkillName = getSkillName(true, pUsedType);
      const eSkillName = getSkillName(false, eUsedType);

      let playerCoins = [];
      let playerHeads = 0;
      for (let i = 0; i < playerCount; i++) {
        const roll = Math.random() * 100;
        const isHeads = roll < pChance;
        if (isHeads) playerHeads++;
        playerCoins.push({ isHeads, roll: roll.toFixed(1) });
      }

      let enemyCoins = [];
      let enemyHeads = 0;
      for (let i = 0; i < enemyCount; i++) {
        const roll = Math.random() * 100;
        const isHeads = roll < eChance;
        if (isHeads) enemyHeads++;
        enemyCoins.push({ isHeads, roll: roll.toFixed(1) });
      }

      // 최종 위력 점수 계산
      const playerFinalPower = pBase + (playerHeads * pCP);
      const enemyFinalPower = eBase + (enemyHeads * eCP);

      let pSpinningHTML = '';
      for(let i = 0; i < playerCount; i++) {
        pSpinningHTML += `<div class="coin flipping" id="p-coin-${i}">?</div>`;
      }

      let eSpinningHTML = '';
      for(let i = 0; i < enemyCount; i++) {
        eSpinningHTML += `<div class="coin flipping" id="e-coin-${i}">?</div>`;
      }

      const statusMsg = isReclash ? "⚔️ 재합 진행 중! 코인 회전..." : "코인을 던지는 중...";
      document.getElementById('clash-status-text').innerHTML = `<span style="color: #fbc531; font-weight: bold;">${statusMsg}</span>`;
      
      document.getElementById('p-result-skill-tag').innerHTML = `<span class="skill-badge s${pUsedType}">${pSkillName}</span>`;
      document.getElementById('p-result-count-text').innerText = '판정 중...';
      document.getElementById('p-power-score').innerText = '위력: -';
      document.getElementById('p-coins-stage').innerHTML = pSpinningHTML;

      document.getElementById('e-result-skill-tag').innerHTML = `<span class="skill-badge s${eUsedType}">${eSkillName}</span>`;
      document.getElementById('e-result-count-text').innerText = '판정 중...';
      document.getElementById('e-power-score').innerText = '위력: -';
      document.getElementById('e-coins-stage').innerHTML = eSpinningHTML;

      const maxCoins = Math.max(playerCount, enemyCount);
      const stepDelay = 350;

      for (let i = 0; i < maxCoins; i++) {
        setTimeout(() => {
          if (i < playerCount) {
            const pElem = document.getElementById(`p-coin-${i}`);
            if (pElem) {
              const c = playerCoins[i];
              pElem.className = `coin ${c.isHeads ? 'heads' : 'tails'}`;
              pElem.innerHTML = `${c.isHeads ? '앞면' : '뒷면'}<span class="coin-sub">${c.roll}%</span>`;
            }
          }
          if (i < enemyCount) {
            const eElem = document.getElementById(`e-coin-${i}`);
            if (eElem) {
              const c = enemyCoins[i];
              eElem.className = `coin ${c.isHeads ? 'heads' : 'tails'}`;
              eElem.innerHTML = `${c.isHeads ? '앞면' : '뒷면'}<span class="coin-sub">${c.roll}%</span>`;
            }
          }
        }, (i + 1) * stepDelay);
      }

      const totalAnimTime = (maxCoins + 1) * stepDelay;
      setTimeout(() => {
        document.getElementById('p-result-count-text').innerText = `앞면 ${playerHeads} / ${playerCount}`;
        document.getElementById('e-result-count-text').innerText = `앞면 ${enemyHeads} / ${enemyCount}`;

        document.getElementById('p-power-score').innerText = `최종 위력: ${playerFinalPower}`;
        document.getElementById('e-power-score').innerText = `최종 위력: ${enemyFinalPower}`;

        // 최종 위력 점수 비교로 승패 결정 (동점 시 합 발동)
        if (playerFinalPower === enemyFinalPower) {
          triggerSparks();
          document.getElementById('clash-status-text').innerHTML = `
            <div class="result-banner clash">⚔️ 합 발생! (CLASH)</div>
            <div style="font-size: 0.95rem; color: #fbc531;">위력이 동일합니다! 불꽃이 튀며 다시 동일 스킬로 재판정합니다!</div>
          `;

          setTimeout(() => {
            startClash(true);
          }, 1200);

        } else {
          let resultText = "";
          let winner = "";

          if (playerFinalPower > enemyFinalPower) {
            resultText = "아군 승리! (PLAYER WIN)";
            winner = "player";
          } else {
            resultText = "적군 승리! (ENEMY WIN)";
            winner = "enemy";
          }

          document.getElementById('clash-status-text').innerHTML = `<div class="result-banner ${winner}">${resultText}</div>`;

          playerSlots[pSelectedIndex] = playerNext;
          enemySlots[eSelectedIndex] = enemyNext;

          playerNext = drawNextSkill(true);
          enemyNext = drawNextSkill(false);

          renderSlots();
          btnC.disabled = false;
        }
      }, totalAnimTime);
    }

    playerNext = drawNextSkill(true);
    enemyNext = drawNextSkill(false);
    updatePresetDropdowns();
    updateInfo();
  </script>
</body>
</html>

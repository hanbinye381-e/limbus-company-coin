<!DOCTYPE html>
<html lang="ko" data-theme="limbus">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG 중앙 코인 대결 시뮬레이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Oswald:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* 림버스 컴퍼니 테마 */
    :root[data-theme="limbus"] {
      --font-title: 'Oswald', 'Noto Sans KR', sans-serif;
      --font-body: 'Noto Sans KR', sans-serif;
      --bg-color: #050507;
      --card-bg: linear-gradient(180deg, #181412 0%, #0d0b0a 100%);
      --sub-card-bg: #090807;
      --border-style: 2px solid #8e2a18;
      --card-box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 12px rgba(142, 42, 24, 0.4);
      --card-radius: 0px;
      --primary-color: #ff3322;
      --primary-hover: #d62211;
      --accent-color: #e6a100;
      --text-color: #dcd8d0;
      --title-color: #f0a800;
      --title-shadow: 0 0 8px rgba(240, 168, 0, 0.6), 2px 2px 0px #500000;
      --btn-bg: linear-gradient(180deg, #991c0e 0%, #520902 100%);
      --btn-border: 2px solid #e6a100;
      --spark-color-1: #e6a100;
      --spark-color-2: #ff3322;
      --glow-filter: drop-shadow(0 0 12px rgba(230, 161, 0, 0.9));
      --badge-clip: polygon(15% 0%, 85% 0%, 100% 50%, 85% 100%, 15% 100%, 0% 50%);
    }

    /* 라이브러리 오브 루이나 테마 */
    :root[data-theme="ruina"] {
      --font-title: 'Cinzel', 'Noto Sans KR', serif;
      --font-body: 'Cinzel', 'Noto Sans KR', serif;
      --bg-color: #03060a;
      --card-bg: linear-gradient(180deg, #0a1322 0%, #040810 100%);
      --sub-card-bg: #020509;
      --border-style: 2px double #c59f52;
      --card-box-shadow: inset 0 0 20px rgba(0,0,0,0.95), 0 0 15px rgba(197, 159, 82, 0.3);
      --card-radius: 0px;
      --primary-color: #38ef7d;
      --primary-hover: #11998e;
      --accent-color: #38e8e5;
      --text-color: #eaeff5;
      --title-color: #38e8e5;
      --title-shadow: 0 0 10px rgba(56, 232, 229, 0.7), 0 0 20px rgba(197, 159, 82, 0.5);
      --btn-bg: linear-gradient(180deg, #0e2b47 0%, #051322 100%);
      --btn-border: 2px double #c59f52;
      --spark-color-1: #38e8e5;
      --spark-color-2: #c59f52;
      --glow-filter: drop-shadow(0 0 14px rgba(56, 232, 229, 0.9));
      --badge-clip: none;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem 2rem;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }
    
    .main-wrapper { width: 100%; max-width: 1800px; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: var(--border-style);
    }

    h1 {
      font-family: var(--font-title);
      font-size: 2.1rem;
      margin: 0;
      color: var(--title-color);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: var(--title-shadow);
      transition: all 0.3s;
    }

    .theme-select-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 0.4rem 0.9rem;
      border: var(--border-style);
      box-shadow: var(--card-box-shadow);
    }
    .theme-select-box label { margin: 0; font-size: 0.85rem; color: #aaa; letter-spacing: 1px; }
    .theme-select-box select {
      padding: 0.3rem 0.6rem;
      font-size: 0.85rem;
      width: auto;
      font-family: var(--font-body);
      background: var(--sub-card-bg);
      color: var(--text-color);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .battle-layout {
      display: grid;
      grid-template-columns: 420px 1fr 420px;
      gap: 1.8rem;
      align-items: start;
    }

    @media (max-width: 1200px) { .battle-layout { grid-template-columns: 1fr; } }

    .side-box {
      background: var(--card-bg);
      padding: 1.4rem;
      border: var(--border-style);
      box-shadow: var(--card-box-shadow);
      transition: all 0.3s;
      position: relative;
    }

    .side-title {
      font-family: var(--font-title);
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .player .side-title { color: #38ef7d; text-shadow: 0 0 8px rgba(56, 239, 125, 0.4); }
    .enemy .side-title { color: #ff3322; text-shadow: 0 0 8px rgba(255, 51, 34, 0.4); }

    .slot-container {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 0.8rem;
      margin-bottom: 0.9rem;
      text-align: center;
    }
    .slot-header {
      font-size: 0.75rem;
      color: #888892;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .slots-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      align-items: center;
    }

    .def-toggle-btn {
      padding: 0.4rem 0.6rem;
      font-size: 0.75rem;
      font-weight: bold;
      background: #332211;
      color: #ffaa00;
      border: 1px solid #aa6600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .def-toggle-btn:hover { background: #553311; }
    .def-toggle-btn.active { background: #aa6600; color: #fff; }

    .ego-toggle-btn {
      padding: 0.4rem 0.6rem;
      font-size: 0.75rem;
      font-weight: bold;
      background: #2b0c12;
      color: #ff4466;
      border: 1px solid #aa1133;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      user-select: none;
    }
    .ego-toggle-btn:hover { background: #4a121e; }
    .ego-toggle-btn.active { background: #aa1133; color: #fff; box-shadow: 0 0 10px #ff3355; }
    .ego-progress {
      position: absolute; bottom: 0; left: 0; height: 3px; background: #ff3355; width: 0%;
      transition: width 0.1s linear;
    }

    .next-box {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px dashed rgba(255,255,255,0.15);
      font-size: 0.75rem;
      color: var(--accent-color);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .matchup-indicator {
      margin-top: 0.7rem;
      padding: 0.45rem;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      background: var(--card-bg);
      border: var(--border-style);
      letter-spacing: 1px;
    }
    .matchup-indicator.very-advantage { color: #38ef7d; border-color: #38ef7d; background: rgba(56, 239, 125, 0.08); }
    .matchup-indicator.advantage { color: #70a1ff; border-color: #1e90ff; background: rgba(112, 161, 255, 0.08); }
    .matchup-indicator.balanced { color: var(--accent-color); border-color: var(--accent-color); background: rgba(230, 161, 0, 0.08); }
    .matchup-indicator.disadvantage { color: #ff6b81; border-color: #ff3322; background: rgba(255, 51, 34, 0.08); }
    .matchup-indicator.very-disadvantage { color: #ff3322; background: rgba(255, 51, 34, 0.15); border-color: #ff3322; }

    .skill-badge {
      padding: 0.5rem 0.9rem;
      font-weight: bold;
      font-size: 0.8rem;
      background: #141418;
      color: #fff;
      border: 1px solid #444452;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      clip-path: var(--badge-clip);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .skill-badge:hover { transform: translateY(-2px); border-color: #888; }
    .skill-badge.s1 { background: #0c182b; color: #70a1ff; border-color: #1f3b6e; }
    .skill-badge.s2 { background: #121333; color: #9aa8df; border-color: #2e3875; }
    .skill-badge.s3 { background: #300a12; color: #ff94a0; border-color: #6e1f2d; }
    .skill-badge.s4 { background: #2b200a; color: #ffd166; border-color: #75551f; }
    .skill-badge.ego { background: #3b0514; color: #ff3366; border-color: #b3003b; box-shadow: 0 0 8px rgba(255, 51, 102, 0.5); }
    
    .skill-badge.selected {
      border-color: var(--accent-color) !important;
      box-shadow: 0 0 12px var(--accent-color);
      transform: scale(1.06);
    }
    .skill-badge.next-badge { cursor: default; font-size: 0.7rem; padding: 0.25rem 0.6rem; opacity: 0.9; }

    .skill-config-box {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 0.8rem;
      margin-bottom: 0.9rem;
    }
    .skill-config-title {
      font-size: 0.75rem;
      color: #888892;
      margin-bottom: 0.6rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .config-card {
      background: var(--card-bg);
      border: var(--border-style);
      padding: 0.5rem 0.3rem;
      text-align: center;
    }
    .config-card label { font-size: 0.65rem; color: #9999a6; display: block; margin-bottom: 2px; margin-top: 4px; }
    .config-card label:first-child { margin-top: 0; }
    .config-card input[type="text"], .config-card input[type="number"], .config-card select {
      font-size: 0.75rem !important;
      padding: 0.25rem !important;
      text-align: center;
      margin-bottom: 2px;
      font-family: var(--font-body);
    }

    .preset-manager {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px dashed rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preset-btn-group { display: flex; gap: 6px; }
    .preset-btn {
      flex: 1; padding: 0.4rem; font-size: 0.72rem; background: #181820; color: #ccc;
      border: 1px solid #333344; cursor: pointer; transition: all 0.2s; font-family: var(--font-body);
    }
    .preset-btn:hover { background: #252532; color: #fff; }

    .coin-preview-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 4px;
      width: 100%;
      margin-top: 0.6rem;
    }
    .coin-preview-item {
      font-size: 0.6rem;
      padding: 0.3rem;
      background: var(--card-bg);
      color: var(--accent-color);
      text-align: center;
      border: var(--border-style);
      line-height: 1.2;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 0.9rem;
    }
    .control-group { width: 100%; margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; color: #bbbba6; }
    input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 0.5rem 0.6rem;
      background: var(--sub-card-bg);
      border: var(--border-style);
      color: #fff;
      font-size: 0.85rem;
      font-family: var(--font-body);
      transition: border-color 0.2s;
    }
    input[type="number"]:focus, input[type="text"]:focus, select:focus {
      border-color: var(--accent-color);
      outline: none;
    }
    
    .info-badge {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 0.5rem;
      font-size: 0.8rem;
      margin-top: 0.4rem;
      text-align: center;
      color: #ccc;
    }

    .center-stage {
      position: relative;
      background: var(--card-bg);
      border: var(--border-style);
      padding: 1.8rem;
      box-shadow: var(--card-box-shadow);
      text-align: center;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: all 0.3s;
    }

    button.clash-btn {
      width: 100%;
      padding: 1.1rem;
      font-size: 1.3rem;
      font-weight: bold;
      color: #fff;
      font-family: var(--font-title);
      letter-spacing: 3px;
      text-transform: uppercase;
      background: var(--btn-bg);
      border: var(--btn-border);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    button.clash-btn:hover { filter: brightness(1.25); transform: translateY(-1px); }
    button.clash-btn:disabled { background: #1c1c24 !important; color: #555; cursor: not-allowed; box-shadow: none; transform: none; border-color: #333; }

    .clash-count-badge {
      font-family: var(--font-title);
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .result-banner {
      font-family: var(--font-title);
      font-size: 1.7rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .result-banner.player { color: #38ef7d; text-shadow: 0 0 10px rgba(56, 239, 125, 0.4); }
    .result-banner.enemy { color: #ff3322; text-shadow: 0 0 10px rgba(255, 51, 34, 0.4); }
    .result-banner.clash { color: var(--accent-color); text-shadow: 0 0 12px var(--accent-color); animation: clashPulse 0.3s infinite alternate; }

    @keyframes clashPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .center-arena-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.2rem;
      position: relative;
      z-index: 2;
    }

    .side-result-box {
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 1.2rem;
      min-height: 240px;
    }

    /* 체력바 및 금빛 흐트러짐 선 스타일 */
    .hp-container {
      margin-bottom: 0.8rem;
      background: #111;
      border: 1px solid #444;
      padding: 4px;
      border-radius: 3px;
      position: relative;
    }
    .hp-bar-bg {
      width: 100%;
      height: 14px;
      background: #222;
      position: relative;
      overflow: hidden;
    }
    .hp-bar-fill {
      height: 100%;
      width: 100%;
      background: #38ef7d;
      transition: width 0.3s ease, background-color 0.3s;
    }
    .hp-bar-fill.enemy-hp { background: #ff3322; }
    
    .shield-bar-fill {
      position: absolute;
      top: 0; left: 0; height: 100%;
      background: #38e8e5;
      opacity: 0.75;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 금빛 흐트러짐 구분선 */
    .stagger-line {
      position: absolute;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background-color: #ffd700;
      box-shadow: 0 0 8px #ffaa00;
      z-index: 5;
      display: block;
    }
    .stagger-line.hidden {
      display: none !important;
    }

    .hp-text {
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .power-score-badge {
      font-family: var(--font-title);
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 4px;
    }

    .coins-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 0.8rem;
      min-height: 70px;
      align-items: center;
    }

    /* 흐트러짐 이미지 스타일 */
    .stagger-img {
      max-width: 180px;
      max-height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px #ffaa00);
      animation: staggerPulse 0.8s infinite alternate;
    }

    @keyframes staggerPulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    .coin {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.75rem;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: none !important;
      background-color: transparent !important;
      box-shadow: none !important;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .coin.flipping {
      animation: coinFlip 0.3s infinite linear;
      background-image: url('images/coin-heads.png');
      filter: brightness(0.9);
    }
    .coin.heads { background-image: url('images/coin-heads.png'); transform: scale(1.05); color: transparent; }
    .coin.tails { background-image: url('images/coin-tails.png'); transform: scale(1); color: transparent; }

    .coin.win-glow {
      background-image: url('images/coin-win.png') !important;
      filter: var(--glow-filter);
      transform: scale(1.12);
      color: transparent;
    }

    .coin.broken-heads {
      background-image: url('images/coin-broken-heads.png') !important;
      opacity: 0.6;
      transform: scale(0.85);
      animation: coinShatter 0.4s ease-out forwards;
      color: transparent;
    }
    .coin.broken-tails {
      background-image: url('images/coin-broken-tails.png') !important;
      opacity: 0.6;
      transform: scale(0.85);
      animation: coinShatter 0.4s ease-out forwards;
      color: transparent;
    }

    @keyframes coinShatter {
      0% { transform: scale(1.1) rotate(0deg); opacity: 1; filter: brightness(1.8); }
      30% { transform: scale(1.2) rotate(12deg); }
      100% { transform: scale(0.85) rotate(-8deg); opacity: 0.6; }
    }
    @keyframes coinFlip {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }
    .coin-sub {
      position: absolute;
      bottom: -16px;
      font-size: 0.6rem;
      color: #aaa;
      font-weight: normal;
      background: rgba(0,0,0,0.85);
      padding: 1px 4px;
      font-family: var(--font-body);
    }

    .spark-container {
      position: absolute;
      top: 55%; left: 50%; width: 0; height: 0; pointer-events: none; z-index: 10;
    }
    .spark {
      position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 10px var(--spark-color-1), 0 0 20px var(--spark-color-2);
      animation: sparkFly 0.6s ease-out forwards;
    }
    @keyframes sparkFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
    }
    .shatter-piece {
      position: absolute; width: 8px; height: 8px; background: var(--accent-color);
      box-shadow: 0 0 8px var(--primary-color); animation: shatterFly 0.5s ease-out forwards; pointer-events: none;
    }
    @keyframes shatterFly {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--sdx), var(--sdy)) scale(0.1); }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-bar">
      <h1>TRPG COIN CLASH SIMULATOR</h1>

      <div class="theme-select-box">
        <label for="theme-select">THEME:</label>
        <select id="theme-select" onchange="changeTheme(this.value)">
          <option value="limbus">LIMBUS COMPANY</option>
          <option value="ruina">LIBRARY OF RUINA</option>
        </select>
      </div>
    </div>

    <div class="battle-layout">
      <!-- 1. 아군 설정창 -->
      <div class="side-box player">
        <div class="side-title">PLAYER</div>
        
        <div class="slot-container">
          <div class="slot-header">보유 스킬 슬롯</div>
          <div class="slots-wrapper">
            <div id="p-slots-display" style="display:flex; gap:6px;"></div>
            <button class="def-toggle-btn" id="p-def-btn" onclick="toggleDefenseSlot(true)">수비</button>
            <button class="ego-toggle-btn" id="p-ego-btn" 
              onmousedown="startEgoHold(true)" onmouseup="cancelEgoHold(true)" onmouseleave="cancelEgoHold(true)"
              ontouchstart="startEgoHold(true)" ontouchend="cancelEgoHold(true)">
              E.G.O (1초 꾹)
              <div class="ego-progress" id="p-ego-progress"></div>
            </button>
          </div>
          <div class="next-box" id="p-next-display">
            <span>[NEXT]:</span>
            <span class="skill-badge next-badge s1">1스킬</span>
          </div>
          <div class="matchup-indicator balanced" id="p-matchup">상성 분석 중...</div>
        </div>

        <div class="skill-config-box">

  <script>
    const soundEffects = {
      spin: new Audio('sounds/coin-spin.mp3'),
      heads: new Audio('sounds/coin-heads.mp3'),
      tails: new Audio('sounds/coin-tails.mp3'),
      break: new Audio('sounds/coin-break.mp3'),
      hit: new Audio('sounds/hit.mp3'),
      shield: new Audio('sounds/shield.mp3'),
      counter: new Audio('sounds/counter.mp3')
    };

    function playSFX(key) {
      if (soundEffects[key]) {
        const sound = soundEffects[key].cloneNode();
        sound.play().catch(() => {});
      }
    }

    const baseCycle = [1, 1, 1, 2, 2, 3];
    let playerPool = [];
    let enemyPool = [];

    let playerSlots = [1, 2];
    let enemySlots = [1, 2];

    let playerNext = 1;
    let enemyNext = 1;

    let pSelectedIndex = 0;
    let eSelectedIndex = 0;

    let currentClashRound = 1;
    let pRemCoins = 0;
    let eRemCoins = 0;
    
    let pCoinStates = [];
    let eCoinStates = [];

    let pShield = 0;
    let eShield = 0;

    let pStaggerLevel = 0;
    let eStaggerLevel = 0;
    
    // 다음 턴에 적용될 흐트러짐 상태 플래그
    let pIsStaggeredNextTurn = false;
    let eIsStaggeredNextTurn = false;

    let pEgoHoldTimer = null;
    let eEgoHoldTimer = null;

    function changeTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('trpg_sim_theme', themeName);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('trpg_sim_theme') || 'limbus';
      document.documentElement.setAttribute('data-theme', savedTheme);
      const sel = document.getElementById('theme-select');
      if(sel) sel.value = savedTheme;
    }

    function toggleDefenseSlot(isPlayer) {
      if ((isPlayer && pStaggerLevel > 0) || (!isPlayer && eStaggerLevel > 0)) return;

      const slots = isPlayer ? playerSlots : enemySlots;
      const btn = document.getElementById(isPlayer ? 'p-def-btn' : 'e-def-btn');
      
      if (slots[1] === 5) return;

      if (slots[1] === 4) {
        slots[1] = 2;
        if(btn) btn.classList.remove('active');
      } else {
        slots[1] = 4;
        if(btn) btn.classList.add('active');
        const egoBtn = document.getElementById(isPlayer ? 'p-ego-btn' : 'e-ego-btn');
        if(egoBtn) egoBtn.classList.remove('active');
      }
      renderSlots();
    }

    function startEgoHold(isPlayer) {
      if ((isPlayer && pStaggerLevel > 0) || (!isPlayer && eStaggerLevel > 0)) return;

      const progressElem = document.getElementById(isPlayer ? 'p-ego-progress' : 'e-ego-progress');
      const btnElem = document.getElementById(isPlayer ? 'p-ego-btn' : 'e-ego-btn');
      const slots = isPlayer ? playerSlots : enemySlots;

      let startTime = Date.now();
      const duration = 1000;

      if(progressElem) progressElem.style.width = '0%';
      
      const timer = setInterval(() => {
        let elapsed = Date.now() - startTime;
        let pct = Math.min(100, (elapsed / duration) * 100);
        if(progressElem) progressElem.style.width = `${pct}%`;

        if (elapsed >= duration) {
          clearInterval(timer);
          if(progressElem) progressElem.style.width = '0%';
          
          if (slots[1] === 5) {
            slots[1] = 2;
            if(btnElem) btnElem.classList.remove('active');
          } else {
            slots[1] = 5;
            if(btnElem) btnElem.classList.add('active');
            const defBtn = document.getElementById(isPlayer ? 'p-def-btn' : 'e-def-btn');
            if(defBtn) defBtn.classList.remove('active');
            playSFX('spin');
          }
          renderSlots();
        }
      }, 30);

      if (isPlayer) pEgoHoldTimer = timer; else eEgoHoldTimer = timer;
    }

    function cancelEgoHold(isPlayer) {
      const timer = isPlayer ? pEgoHoldTimer : eEgoHoldTimer;
      if (timer) {
        clearInterval(timer);
        if (isPlayer) pEgoHoldTimer = null; else eEgoHoldTimer = null;
      }
      const progressElem = document.getElementById(isPlayer ? 'p-ego-progress' : 'e-ego-progress');
      if (progressElem) progressElem.style.width = '0%';
    }

    function calculateHeadsChance(sanity) {
      let s = Number(sanity) || 0;
      let chance = 50 + s;
      if (chance > 95) chance = 95;
      if (chance < 5) chance = 5;
      return chance;
    }

    function updateHpDisplay() {
      validateInputs();
      ['p', 'e'].forEach(prefix => {
        const isPlayer = (prefix === 'p');
        let maxHp = parseInt(document.getElementById(`${prefix}-max-hp`).value) || 100;
        let hp = parseInt(document.getElementById(`${prefix}-hp`).value) || 0;
        if (hp > maxHp) { hp = maxHp; document.getElementById(`${prefix}-hp`).value = hp; }
        
        let pct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
        const hpBar = document.getElementById(`${prefix}-hp-bar`);
        const hpText = document.getElementById(`${prefix}-hp-text`);
        if(hpBar) hpBar.style.width = `${pct}%`;
        if(hpText) hpText.innerText = `HP: ${hp} / ${maxHp}`;

        let shield = isPlayer ? pShield : eShield;
        let shieldPct = Math.max(0, Math.min(100, (shield / maxHp) * 100));
        const shieldBar = document.getElementById(`${prefix}-shield-bar`);
        if(shieldBar) shieldBar.style.width = `${shieldPct}%`;

        // 흐트러짐 선 렌더링 및 체력 구간에 따른 숨김 처리
        const linesLayer = document.getElementById(`${prefix}-stagger-lines-layer`);
        if(linesLayer) {
          linesLayer.innerHTML = '';
          let thresholds = [
            { id: 1, val: parseFloat(document.getElementById(`${prefix}-stagger-1`)?.value) || 0 },
            { id: 2, val: parseFloat(document.getElementById(`${prefix}-stagger-2`)?.value) || 0 },
            { id: 3, val: parseFloat(document.getElementById(`${prefix}-stagger-3`)?.value) || 0 }
          ];

          thresholds.forEach(th => {
            if (th.val > 0 && th.val < 100) {
              let line = document.createElement('div');
              line.className = 'stagger-line';
              line.style.left = `${th.val}%`;
              
              if (pct <= th.val) {
                line.classList.add('hidden');
              }
              
              linesLayer.appendChild(line);
            }
          });
        }

        // 흐트러짐 이미지 갱신 (현재 턴에 적용 중이거나 다음 턴에 걸릴 때 표시)
        const currentStaggerLvl = isPlayer ? pStaggerLevel : eStaggerLevel;
        const stageElem = document.getElementById(`${prefix}-coins-stage`);
        if (currentStaggerLvl > 0 && stageElem) {
          const imgName = currentStaggerLvl === 1 ? 'stagger.png' : (currentStaggerLvl === 2 ? 'stagger1.png' : 'stagger2.png');
          stageElem.innerHTML = `<img src="images/${imgName}" class="stagger-img" alt="STAGGER">`;
        }
      });
    }

    // 데미지 차감 및 흐트러짐 선 도달 체크 (다음 턴 흐트러짐 예약)
    function applyDamage(isPlayer, amount, isGuardReduced = false) {
      if (amount <= 0) return;
      if (isGuardReduced) {
        amount = Math.round(amount * 0.9);
        playSFX('shield');
      } else {
        playSFX('hit');
      }

      const prefix = isPlayer ? 'p' : 'e';
      let currentShield = isPlayer ? pShield : eShield;

      if (currentShield > 0) {
        if (currentShield >= amount) {
          if (isPlayer) pShield -= amount; else eShield -= amount;
          amount = 0;
        } else {
          amount -= currentShield;
          if (isPlayer) pShield = 0; else eShield = 0;
        }
      }

      if (amount > 0) {
        let hpElem = document.getElementById(`${prefix}-hp`);
        let maxHp = parseInt(document.getElementById(`${prefix}-max-hp`).value) || 100;
        let hp = parseInt(hpElem.value) || 0;
        let oldPct = (hp / maxHp) * 100;
        hp = Math.max(0, hp - amount);
        if(hpElem) hpElem.value = hp;
        let newPct = (hp / maxHp) * 100;

        let thresholds = [
          parseFloat(document.getElementById(`${prefix}-stagger-1`)?.value) || 0,
          parseFloat(document.getElementById(`${prefix}-stagger-2`)?.value) || 0,
          parseFloat(document.getElementById(`${prefix}-stagger-3`)?.value) || 0
        ].sort((a, b) => b - a);

        thresholds.forEach((th) => {
          if (th > 0 && oldPct > th && newPct <= th) {
            if (isPlayer) {
              pIsStaggeredNextTurn = true;
            } else {
              eIsStaggeredNextTurn = true;
            }
          }
        });
      }
      updateHpDisplay();
    }

    function validateInputs() {
      let ps = document.getElementById('p-sanity');
      let es = document.getElementById('e-sanity');
      if (ps && ps.value === '') ps.value = 0;
      if (es && es.value === '') es.value = 0;
      if (ps && ps.value > 45) ps.value = 45; if (ps && ps.value < -45) ps.value = -45;
      if (es && es.value > 45) es.value = 45; if (es && es.value < -45) es.value = -45;

      ['p', 'e'].forEach(prefix => {
        let maxHpElem = document.getElementById(`${prefix}-max-hp`);
        let hpElem = document.getElementById(`${prefix}-hp`);
        if (maxHpElem && (maxHpElem.value === '' || maxHpElem.value < 1)) maxHpElem.value = 100;
        if (hpElem && hpElem.value === '') hpElem.value = maxHpElem.value;

        [1, 2, 3, 4].forEach(num => {
          let coinsElem = document.getElementById(`${prefix}-s${num}-coins`);
          if (coinsElem) {
            if (coinsElem.value > 9) coinsElem.value = 9;
            if (coinsElem.value < 1 || coinsElem.value === '') coinsElem.value = 1;
          }
          let baseElem = document.getElementById(`${prefix}-s${num}-base`);
          if (baseElem && baseElem.value === '') baseElem.value = 0;
          let cpElem = document.getElementById(`${prefix}-s${num}-coinpower`);
          if (cpElem && cpElem.value === '') cpElem.value = 0;
        });

        let egoCoins = document.getElementById(`${prefix}-ego-coins`);
        if (egoCoins && (egoCoins.value < 1 || egoCoins.value > 5)) egoCoins.value = 1;
      });
    }

      if (isPlayer && pStaggerLevel > 0) return '[STAGGER] 행동 불능';

    function updateMatchupAnalysis() {
      const pInd = document.getElementById('p-matchup');
      const eInd = document.getElementById('e-matchup');
      if(!pInd || !eInd) return;

      if (pStaggerLevel > 0 || eStaggerLevel > 0) {
        pInd.className = 'matchup-indicator balanced';
        pInd.innerText = pStaggerLevel > 0 ? "STAGGER (행동 불능)" : "ONE-SIDED ATTACK";
        eInd.className = 'matchup-indicator balanced';
        eInd.innerText = eStaggerLevel > 0 ? "STAGGER (행동 불능)" : "ONE-SIDED ATTACK";
        return;
      }

      const pType = playerSlots[pSelectedIndex];
      const eType = enemySlots[eSelectedIndex];

      if (pType === 4 || eType === 4 || pType === 5 || eType === 5) {
        pInd.className = 'matchup-indicator balanced';
        pInd.innerText = (pType === 4 || pType === 5) ? "특수 스킬 준비 중" : "공격 판정 중";
        eInd.className = 'matchup-indicator balanced';
        eInd.innerText = (eType === 4 || eType === 5) ? "특수 스킬 준비 중" : "공격 판정 중";
        return;
      }

      const pSanity = parseInt(document.getElementById('p-sanity')?.value) || 0;
      const eSanity = parseInt(document.getElementById('e-sanity')?.value) || 0;
      const pChance = calculateHeadsChance(pSanity) / 100;
      const eChance = calculateHeadsChance(eSanity) / 100;

      const pCoins = getSkillCoins(true, pType);
      const pBase = getSkillBasePower(true, pType);
      const pCP = getSkillCoinPower(true, pType);

      const eCoins = getSkillCoins(false, eType);
      const eBase = getSkillBasePower(false, eType);
      const eCP = getSkillCoinPower(false, eType);

      const diff = (pBase + (pCoins * pChance * pCP)) - (eBase + (eCoins * eChance * eCP));

      let pStatus = "", eStatus = "", pClass = "", eClass = "";
      if (diff >= 4.0) { pStatus = "VERY ADVANTAGE"; eStatus = "VERY DISADVANTAGE"; pClass = "very-advantage"; eClass = "very-disadvantage"; }
      else if (diff >= 1.5) { pStatus = "ADVANTAGE"; eStatus = "DISADVANTAGE"; pClass = "advantage"; eClass = "disadvantage"; }
      else if (diff <= -4.0) { pStatus = "VERY DISADVANTAGE"; eStatus = "VERY ADVANTAGE"; pClass = "very-disadvantage"; eClass = "very-advantage"; }
      else if (diff <= -1.5) { pStatus = "DISADVANTAGE"; eStatus = "ADVANTAGE"; pClass = "disadvantage"; eClass = "advantage"; }
      else { pStatus = "BALANCED"; eStatus = "BALANCED"; pClass = "balanced"; eClass = "balanced"; }

      pInd.className = `matchup-indicator ${pClass}`; pInd.innerText = pStatus;
      eInd.className = `matchup-indicator ${eClass}`; eInd.innerText = eStatus;
    }

    function startMatch() {
      validateInputs();
      pShield = 0; eShield = 0;
      updateHpDisplay();

      const clashBtn = document.getElementById('clash-btn');
      const roundBadge = document.getElementById('clash-round-badge');
      if(clashBtn) clashBtn.disabled = true;
      if(roundBadge) roundBadge.style.display = 'block';

      // 턴 시작 시 이번 턴에 흐트러짐 상태가 적용되어 있다면 즉시 일방 공격 수행
      if (pStaggerLevel > 0 || eStaggerLevel > 0) {
        runStaggerOneSidedAttack();
        return;
      }

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];
      const isPDef = (pUsedType === 4);
      const isEDef = (eUsedType === 4);

      if (isPDef || isEDef) {
        runSequentialDefense(isPDef, isEDef);
        return;
      }

      const pTotal = getSkillCoins(true, pUsedType);
      const eTotal = getSkillCoins(false, eUsedType);
      pRemCoins = pTotal;
      eRemCoins = eTotal;
      pCoinStates = new Array(pTotal).fill('none');
      eCoinStates = new Array(eTotal).fill('none');
      currentClashRound = 1;

      runClashRound();
    }

    function runStaggerOneSidedAttack() {
      const roundBadge = document.getElementById('clash-round-badge');
      if(roundBadge) roundBadge.innerText = 'STAGGER ATTACK (행동 불능)';

      const isPlayerStaggered = pStaggerLevel > 0;
      const attackerIsPlayer = !isPlayerStaggered;
      const attackType = attackerIsPlayer ? playerSlots[pSelectedIndex] : enemySlots[eSelectedIndex];
      
      const coinsCount = getSkillCoins(attackerIsPlayer, attackType);
      const basePower = getSkillBasePower(attackerIsPlayer, attackType);
      const coinPower = getSkillCoinPower(attackerIsPlayer, attackType);
      const sanity = parseInt(document.getElementById(attackerIsPlayer ? 'p-sanity' : 'e-sanity')?.value) || 0;
      const chance = calculateHeadsChance(sanity);

      let HTML = '';
      for (let i = 0; i < coinsCount; i++) HTML += `<div class="coin flipping" id="${attackerIsPlayer ? 'p' : 'e'}-coin-${i}"></div>`;

      if (attackerIsPlayer) {
        const pTag = document.getElementById('p-result-skill-tag');
        const pCoinsStage = document.getElementById('p-coins-stage');
        if(pTag) pTag.innerHTML = `<span class="skill-badge ${attackType===5?'ego':('s'+attackType)}">${getSkillName(true, attackType)}</span>`;
        if(pCoinsStage) pCoinsStage.innerHTML = HTML;
      } else {
        const eTag = document.getElementById('e-result-skill-tag');
        const eCoinsStage = document.getElementById('e-coins-stage');
        if(eTag) eTag.innerHTML = `<span class="skill-badge ${attackType===5?'ego':('s'+attackType)}">${getSkillName(false, attackType)}</span>`;
        if(eCoinsStage) eCoinsStage.innerHTML = HTML;
      }

      playSFX('spin');

      let step = 0;
      let interval = setInterval(() => {
        if (step < coinsCount) {
          let isHeads = Math.random() * 100 < chance;
          let coinDmg = basePower + (isHeads ? coinPower : 0);
          
          let elem = document.getElementById(`${attackerIsPlayer ? 'p' : 'e'}-coin-${step}`);
          if (elem) {
            elem.className = `coin ${isHeads ? 'heads' : 'tails'} win-glow`;
            elem.innerHTML = `<span class="coin-sub">${coinDmg}</span>`;
            playSFX(isHeads ? 'heads' : 'tails');
          }

          applyDamage(isPlayerStaggered, coinDmg, false);

          const statusText = document.getElementById('clash-status-text');
          if(statusText) {
            statusText.innerHTML = `
              <div class="result-banner ${attackerIsPlayer ? 'player' : 'enemy'}">STAGGERED ONE-SIDED STRIKE (${step + 1}/${coinsCount})</div>
              <div style="font-size:0.9rem; color:#ff3322;">흐트러져서 행동 불가! 상대의 일방 공격 ${coinDmg} 피격!</div>
            `;
          }

          step++;
        } else {
          clearInterval(interval);
          setTimeout(() => { finishMatch(); }, 1200);
        }
      }, 500);
    }

    function runSequentialDefense(isPDef, isEDef) {
      const roundBadge = document.getElementById('clash-round-badge');
      if(roundBadge) roundBadge.innerText = 'DEFENSE PHASE';

      const pSanity = parseInt(document.getElementById('p-sanity')?.value) || 0;
      const eSanity = parseInt(document.getElementById('e-sanity')?.value) || 0;
      const pChance = calculateHeadsChance(pSanity);
      const eChance = calculateHeadsChance(eSanity);

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      const pBase = getSkillBasePower(true, pUsedType);
      const pCP = getSkillCoinPower(true, pUsedType);
      const pCoinsCount = getSkillCoins(true, pUsedType);

      const eBase = getSkillBasePower(false, eUsedType);
      const eCP = getSkillCoinPower(false, eUsedType);
      const eCoinsCount = getSkillCoins(false, eUsedType);

      let pHTML = '';
      for (let i = 0; i < pCoinsCount; i++) pHTML += `<div class="coin flipping" id="p-coin-${i}"></div>`;
      let eHTML = '';
      for (let i = 0; i < eCoinsCount; i++) eHTML += `<div class="coin flipping" id="e-coin-${i}"></div>`;

      const pTag = document.getElementById('p-result-skill-tag');
      const pCountText = document.getElementById('p-result-count-text');
      const pPowerScore = document.getElementById('p-power-score');
      const pCoinsStage = document.getElementById('p-coins-stage');

      if(pTag) pTag.innerHTML = `<span class="skill-badge ${pUsedType===5?'ego':('s'+pUsedType)}">${getSkillName(true, pUsedType)}</span>`;
      if(pCountText) pCountText.innerText = '수비 진행 중...';
      if(pPowerScore) pPowerScore.innerText = 'POWER: -';
      if(pCoinsStage) pCoinsStage.innerHTML = pHTML;

      const eTag = document.getElementById('e-result-skill-tag');
      const eCountText = document.getElementById('e-result-count-text');
      const ePowerScore = document.getElementById('e-power-score');
      const eCoinsStage = document.getElementById('e-coins-stage');

      if(eTag) eTag.innerHTML = `<span class="skill-badge ${eUsedType===5?'ego':('s'+eUsedType)}">${getSkillName(false, eUsedType)}</span>`;
      if(eCountText) eCountText.innerText = '진행 중...';
      if(ePowerScore) ePowerScore.innerText = 'POWER: -';
      if(eCoinsStage) eCoinsStage.innerHTML = eHTML;

      let step = 0;
      let maxSteps = Math.max(pCoinsCount, eCoinsCount);
      let pRolls = [];
      let eRolls = [];

      for (let i = 0; i < pCoinsCount; i++) {
        let isHeads = Math.random() * 100 < pChance;
        let val = pBase + (isHeads ? pCP : 0);
        pRolls.push({ isHeads, val });
      }

      for (let i = 0; i < eCoinsCount; i++) {
        let isHeads = Math.random() * 100 < eChance;
        let val = eBase + (isHeads ? eCP : 0);
        eRolls.push({ isHeads, val });
      }

      if (pUsedType === 4 && document.getElementById('p-s4-type')?.value === 'guard') {
        pShield = pRolls.reduce((acc, cur) => acc + cur.val, 0);
      }
      if (eUsedType === 4 && document.getElementById('e-s4-type')?.value === 'guard') {
        eShield = eRolls.reduce((acc, cur) => acc + cur.val, 0);
      }
      updateHpDisplay();

      playSFX('spin');

      let interval = setInterval(() => {
        if (step < pCoinsCount) {
          let r = pRolls[step];
          let elem = document.getElementById(`p-coin-${step}`);
          if (elem) {
            elem.className = `coin ${r.isHeads ? 'heads' : 'tails'}`;
            elem.innerHTML = `<span class="coin-sub">${r.val}</span>`;
            playSFX(r.isHeads ? 'heads' : 'tails');
          }
        }

        if (step < eCoinsCount) {
          let r = eRolls[step];
          let elem = document.getElementById(`e-coin-${step}`);
          if (elem) {
            elem.className = `coin ${r.isHeads ? 'heads' : 'tails'}`;
            elem.innerHTML = `<span class="coin-sub">${r.val}</span>`;
            playSFX(r.isHeads ? 'heads' : 'tails');
          }
        }

        step++;
        if (step >= maxSteps) {
          clearInterval(interval);
          setTimeout(() => { finishMatch(); }, 1600);
        }
      }, 500);
    }

    function runClashRound() {
      const pSanity = parseInt(document.getElementById('p-sanity')?.value) || 0;
      const pChance = calculateHeadsChance(pSanity);
      const eSanity = parseInt(document.getElementById('e-sanity')?.value) || 0;
      const eChance = calculateHeadsChance(eSanity);

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      const pTotalMax = getSkillCoins(true, pUsedType);
      const eTotalMax = getSkillCoins(false, eUsedType);
      const pBase = getSkillBasePower(true, pUsedType);
      const pCP = getSkillCoinPower(true, pUsedType);
      const eBase = getSkillBasePower(false, eUsedType);
      const eCP = getSkillCoinPower(false, eUsedType);

      const roundBadge = document.getElementById('clash-round-badge');
      const statusText = document.getElementById('clash-status-text');
      if(roundBadge) roundBadge.innerText = `ROUND ${currentClashRound}`;
      if(statusText) statusText.innerHTML = `<span style="color: var(--accent-color); font-weight: bold;">ROUND ${currentClashRound} CLASHING...</span>`;
      document.querySelectorAll('.coin').forEach(c => c.classList.remove('win-glow'));

      playSFX('spin');

      let playerRolls = [], playerHeads = 0, activePIndices = [];
      for (let i = 0; i < pTotalMax; i++) {
        if (!pCoinStates[i].startsWith('broken')) {
          activePIndices.push(i);
          const roll = Math.random() * 100;
          const isHeads = roll < pChance;
          if (isHeads) playerHeads++;
          playerRolls.push({ isHeads, roll: roll.toFixed(1) });
        }
      }

      let enemyRolls = [], enemyHeads = 0, activeEIndices = [];
      for (let i = 0; i < eTotalMax; i++) {
        if (!eCoinStates[i].startsWith('broken')) {
          activeEIndices.push(i);
          const roll = Math.random() * 100;
          const isHeads = roll < eChance;
          if (isHeads) enemyHeads++;
          enemyRolls.push({ isHeads, roll: roll.toFixed(1) });
        }
      }

      const playerFinalPower = pBase + (playerHeads * pCP);
      const enemyFinalPower = eBase + (enemyHeads * eCP);

      let pHTML = '';
      for (let i = 0; i < pTotalMax; i++) {
        pHTML += pCoinStates[i].startsWith('broken') ? `<div class="coin ${pCoinStates[i]}"></div>` : `<div class="coin flipping" id="p-coin-${i}"></div>`;
      }
      let eHTML = '';
      for (let i = 0; i < eTotalMax; i++) {
        eHTML += eCoinStates[i].startsWith('broken') ? `<div class="coin ${eCoinStates[i]}"></div>` : `<div class="coin flipping" id="e-coin-${i}"></div>`;
      }

      const pTag = document.getElementById('p-result-skill-tag');
      const pCountText = document.getElementById('p-result-count-text');
      const pPowerScore = document.getElementById('p-power-score');
      const pCoinsStage = document.getElementById('p-coins-stage');

      if(pTag) pTag.innerHTML = `<span class="skill-badge ${pUsedType===5?'ego':('s'+pUsedType)}">${getSkillName(true, pUsedType)}</span>`;
      if(pCountText) pCountText.innerText = '판정 중...';
      if(pPowerScore) pPowerScore.innerText = 'POWER: -';
      if(pCoinsStage) pCoinsStage.innerHTML = pHTML;

      const eTag = document.getElementById('e-result-skill-tag');
      const eCountText = document.getElementById('e-result-count-text');
      const ePowerScore = document.getElementById('e-power-score');
      const eCoinsStage = document.getElementById('e-coins-stage');

      if(eTag) eTag.innerHTML = `<span class="skill-badge ${eUsedType===5?'ego':('s'+eUsedType)}">${getSkillName(false, eUsedType)}</span>`;
      if(eCountText) eCountText.innerText = '판정 중...';
      if(ePowerScore) ePowerScore.innerText = 'POWER: -';
      if(eCoinsStage) eCoinsStage.innerHTML = eHTML;

      const maxStep = Math.max(activePIndices.length, activeEIndices.length);
      const fixedTotalDuration = 500;

      for (let i = 0; i < maxStep; i++) {
        setTimeout(() => {
          if (i < activePIndices.length) {
            const coinIdx = activePIndices[i];
            const pElem = document.getElementById(`p-coin-${coinIdx}`);
            if (pElem) {
              const res = playerRolls[i];
              pCoinStates[coinIdx] = res.isHeads ? 'heads' : 'tails';
              pElem.className = `coin ${res.isHeads ? 'heads' : 'tails'}`;
              pElem.innerHTML = `<span class="coin-sub">${res.roll}%</span>`;
              playSFX(res.isHeads ? 'heads' : 'tails');
            }
          }
          if (i < activeEIndices.length) {
            const coinIdx = activeEIndices[i];
            const eElem = document.getElementById(`e-coin-${coinIdx}`);
            if (eElem) {
              const res = enemyRolls[i];
              eCoinStates[coinIdx] = res.isHeads ? 'heads' : 'tails';
              eElem.className = `coin ${res.isHeads ? 'heads' : 'tails'}`;
              eElem.innerHTML = `<span class="coin-sub">${res.roll}%</span>`;
              playSFX(res.isHeads ? 'heads' : 'tails');
            }
          }
        }, fixedTotalDuration);
      }

      setTimeout(() => {
        if(pCountText) pCountText.innerText = `HEADS ${playerHeads} / ${pRemCoins}`;
        if(eCountText) eCountText.innerText = `HEADS ${enemyHeads} / ${eRemCoins}`;
        if(pPowerScore) pPowerScore.innerText = `POWER: ${playerFinalPower}`;
        if(ePowerScore) ePowerScore.innerText = `POWER: ${enemyFinalPower}`;

        triggerSparks();

        if (playerFinalPower === enemyFinalPower) {
          if(statusText) statusText.innerHTML = `<div class="result-banner clash">DRAW (RE-TRY)</div>`;
          currentClashRound++; 
          setTimeout(() => { runClashRound(); }, 400);

        } else if (playerFinalPower > enemyFinalPower) {
          const breakCoinIdx = activeEIndices[activeEIndices.length - 1];
          const breakTarget = document.getElementById(`e-coin-${breakCoinIdx}`);
          triggerShatterEffect(breakTarget);
          
          const isHeadsTarget = eCoinStates[breakCoinIdx] === 'heads';
          eCoinStates[breakCoinIdx] = isHeadsTarget ? 'broken-heads' : 'broken-tails';
          if (breakTarget) { breakTarget.className = `coin ${eCoinStates[breakCoinIdx]}`; breakTarget.innerHTML = ''; }

          eRemCoins--;

          if (eRemCoins > 0) {
            if(statusText) statusText.innerHTML = `<div class="result-banner player">CLASH WIN</div>`;
            currentClashRound++; 
            setTimeout(() => { runClashRound(); }, 500);
          } else {
            if(statusText) statusText.innerHTML = `<div class="result-banner player">PLAYER WIN (ONE-SIDED ATTACK)</div>`;
            
            let activeWins = activePIndices.filter(idx => !pCoinStates[idx].startsWith('broken'));
            let hitIndex = 0;

            let hitInterval = setInterval(() => {
              if (hitIndex < activeWins.length) {
                let idx = activeWins[hitIndex];
                let elem = document.getElementById(`p-coin-${idx}`);
                if (elem) elem.classList.add('win-glow');

                let coinDmg = pBase + (pCoinStates[idx] === 'heads' ? pCP : 0);
                applyDamage(false, coinDmg, false);

                if(statusText) {
                  statusText.innerHTML = `
                    <div class="result-banner player">SEQUENTIAL STRIKE (${hitIndex + 1}/${activeWins.length})</div>
                    <div style="font-size:0.9rem; color:#38ef7d;">적에게 ${coinDmg} 데미지 타격!</div>
                  `;
                }
                hitIndex++;
              } else {
                clearInterval(hitInterval);
                setTimeout(() => { finishMatch(); }, 1000);
              }
            }, 400);
          }

        } else {
          const breakCoinIdx = activePIndices[activePIndices.length - 1];
          const breakTarget = document.getElementById(`p-coin-${breakCoinIdx}`);
          triggerShatterEffect(breakTarget);

          const isHeadsTarget = pCoinStates[breakCoinIdx] === 'heads';
          pCoinStates[breakCoinIdx] = isHeadsTarget ? 'broken-heads' : 'broken-tails';
          if (breakTarget) { breakTarget.className = `coin ${pCoinStates[breakCoinIdx]}`; breakTarget.innerHTML = ''; }

          pRemCoins--;

          if (pRemCoins > 0) {
            if(statusText) statusText.innerHTML = `<div class="result-banner enemy">CLASH LOSE</div>`;
            currentClashRound++; 
            setTimeout(() => { runClashRound(); }, 500);
          } else {
            if(statusText) statusText.innerHTML = `<div class="result-banner enemy">ENEMY WIN (ONE-SIDED ATTACK)</div>`;
            
            let activeWins = activeEIndices.filter(idx => !eCoinStates[idx].startsWith('broken'));
            let hitIndex = 0;

            let hitInterval = setInterval(() => {
              if (hitIndex < activeWins.length) {
                let idx = activeWins[hitIndex];
                let elem = document.getElementById(`e-coin-${idx}`);
                if (elem) elem.classList.add('win-glow');

                let coinDmg = eBase + (eCoinStates[idx] === 'heads' ? eCP : 0);
                applyDamage(true, coinDmg, false);

                if(statusText) {
                  statusText.innerHTML = `
                    <div class="result-banner enemy">ENEMY STRIKE (${hitIndex + 1}/${activeWins.length})</div>
                    <div style="font-size:0.9rem; color:#ff3322;">아군에게 ${coinDmg} 피격!</div>
                  `;
                }
                hitIndex++;
              } else {
                clearInterval(hitInterval);
                setTimeout(() => { finishMatch(); }, 1000);
              }
            }, 400);
          }
        }
      }, fixedTotalDuration + 100);
    }

    function finishMatch() {
      // 턴이 끝났으므로 예약되었던 다음 턴 흐트러짐 상태를 실제로 발동 시킴
      if (pIsStaggeredNextTurn) {
        pStaggerLevel = Math.min(3, pStaggerLevel + 1);
        pIsStaggeredNextTurn = false;
      } else {
        // 흐트러짐 상태에서 무사히 턴을 넘겼다면 흐트러짐 해제
        pStaggerLevel = 0;
      }

      if (eIsStaggeredNextTurn) {
        eStaggerLevel = Math.min(3, eStaggerLevel + 1);
        eIsStaggeredNextTurn = false;
      } else {
        eStaggerLevel = 0;
      }

      if (playerSlots[pSelectedIndex] === 5) playerSlots[pSelectedIndex] = 2;
      if (enemySlots[eSelectedIndex] === 5) enemySlots[eSelectedIndex] = 2;
      
      const pEgoBtn = document.getElementById('p-ego-btn');
      const eEgoBtn = document.getElementById('e-ego-btn');
      if(pEgoBtn) pEgoBtn.classList.remove('active');
      if(eEgoBtn) eEgoBtn.classList.remove('active');

      playerSlots[pSelectedIndex] = playerNext;
      enemySlots[eSelectedIndex] = enemyNext;
      playerNext = drawNextSkill(true);
      enemyNext = drawNextSkill(false);
      renderSlots();
      
      const clashBtn = document.getElementById('clash-btn');
      if(clashBtn) clashBtn.disabled = false;
    }

    initTheme();
    playerNext = drawNextSkill(true);
    enemyNext = drawNextSkill(false);
    updatePresetDropdowns();
    updateInfo();
  </script>
</body>

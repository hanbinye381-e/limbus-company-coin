<!DOCTYPE html>
<html lang="ko" data-theme="limbus">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG 중앙 코인 대결 시뮬레이터</title>
  <!-- 구글 폰트 불러오기: Oswald (Limbus) & Cinzel Decorative / Cinzel (Ruina) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;800&family=Oswald:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* 림버스 컴퍼니 테마 */
    :root[data-theme="limbus"] {
      --font-title: 'Oswald', 'Noto Sans KR', sans-serif;
      --font-body: 'Noto Sans KR', sans-serif;
      --bg-color: #070709;
      --card-bg: #111116;
      --sub-card-bg: #0a0a0d;
      --border-style: 2px solid #3a1518;
      --card-radius: 2px;
      
      --primary-color: #ff2a2a;
      --primary-hover: #d62828;
      --accent-color: #f1b31c;
      --text-color: #e0e0e0;
      
      --title-color: #f1b31c;
      --title-shadow: 0 0 10px rgba(241, 179, 28, 0.4), 0 0 20px rgba(255, 42, 42, 0.3);
      --btn-bg: linear-gradient(180deg, #b81d1d 0%, #680d0d 100%);
      --btn-border: 1px solid #ff4a4a;
      
      --spark-color-1: #f1b31c;
      --spark-color-2: #ff2a2a;
      --glow-filter: drop-shadow(0 0 12px rgba(241, 179, 28, 0.9));
    }

    /* 라이브러리 오브 루이나 테마 */
    :root[data-theme="ruina"] {
      --font-title: 'Cinzel Decorative', 'Cinzel', serif;
      --font-body: 'Cinzel', 'Noto Sans KR', serif;
      --bg-color: #04070d;
      --card-bg: #09101d;
      --sub-card-bg: #050a14;
      --border-style: 2px double #cba153;
      --card-radius: 0px;
      
      --primary-color: #38ef7d;
      --primary-hover: #11998e;
      --accent-color: #4deeea;
      --text-color: #eaeef6;
      
      --title-color: #4deeea;
      --title-shadow: 0 0 12px rgba(77, 238, 234, 0.6), 0 0 24px rgba(203, 161, 83, 0.4);
      --btn-bg: linear-gradient(180deg, #0f2b48 0%, #061526 100%);
      --btn-border: 1px solid #cba153;
      
      --spark-color-1: #4deeea;
      --spark-color-2: #cba153;
      --glow-filter: drop-shadow(0 0 14px rgba(77, 238, 234, 0.9));
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem 2rem;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }
    
    .main-wrapper {
      width: 100%;
      max-width: 1800px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: var(--border-style);
    }

    h1 {
      font-family: var(--font-title);
      font-size: 1.9rem;
      margin: 0;
      color: var(--title-color);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: var(--title-shadow);
      transition: all 0.3s;
    }

    .theme-select-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 0.4rem 0.9rem;
      border-radius: var(--card-radius);
      border: var(--border-style);
    }
    .theme-select-box label {
      margin: 0;
      font-size: 0.85rem;
      color: #aaa;
      letter-spacing: 1px;
    }
    .theme-select-box select {
      padding: 0.3rem 0.6rem;
      font-size: 0.85rem;
      width: auto;
      font-family: var(--font-body);
      background: var(--sub-card-bg);
      color: var(--text-color);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .battle-layout {
      display: grid;
      grid-template-columns: 420px 1fr 420px;
      gap: 1.8rem;
      align-items: start;
    }

    @media (max-width: 1200px) {
      .battle-layout {
        grid-template-columns: 1fr;
      }
    }

    .side-box {
      background: var(--card-bg);
      padding: 1.4rem;
      border-radius: var(--card-radius);
      border: var(--border-style);
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      transition: all 0.3s;
    }

    .side-title {
      font-family: var(--font-title);
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .player .side-title { color: #38ef7d; }
    .enemy .side-title { color: #ff2a2a; }

    .slot-container {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      border-radius: var(--card-radius);
      padding: 0.8rem;
      margin-bottom: 0.9rem;
      text-align: center;
    }
    .slot-header {
      font-size: 0.75rem;
      color: #888892;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .slots-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
    }
    .next-box {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px dashed rgba(255,255,255,0.15);
      font-size: 0.75rem;
      color: var(--accent-color);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .matchup-indicator {
      margin-top: 0.7rem;
      padding: 0.45rem;
      border-radius: var(--card-radius);
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      background: var(--card-bg);
      border: var(--border-style);
    }
    .matchup-indicator.very-advantage { color: #38ef7d; border-color: #38ef7d; background: rgba(56, 239, 125, 0.05); }
    .matchup-indicator.advantage { color: #70a1ff; border-color: #1e90ff; background: rgba(112, 161, 255, 0.05); }
    .matchup-indicator.balanced { color: var(--accent-color); border-color: var(--accent-color); background: rgba(241, 179, 28, 0.05); }
    .matchup-indicator.disadvantage { color: #ff6b81; border-color: #ff2a2a; background: rgba(255, 42, 42, 0.05); }
    .matchup-indicator.very-disadvantage { color: #ff2a2a; background: rgba(255, 42, 42, 0.1); border-color: #ff2a2a; }

    .skill-badge {
      padding: 0.45rem 0.8rem;
      border-radius: var(--card-radius);
      font-weight: bold;
      font-size: 0.8rem;
      background: #141418;
      color: #fff;
      border: 1px solid #333340;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .skill-badge:hover { transform: translateY(-2px); border-color: #777; }
    .skill-badge.s1 { background: #0d1829; color: #70a1ff; border-color: #1f3b6e; }
    .skill-badge.s2 { background: #121330; color: #9aa8df; border-color: #2e3875; }
    .skill-badge.s3 { background: #2e0a11; color: #ff94a0; border-color: #6e1f2d; }
    
    .skill-badge.selected {
      border-color: var(--accent-color) !important;
      box-shadow: 0 0 10px var(--accent-color);
      transform: scale(1.04);
    }
    .skill-badge.next-badge {
      cursor: default;
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      opacity: 0.9;
    }

    .skill-config-box {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 0.8rem;
      border-radius: var(--card-radius);
      margin-bottom: 0.9rem;
    }
    .skill-config-title {
      font-size: 0.75rem;
      color: #888892;
      margin-bottom: 0.6rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .config-card {
      background: var(--card-bg);
      border: var(--border-style);
      padding: 0.5rem 0.3rem;
      border-radius: var(--card-radius);
      text-align: center;
    }
    .config-card label {
      font-size: 0.65rem;
      color: #9999a6;
      display: block;
      margin-bottom: 2px;
      margin-top: 4px;
    }
    .config-card label:first-child { margin-top: 0; }
    .config-card input[type="text"], .config-card input[type="number"] {
      font-size: 0.75rem !important;
      padding: 0.25rem !important;
      text-align: center;
      margin-bottom: 2px;
      font-family: var(--font-body);
    }

    .preset-manager {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px dashed rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preset-btn-group {
      display: flex;
      gap: 6px;
    }
    .preset-btn {
      flex: 1;
      padding: 0.4rem;
      font-size: 0.72rem;
      background: #181820;
      color: #ccc;
      border: 1px solid #333344;
      border-radius: var(--card-radius);
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .preset-btn:hover { background: #252532; color: #fff; }

    .coin-preview-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      width: 100%;
      margin-top: 0.6rem;
    }
    .coin-preview-item {
      font-size: 0.65rem;
      padding: 0.3rem;
      border-radius: var(--card-radius);
      background: var(--card-bg);
      color: var(--accent-color);
      text-align: center;
      border: var(--border-style);
      line-height: 1.3;
    }

    .control-group {
      width: 100%;
      margin-bottom: 0.9rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 0.3rem;
      color: #bbbba6;
    }
    input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 0.5rem 0.6rem;
      background: var(--sub-card-bg);
      border: var(--border-style);
      color: #fff;
      border-radius: var(--card-radius);
      font-size: 0.85rem;
      font-family: var(--font-body);
      transition: border-color 0.2s;
    }
    input[type="number"]:focus, input[type="text"]:focus, select:focus {
      border-color: var(--accent-color);
      outline: none;
    }
    
    .info-badge {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 0.5rem;
      border-radius: var(--card-radius);
      font-size: 0.8rem;
      margin-top: 0.4rem;
      text-align: center;
      color: #ccc;
    }

    .center-stage {
      position: relative;
      background: var(--card-bg);
      border: var(--border-style);
      padding: 1.8rem;
      border-radius: var(--card-radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      text-align: center;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: all 0.3s;
    }

    button.clash-btn {
      width: 100%;
      padding: 1.1rem;
      font-size: 1.25rem;
      font-weight: bold;
      color: #fff;
      font-family: var(--font-title);
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--btn-bg);
      border: var(--btn-border);
      border-radius: var(--card-radius);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    button.clash-btn:hover { filter: brightness(1.25); transform: translateY(-1px); }
    button.clash-btn:disabled { background: #1c1c24 !important; color: #555; cursor: not-allowed; box-shadow: none; transform: none; border-color: #333; }

    .clash-count-badge {
      font-family: var(--font-title);
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .result-banner {
      font-family: var(--font-title);
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .result-banner.player { color: #38ef7d; text-shadow: 0 0 10px rgba(56, 239, 125, 0.4); }
    .result-banner.enemy { color: #ff2a2a; text-shadow: 0 0 10px rgba(255, 42, 42, 0.4); }
    .result-banner.clash { color: var(--accent-color); text-shadow: 0 0 12px var(--accent-color); animation: clashPulse 0.3s infinite alternate; }

    @keyframes clashPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .center-arena-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.2rem;
      position: relative;
      z-index: 2;
    }

    .side-result-box {
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 1.2rem;
      border-radius: var(--card-radius);
      min-height: 240px;
    }

    .power-score-badge {
      font-family: var(--font-title);
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 4px;
    }

    .coins-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 1rem;
    }

    .coin {
      position: relative;
      width: 64px;
      height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.75rem;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: none !important;
      background-color: transparent !important;
      box-shadow: none !important;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .coin.flipping {
      animation: coinFlip 0.3s infinite linear;
      background-image: url('coin-heads.png');
      filter: brightness(0.9);
    }
    
    .coin.heads {
      background-image: url('coin-heads.png');
      transform: scale(1.05);
      color: transparent;
    }
    
    .coin.tails {
      background-image: url('coin-tails.png');
      transform: scale(1);
      color: transparent;
    }

    .coin.win-glow {
      background-image: url('coin-win.png') !important;
      filter: var(--glow-filter);
      transform: scale(1.12);
      color: transparent;
    }

    .coin.broken-heads {
      background-image: url('coin-broken-heads.png') !important;
      opacity: 0.6;
      transform: scale(0.85);
      animation: coinShatter 0.4s ease-out forwards;
      color: transparent;
    }

    .coin.broken-tails {
      background-image: url('coin-broken-tails.png') !important;
      opacity: 0.6;
      transform: scale(0.85);
      animation: coinShatter 0.4s ease-out forwards;
      color: transparent;
    }

    @keyframes coinShatter {
      0% { transform: scale(1.1) rotate(0deg); opacity: 1; filter: brightness(1.8); }
      30% { transform: scale(1.2) rotate(12deg); }
      100% { transform: scale(0.85) rotate(-8deg); opacity: 0.6; }
    }
    
    @keyframes coinFlip {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }
    .coin-sub {
      position: absolute;
      bottom: -18px;
      font-size: 0.65rem;
      color: #aaa;
      font-weight: normal;
      background: rgba(0,0,0,0.8);
      padding: 1px 4px;
      border-radius: 2px;
      font-family: var(--font-body);
    }

    .spark-container {
      position: absolute;
      top: 55%;
      left: 50%;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 10;
    }
    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px var(--spark-color-1), 0 0 20px var(--spark-color-2);
      animation: sparkFly 0.6s ease-out forwards;
    }
    @keyframes sparkFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
    }

    .shatter-piece {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--accent-color);
      box-shadow: 0 0 8px var(--primary-color);
      animation: shatterFly 0.5s ease-out forwards;
      pointer-events: none;
    }
    @keyframes shatterFly {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--sdx), var(--sdy)) scale(0.1); }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-bar">
      <h1>TRPG COIN CLASH SIMULATOR</h1>

      <div class="theme-select-box">
        <label for="theme-select">THEME:</label>
        <select id="theme-select" onchange="changeTheme(this.value)">
          <option value="limbus">LIMBUS COMPANY</option>
          <option value="ruina">LIBRARY OF RUINA</option>
        </select>
      </div>
    </div>

    <div class="battle-layout">
      <!-- 1. 아군 설정창 -->
      <div class="side-box player">
        <div class="side-title">PLAYER</div>
        
        <div class="slot-container">
          <div class="slot-header">현재 보유 스킬 슬롯 (클릭 선택)</div>
          <div class="slots-wrapper" id="p-slots-display"></div>
          <div class="next-box" id="p-next-display">
            <span>[NEXT]:</span>
            <span class="skill-badge next-badge s1">1스킬</span>
          </div>
          <div class="matchup-indicator balanced" id="p-matchup">상성 분석 중...</div>
        </div>

        <div class="skill-config-box">
          <div class="skill-config-title">스킬 이름 / 위력 / 코인 수 설정</div>
          <div class="config-grid">
            <div class="config-card">
              <label>1스킬 이름</label>
              <input type="text" id="p-s1-name" value="1스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="p-s1-base" value="3" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="p-s1-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="p-s1-coins" value="1" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>2스킬 이름</label>
              <input type="text" id="p-s2-name" value="2스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="p-s2-base" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="p-s2-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="p-s2-coins" value="2" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>3스킬 이름</label>
              <input type="text" id="p-s3-name" value="3스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="p-s3-base" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="p-s3-coinpower" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="p-s3-coins" value="3" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
          </div>
          
          <div class="preset-manager">
            <div class="preset-btn-group">
              <button class="preset-btn" onclick="savePreset(true)">스킬셋 저장</button>
              <button class="preset-btn" onclick="deletePreset(true)">저장 삭제</button>
            </div>
            <select id="p-preset-select" onchange="loadPreset(true)">
              <option value="">-- 저장된 스킬셋 선택 --</option>
            </select>
          </div>

          <div class="coin-preview-box" id="p-coin-preview"></div>
        </div>

        <div class="control-group">
          <label for="p-sanity">정신력 (-45 ~ +45)</label>
          <input type="number" id="p-sanity" value="0" min="-45" max="45" onchange="validateInputs(); updateInfo();">
        </div>

        <div class="info-badge" id="p-info">앞면 확률: 50%</div>
      </div>

      <!-- 2. 중앙 대결 무대 -->
      <div class="center-stage" id="center-stage">
        <div class="spark-container" id="spark-layer"></div>

        <div>
          <button class="clash-btn" id="clash-btn" onclick="startMatch()">START CLASH</button>
          
          <div id="result-box-container" style="margin-top: 1.2rem;">
            <div id="clash-round-badge" class="clash-count-badge" style="display: none;">ROUND 1</div>
            <div id="clash-status-text" style="color: #888; font-size: 1.05rem;">
              좌우 설정창에서 스킬을 선택한 후 합을 진행하세요.
            </div>

            <div class="center-arena-grid">
              <div class="side-result-box">
                <div id="p-result-skill-tag" style="margin-bottom: 0.4rem;"><span class="skill-badge s1">아군 스킬</span></div>
                <div id="p-result-count-text" style="font-size: 0.85rem; color: #aaa;">-</div>
                <div id="p-power-score" class="power-score-badge">-</div>
                <div class="coins-wrapper" id="p-coins-stage"></div>
              </div>

              <div class="side-result-box">
                <div id="e-result-skill-tag" style="margin-bottom: 0.4rem;"><span class="skill-badge s1">적군 스킬</span></div>
                <div id="e-result-count-text" style="font-size: 0.85rem; color: #aaa;">-</div>
                <div id="e-power-score" class="power-score-badge">-</div>
                <div class="coins-wrapper" id="e-coins-stage"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. 적군 설정창 -->
      <div class="side-box enemy">
        <div class="side-title">ENEMY</div>
        
        <div class="slot-container">
          <div class="slot-header">현재 보유 스킬 슬롯 (클릭 선택)</div>
          <div class="slots-wrapper" id="e-slots-display"></div>
          <div class="next-box" id="e-next-display">
            <span>[NEXT]:</span>
            <span class="skill-badge next-badge s1">1스킬</span>
          </div>
          <div class="matchup-indicator balanced" id="e-matchup">상성 분석 중...</div>
        </div>

        <div class="skill-config-box">
          <div class="skill-config-title">스킬 이름 / 위력 / 코인 수 설정</div>
          <div class="config-grid">
            <div class="config-card">
              <label>1스킬 이름</label>
              <input type="text" id="e-s1-name" value="1스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="e-s1-base" value="3" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="e-s1-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="e-s1-coins" value="1" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>2스킬 이름</label>
              <input type="text" id="e-s2-name" value="2스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="e-s2-base" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="e-s2-coinpower" value="4" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="e-s2-coins" value="2" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
            <div class="config-card">
              <label>3스킬 이름</label>
              <input type="text" id="e-s3-name" value="3스킬" onchange="renderSlots()">
              <label>기본 위력</label>
              <input type="number" id="e-s3-base" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 위력</label>
              <input type="number" id="e-s3-coinpower" value="5" onchange="validateInputs(); renderSlots();">
              <label>코인 수</label>
              <input type="number" id="e-s3-coins" value="3" min="1" max="9" onchange="validateInputs(); renderSlots();">
            </div>
          </div>

          <div class="preset-manager">
            <div class="preset-btn-group">
              <button class="preset-btn" onclick="savePreset(false)">스킬셋 저장</button>
              <button class="preset-btn" onclick="deletePreset(false)">저장 삭제</button>
            </div>
            <select id="e-preset-select" onchange="loadPreset(false)">
              <option value="">-- 저장된 스킬셋 선택 --</option>
            </select>
          </div>

          <div class="coin-preview-box" id="e-coin-preview"></div>
        </div>

        <div class="control-group">
          <label for="e-sanity">정신력 (-45 ~ +45)</label>
          <input type="number" id="e-sanity" value="0" min="-45" max="45" onchange="validateInputs(); updateInfo();">
        </div>

        <div class="info-badge" id="e-info">앞면 확률: 50%</div>
      </div>
    </div>
  </div>

  <script>
    const baseCycle = [1, 1, 1, 2, 2, 3];
    let playerPool = [];
    let enemyPool = [];

    let playerSlots = [1, 2];
    let enemySlots = [1, 2];

    let playerNext = 1;
    let enemyNext = 1;

    let pSelectedIndex = 0;
    let eSelectedIndex = 0;

    let currentClashRound = 1;
    let pRemCoins = 0;
    let eRemCoins = 0;
    
    let pCoinStates = [];
    let eCoinStates = [];

    function changeTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('trpg_sim_theme', themeName);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('trpg_sim_theme') || 'limbus';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.getElementById('theme-select').value = savedTheme;
    }

    function calculateHeadsChance(sanity) {
      let s = Number(sanity) || 0;
      let chance = 50 + s;
      if (chance > 95) chance = 95;
      if (chance < 5) chance = 5;
      return chance;
    }

    function validateInputs() {
      let ps = document.getElementById('p-sanity');
      let es = document.getElementById('e-sanity');

      if (ps.value === '') ps.value = 0;
      if (es.value === '') es.value = 0;

      if (ps.value > 45) ps.value = 45;
      if (ps.value < -45) ps.value = -45;
      if (es.value > 45) es.value = 45;
      if (es.value < -45) es.value = -45;

      ['p', 'e'].forEach(prefix => {
        [1, 2, 3].forEach(num => {
          let coinsElem = document.getElementById(`${prefix}-s${num}-coins`);
          if (coinsElem) {
            if (coinsElem.value > 9) coinsElem.value = 9;
            if (coinsElem.value < 1 || coinsElem.value === '') coinsElem.value = 1;
          }
          let baseElem = document.getElementById(`${prefix}-s${num}-base`);
          if (baseElem && baseElem.value === '') baseElem.value = 0;
          let cpElem = document.getElementById(`${prefix}-s${num}-coinpower`);
          if (cpElem && cpElem.value === '') cpElem.value = 0;
        });
      });
    }

    function getSkillName(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const inputVal = document.getElementById(`${prefix}-s${skillType}-name`)?.value;
      return inputVal && inputVal.trim() !== '' ? inputVal : `${skillType}스킬`;
    }

    function getSkillCoins(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const val = parseInt(document.getElementById(`${prefix}-s${skillType}-coins`)?.value);
      return isNaN(val) ? 1 : val;
    }

    function getSkillBasePower(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const val = parseInt(document.getElementById(`${prefix}-s${skillType}-base`)?.value);
      return isNaN(val) ? 0 : val;
    }

    function getSkillCoinPower(isPlayer, skillType) {
      const prefix = isPlayer ? 'p' : 'e';
      const val = parseInt(document.getElementById(`${prefix}-s${skillType}-coinpower`)?.value);
      return isNaN(val) ? 0 : val;
    }

    function drawNextSkill(isPlayer) {
      let pool = isPlayer ? playerPool : enemyPool;
      if (pool.length === 0) {
        pool = [...baseCycle];
      }
      const idx = Math.floor(Math.random() * pool.length);
      const drawn = pool.splice(idx, 1)[0];

      if (isPlayer) playerPool = pool;
      else enemyPool = pool;

      return drawn;
    }

    function updateInfo() {
      validateInputs();
      const pSanity = document.getElementById('p-sanity').value;
      const eSanity = document.getElementById('e-sanity').value;

      document.getElementById('p-info').innerText = `앞면 확률: ${calculateHeadsChance(pSanity)}%`;
      document.getElementById('e-info').innerText = `앞면 확률: ${calculateHeadsChance(eSanity)}%`;

      renderSlots();
    }

    function selectSkill(isPlayer, index) {
      if (isPlayer) pSelectedIndex = index;
      else eSelectedIndex = index;
      renderSlots();
    }

    function savePreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const name = prompt("저장할 스킬 셋의 이름을 입력하세요:", isPlayer ? "아군 프리셋 1" : "적군 프리셋 1");
      if (!name || name.trim() === "") return;

      const presetData = {
        name: name.trim(),
        s1: {
          name: document.getElementById(`${prefix}-s1-name`).value,
          base: document.getElementById(`${prefix}-s1-base`).value,
          cp: document.getElementById(`${prefix}-s1-coinpower`).value,
          coins: document.getElementById(`${prefix}-s1-coins`).value,
        },
        s2: {
          name: document.getElementById(`${prefix}-s2-name`).value,
          base: document.getElementById(`${prefix}-s2-base`).value,
          cp: document.getElementById(`${prefix}-s2-coinpower`).value,
          coins: document.getElementById(`${prefix}-s2-coins`).value,
        },
        s3: {
          name: document.getElementById(`${prefix}-s3-name`).value,
          base: document.getElementById(`${prefix}-s3-base`).value,
          cp: document.getElementById(`${prefix}-s3-coinpower`).value,
          coins: document.getElementById(`${prefix}-s3-coins`).value,
        }
      };

      let presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      presets.push(presetData);
      localStorage.setItem('trpg_skill_presets', JSON.stringify(presets));

      alert("스킬 셋이 저장되었습니다.");
      updatePresetDropdowns();
    }

    function updatePresetDropdowns() {
      const presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      
      ['p', 'e'].forEach(prefix => {
        const select = document.getElementById(`${prefix}-preset-select`);
        const currentVal = select.value;
        select.innerHTML = `<option value="">-- 저장된 스킬셋 선택 --</option>` +
          presets.map((p, idx) => `<option value="${idx}">${p.name}</option>`).join('');
        select.value = currentVal;
      });
    }

    function loadPreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const select = document.getElementById(`${prefix}-preset-select`);
      const idx = select.value;
      if (idx === "") return;

      const presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      const p = presets[idx];
      if (!p) return;

      document.getElementById(`${prefix}-s1-name`).value = p.s1.name;
      document.getElementById(`${prefix}-s1-base`).value = p.s1.base;
      document.getElementById(`${prefix}-s1-coinpower`).value = p.s1.cp;
      document.getElementById(`${prefix}-s1-coins`).value = p.s1.coins;

      document.getElementById(`${prefix}-s2-name`).value = p.s2.name;
      document.getElementById(`${prefix}-s2-base`).value = p.s2.base;
      document.getElementById(`${prefix}-s2-coinpower`).value = p.s2.cp;
      document.getElementById(`${prefix}-s2-coins`).value = p.s2.coins;

      document.getElementById(`${prefix}-s3-name`).value = p.s3.name;
      document.getElementById(`${prefix}-s3-base`).value = p.s3.base;
      document.getElementById(`${prefix}-s3-coinpower`).value = p.s3.cp;
      document.getElementById(`${prefix}-s3-coins`).value = p.s3.coins;

      validateInputs();
      renderSlots();
    }

    function deletePreset(isPlayer) {
      const prefix = isPlayer ? 'p' : 'e';
      const select = document.getElementById(`${prefix}-preset-select`);
      const idx = select.value;
      if (idx === "") {
        alert("삭제할 프리셋을 선택해주세요.");
        return;
      }

      let presets = JSON.parse(localStorage.getItem('trpg_skill_presets') || '[]');
      if (confirm(`'${presets[idx].name}' 스킬셋을 삭제하시겠습니까?`)) {
        presets.splice(idx, 1);
        localStorage.setItem('trpg_skill_presets', JSON.stringify(presets));
        updatePresetDropdowns();
        renderSlots();
      }
    }

    function updateMatchupAnalysis() {
      const pSanity = parseInt(document.getElementById('p-sanity').value) || 0;
      const eSanity = parseInt(document.getElementById('e-sanity').value) || 0;
      
      const pChance = calculateHeadsChance(pSanity) / 100;
      const eChance = calculateHeadsChance(eSanity) / 100;

      const pType = playerSlots[pSelectedIndex];
      const eType = enemySlots[eSelectedIndex];

      const pCoins = getSkillCoins(true, pType);
      const pBase = getSkillBasePower(true, pType);
      const pCP = getSkillCoinPower(true, pType);

      const eCoins = getSkillCoins(false, eType);
      const eBase = getSkillBasePower(false, eType);
      const eCP = getSkillCoinPower(false, eType);

      const pExpectedPower = pBase + (pCoins * pChance * pCP);
      const eExpectedPower = eBase + (eCoins * eChance * eCP);
      const diff = pExpectedPower - eExpectedPower;

      let pStatus = "";
      let eStatus = "";
      let pClass = "";
      let eClass = "";

      if (diff >= 4.0) {
        pStatus = "VERY ADVANTAGE";
        eStatus = "VERY DISADVANTAGE";
        pClass = "very-advantage";
        eClass = "very-disadvantage";
      } else if (diff >= 1.5) {
        pStatus = "ADVANTAGE";
        eStatus = "DISADVANTAGE";
        pClass = "advantage";
        eClass = "disadvantage";
      } else if (diff <= -4.0) {
        pStatus = "VERY DISADVANTAGE";
        eStatus = "VERY ADVANTAGE";
        pClass = "very-disadvantage";
        eClass = "very-advantage";
      } else if (diff <= -1.5) {
        pStatus = "DISADVANTAGE";
        eStatus = "ADVANTAGE";
        pClass = "disadvantage";
        eClass = "advantage";
      } else {
        pStatus = "BALANCED";
        eStatus = "BALANCED";
        pClass = "balanced";
        eClass = "balanced";
      }

      const pIndicator = document.getElementById('p-matchup');
      const eIndicator = document.getElementById('e-matchup');

      pIndicator.className = `matchup-indicator ${pClass}`;
      pIndicator.innerText = pStatus;

      eIndicator.className = `matchup-indicator ${eClass}`;
      eIndicator.innerText = eStatus;
    }

    function renderSlots() {
      const pWrapper = document.getElementById('p-slots-display');
      const eWrapper = document.getElementById('e-slots-display');

      pWrapper.innerHTML = playerSlots.map((s, idx) => {
        const isSelected = idx === pSelectedIndex ? 'selected' : '';
        const name = getSkillName(true, s);
        const coins = getSkillCoins(true, s);
        return `<span class="skill-badge s${s} ${isSelected}" onclick="selectSkill(true, ${idx})">${name} (${coins}C)</span>`;
      }).join('');

      eWrapper.innerHTML = enemySlots.map((s, idx) => {
        const isSelected = idx === eSelectedIndex ? 'selected' : '';
        const name = getSkillName(false, s);
        const coins = getSkillCoins(false, s);
        return `<span class="skill-badge s${s} ${isSelected}" onclick="selectSkill(false, ${idx})">${name} (${coins}C)</span>`;
      }).join('');

      const pNextName = getSkillName(true, playerNext);
      const pNextCoins = getSkillCoins(true, playerNext);
      document.getElementById('p-next-display').innerHTML = `
        <span>[NEXT]:</span>
        <span class="skill-badge next-badge s${playerNext}">${pNextName} (${pNextCoins}C)</span>
      `;

      const eNextName = getSkillName(false, enemyNext);
      const eNextCoins = getSkillCoins(false, enemyNext);
      document.getElementById('e-next-display').innerHTML = `
        <span>[NEXT]:</span>
        <span class="skill-badge next-badge s${enemyNext}">${eNextName} (${eNextCoins}C)</span>
      `;

      document.getElementById('p-coin-preview').innerHTML = [1, 2, 3].map(s => 
        `<div class="coin-preview-item">${getSkillName(true, s)}<br>위력 ${getSkillBasePower(true, s)}+${getSkillCoinPower(true, s)}<br><strong>${getSkillCoins(true, s)} COINS</strong></div>`
      ).join('');

      document.getElementById('e-coin-preview').innerHTML = [1, 2, 3].map(s => 
        `<div class="coin-preview-item">${getSkillName(false, s)}<br>위력 ${getSkillBasePower(false, s)}+${getSkillCoinPower(false, s)}<br><strong>${getSkillCoins(false, s)} COINS</strong></div>`
      ).join('');

      updateMatchupAnalysis();
    }

    function triggerSparks() {
      const layer = document.getElementById('spark-layer');
      layer.innerHTML = '';
      const sparkCount = 45;

      const currentTheme = document.documentElement.getAttribute('data-theme');
      const c1 = currentTheme === 'ruina' ? '#4deeea' : '#f1b31c';
      const c2 = currentTheme === 'ruina' ? '#cba153' : '#ff2a2a';

      for (let i = 0; i < sparkCount; i++) {
        const spark = document.createElement('div');
        spark.className = 'spark';
        const angle = Math.random() * Math.PI * 2;
        const distance = 90 + Math.random() * 180;
        const dx = `${Math.cos(angle) * distance}px`;
        const dy = `${Math.sin(angle) * distance}px`;

        spark.style.setProperty('--dx', dx);
        spark.style.setProperty('--dy', dy);
        spark.style.background = Math.random() > 0.5 ? c1 : c2;

        layer.appendChild(spark);
      }

      setTimeout(() => { layer.innerHTML = ''; }, 750);
    }

    function triggerShatterEffect(targetElem) {
      if (!targetElem) return;
      const rect = targetElem.getBoundingClientRect();
      const stageRect = document.getElementById('center-stage').getBoundingClientRect();

      const cx = rect.left - stageRect.left + rect.width / 2;
      const cy = rect.top - stageRect.top + rect.height / 2;

      const layer = document.getElementById('spark-layer');
      
      for (let i = 0; i < 18; i++) {
        const piece = document.createElement('div');
        piece.className = 'shatter-piece';
        piece.style.left = `${cx}px`;
        piece.style.top = `${cy}px`;

        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 80;
        piece.style.setProperty('--sdx', `${Math.cos(angle) * speed}px`);
        piece.style.setProperty('--sdy', `${Math.sin(angle) * speed}px`);

        layer.appendChild(piece);
      }
    }

    function startMatch() {
      validateInputs();

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      const pTotal = getSkillCoins(true, pUsedType);
      const eTotal = getSkillCoins(false, eUsedType);

      pRemCoins = pTotal;
      eRemCoins = eTotal;

      pCoinStates = new Array(pTotal).fill('none');
      eCoinStates = new Array(eTotal).fill('none');

      currentClashRound = 1;

      document.getElementById('clash-btn').disabled = true;
      document.getElementById('clash-round-badge').style.display = 'block';

      runClashRound();
    }

    function runClashRound() {
      const pSanity = parseInt(document.getElementById('p-sanity').value) || 0;
      const pChance = calculateHeadsChance(pSanity);

      const eSanity = parseInt(document.getElementById('e-sanity').value) || 0;
      const eChance = calculateHeadsChance(eSanity);

      const pUsedType = playerSlots[pSelectedIndex];
      const eUsedType = enemySlots[eSelectedIndex];

      const pTotalMax = getSkillCoins(true, pUsedType);
      const eTotalMax = getSkillCoins(false, eUsedType);

      const pBase = getSkillBasePower(true, pUsedType);
      const pCP = getSkillCoinPower(true, pUsedType);

      const eBase = getSkillBasePower(false, eUsedType);
      const eCP = getSkillCoinPower(false, eUsedType);

      const pSkillName = getSkillName(true, pUsedType);
      const eSkillName = getSkillName(false, eUsedType);

      document.getElementById('clash-round-badge').innerText = `ROUND ${currentClashRound}`;
      document.getElementById('clash-status-text').innerHTML = `<span style="color: var(--accent-color); font-weight: bold;">ROUND ${currentClashRound} CLASHING...</span>`;

      document.querySelectorAll('.coin').forEach(c => c.classList.remove('win-glow'));

      let playerRolls = [];
      let playerHeads = 0;
      let activePIndices = [];

      for (let i = 0; i < pTotalMax; i++) {
        if (!pCoinStates[i].startsWith('broken')) {
          activePIndices.push(i);
          const roll = Math.random() * 100;
          const isHeads = roll < pChance;
          if (isHeads) playerHeads++;
          playerRolls.push({ isHeads, roll: roll.toFixed(1) });
        }
      }

      let enemyRolls = [];
      let enemyHeads = 0;
      let activeEIndices = [];

      for (let i = 0; i < eTotalMax; i++) {
        if (!eCoinStates[i].startsWith('broken')) {
          activeEIndices.push(i);
          const roll = Math.random() * 100;
          const isHeads = roll < eChance;
          if (isHeads) enemyHeads++;
          enemyRolls.push({ isHeads, roll: roll.toFixed(1) });
        }
      }

      const playerFinalPower = pBase + (playerHeads * pCP);
      const enemyFinalPower = eBase + (enemyHeads * eCP);

      let pHTML = '';
      for (let i = 0; i < pTotalMax; i++) {
        if (pCoinStates[i] === 'broken-heads') {
          pHTML += `<div class="coin broken-heads"></div>`;
        } else if (pCoinStates[i] === 'broken-tails') {
          pHTML += `<div class="coin broken-tails"></div>`;
        } else {
          pHTML += `<div class="coin flipping" id="p-coin-${i}"></div>`;
        }
      }

      let eHTML = '';
      for (let i = 0; i < eTotalMax; i++) {
        if (eCoinStates[i] === 'broken-heads') {
          eHTML += `<div class="coin broken-heads"></div>`;
        } else if (eCoinStates[i] === 'broken-tails') {
          eHTML += `<div class="coin broken-tails"></div>`;
        } else {
          eHTML += `<div class="coin flipping" id="e-coin-${i}"></div>`;
        }
      }

      document.getElementById('p-result-skill-tag').innerHTML = `<span class="skill-badge s${pUsedType}">${pSkillName}</span>`;
      document.getElementById('p-result-count-text').innerText = '판정 중...';
      document.getElementById('p-power-score').innerText = 'POWER: -';
      document.getElementById('p-coins-stage').innerHTML = pHTML;

      document.getElementById('e-result-skill-tag').innerHTML = `<span class="skill-badge s${eUsedType}">${eSkillName}</span>`;
      document.getElementById('e-result-count-text').innerText = '판정 중...';
      document.getElementById('e-power-score').innerText = 'POWER: -';
      document.getElementById('e-coins-stage').innerHTML = eHTML;

      const maxStep = Math.max(activePIndices.length, activeEIndices.length);
      
      const initialDuration = 500;
      const minDuration = 50; 
      const speedStep = (initialDuration - minDuration) / 9;
      
      const fixedTotalDuration = Math.max(minDuration, initialDuration - ((currentClashRound - 1) * speedStep));

      for (let i = 0; i < maxStep; i++) {
        setTimeout(() => {
          if (i < activePIndices.length) {
            const coinIdx = activePIndices[i];
            const pElem = document.getElementById(`p-coin-${coinIdx}`);
            if (pElem) {
              const res = playerRolls[i];
              pCoinStates[coinIdx] = res.isHeads ? 'heads' : 'tails';
              pElem.className = `coin ${res.isHeads ? 'heads' : 'tails'}`;
              pElem.innerHTML = `<span class="coin-sub">${res.roll}%</span>`;
            }
          }
          if (i < activeEIndices.length) {
            const coinIdx = activeEIndices[i];
            const eElem = document.getElementById(`e-coin-${coinIdx}`);
            if (eElem) {
              const res = enemyRolls[i];
              eCoinStates[coinIdx] = res.isHeads ? 'heads' : 'tails';
              eElem.className = `coin ${res.isHeads ? 'heads' : 'tails'}`;
              eElem.innerHTML = `<span class="coin-sub">${res.roll}%</span>`;
            }
          }
        }, fixedTotalDuration);
      }

      const totalAnimTime = fixedTotalDuration + Math.max(50, fixedTotalDuration * 0.2);

      setTimeout(() => {
        document.getElementById('p-result-count-text').innerText = `HEADS ${playerHeads} / ${pRemCoins}`;
        document.getElementById('e-result-count-text').innerText = `HEADS ${enemyHeads} / ${eRemCoins}`;

        document.getElementById('p-power-score').innerText = `POWER: ${playerFinalPower}`;
        document.getElementById('e-power-score').innerText = `POWER: ${enemyFinalPower}`;

        triggerSparks();

        if (playerFinalPower === enemyFinalPower) {
          document.getElementById('clash-status-text').innerHTML = `
            <div class="result-banner clash">DRAW (RE-TRY)</div>
            <div style="font-size: 0.9rem; color: var(--accent-color);">동일 위력 (ROUND ${currentClashRound} 종료 -> ROUND ${currentClashRound + 1} 준비)</div>
          `;
          currentClashRound++; 
          setTimeout(() => { runClashRound(); }, Math.max(300, fixedTotalDuration + 200));

        } else if (playerFinalPower > enemyFinalPower) {
          const breakCoinIdx = activeEIndices[activeEIndices.length - 1];
          const breakTarget = document.getElementById(`e-coin-${breakCoinIdx}`);
          
          triggerShatterEffect(breakTarget);
          
          const isHeadsTarget = eCoinStates[breakCoinIdx] === 'heads';
          eCoinStates[breakCoinIdx] = isHeadsTarget ? 'broken-heads' : 'broken-tails';

          if (breakTarget) {
            breakTarget.className = `coin ${eCoinStates[breakCoinIdx]}`;
            breakTarget.innerHTML = '';
          }

          eRemCoins--;

          if (eRemCoins > 0) {
            document.getElementById('clash-status-text').innerHTML = `
              <div class="result-banner player">CLASH WIN</div>
              <div style="font-size: 0.9rem; color: var(--primary-color);">적 코인 파괴 (ROUND ${currentClashRound} 종료 -> ROUND ${currentClashRound + 1} 준비)</div>
            `;
            currentClashRound++; 
            setTimeout(() => { runClashRound(); }, Math.max(350, fixedTotalDuration + 250));
          } else {
            activePIndices.forEach(idx => {
              const elem = document.getElementById(`p-coin-${idx}`);
              if (elem && !pCoinStates[idx].startsWith('broken')) {
                elem.classList.add('win-glow');
              }
            });
            document.getElementById('clash-status-text').innerHTML = `<div class="result-banner player">PLAYER WIN</div>`;
            finishMatch();
          }

        } else {
          const breakCoinIdx = activePIndices[activePIndices.length - 1];
          const breakTarget = document.getElementById(`p-coin-${breakCoinIdx}`);
          
          triggerShatterEffect(breakTarget);

          const isHeadsTarget = pCoinStates[breakCoinIdx] === 'heads';
          pCoinStates[breakCoinIdx] = isHeadsTarget ? 'broken-heads' : 'broken-tails';

          if (breakTarget) {
            breakTarget.className = `coin ${pCoinStates[breakCoinIdx]}`;
            breakTarget.innerHTML = '';
          }

          pRemCoins--;

          if (pRemCoins > 0) {
            document.getElementById('clash-status-text').innerHTML = `
              <div class="result-banner enemy">CLASH LOSE</div>
              <div style="font-size: 0.9rem; color: var(--primary-color);">아군 코인 파괴 (ROUND ${currentClashRound} 종료 -> ROUND ${currentClashRound + 1} 준비)</div>
            `;
            currentClashRound++; 
            setTimeout(() => { runClashRound(); }, Math.max(350, fixedTotalDuration + 250));
          } else {
            activeEIndices.forEach(idx => {
              const elem = document.getElementById(`e-coin-${idx}`);
              if (elem && !eCoinStates[idx].startsWith('broken')) {
                elem.classList.add('win-glow');
              }
            });
            document.getElementById('clash-status-text').innerHTML = `<div class="result-banner enemy">ENEMY WIN</div>`;
            finishMatch();
          }
        }

      }, totalAnimTime);
    }

    function finishMatch() {
      playerSlots[pSelectedIndex] = playerNext;
      enemySlots[eSelectedIndex] = enemyNext;

      playerNext = drawNextSkill(true);
      enemyNext = drawNextSkill(false);

      renderSlots();
      document.getElementById('clash-btn').disabled = false;
    }

    initTheme();
    playerNext = drawNextSkill(true);
    enemyNext = drawNextSkill(false);
    updatePresetDropdowns();
    updateInfo();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" data-theme="limbus">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG 중앙 코인 대결 시뮬레이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Oswald:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* 림버스 컴퍼니 테마 */
    :root[data-theme="limbus"] {
      --font-title: 'Oswald', 'Noto Sans KR', sans-serif;
      --font-body: 'Noto Sans KR', sans-serif;
      --bg-color: #050507;
      --card-bg: linear-gradient(180deg, #181412 0%, #0d0b0a 100%);
      --sub-card-bg: #090807;
      --border-style: 2px solid #8e2a18;
      --card-box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 12px rgba(142, 42, 24, 0.4);
      --card-radius: 0px;
      --primary-color: #ff3322;
      --primary-hover: #d62211;
      --accent-color: #e6a100;
      --text-color: #dcd8d0;
      --title-color: #f0a800;
      --title-shadow: 0 0 8px rgba(240, 168, 0, 0.6), 2px 2px 0px #500000;
      --btn-bg: linear-gradient(180deg, #991c0e 0%, #520902 100%);
      --btn-border: 2px solid #e6a100;
      --spark-color-1: #e6a100;
      --spark-color-2: #ff3322;
      --glow-filter: drop-shadow(0 0 12px rgba(230, 161, 0, 0.9));
      --badge-clip: polygon(15% 0%, 85% 0%, 100% 50%, 85% 100%, 15% 100%, 0% 50%);
    }

    /* 라이브러리 오브 루이나 테마 */
    :root[data-theme="ruina"] {
      --font-title: 'Cinzel', 'Noto Sans KR', serif;
      --font-body: 'Cinzel', 'Noto Sans KR', serif;
      --bg-color: #03060a;
      --card-bg: linear-gradient(180deg, #0a1322 0%, #040810 100%);
      --sub-card-bg: #020509;
      --border-style: 2px double #c59f52;
      --card-box-shadow: inset 0 0 20px rgba(0,0,0,0.95), 0 0 15px rgba(197, 159, 82, 0.3);
      --card-radius: 0px;
      --primary-color: #38ef7d;
      --primary-hover: #11998e;
      --accent-color: #38e8e5;
      --text-color: #eaeff5;
      --title-color: #38e8e5;
      --title-shadow: 0 0 10px rgba(56, 232, 229, 0.7), 0 0 20px rgba(197, 159, 82, 0.5);
      --btn-bg: linear-gradient(180deg, #0e2b47 0%, #051322 100%);
      --btn-border: 2px double #c59f52;
      --spark-color-1: #38e8e5;
      --spark-color-2: #c59f52;
      --glow-filter: drop-shadow(0 0 14px rgba(56, 232, 229, 0.9));
      --badge-clip: none;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem 2rem;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }
    
    .main-wrapper { width: 100%; max-width: 1800px; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: var(--border-style);
    }

    h1 {
      font-family: var(--font-title);
      font-size: 2.1rem;
      margin: 0;
      color: var(--title-color);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: var(--title-shadow);
      transition: all 0.3s;
    }

    .theme-select-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 0.4rem 0.9rem;
      border: var(--border-style);
      box-shadow: var(--card-box-shadow);
    }
    .theme-select-box label { margin: 0; font-size: 0.85rem; color: #aaa; letter-spacing: 1px; }
    .theme-select-box select {
      padding: 0.3rem 0.6rem;
      font-size: 0.85rem;
      width: auto;
      font-family: var(--font-body);
      background: var(--sub-card-bg);
      color: var(--text-color);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .battle-layout {
      display: grid;
      grid-template-columns: 420px 1fr 420px;
      gap: 1.8rem;
      align-items: start;
    }

    @media (max-width: 1200px) { .battle-layout { grid-template-columns: 1fr; } }

    .side-box {
      background: var(--card-bg);
      padding: 1.4rem;
      border: var(--border-style);
      box-shadow: var(--card-box-shadow);
      transition: all 0.3s;
      position: relative;
    }

    .side-title {
      font-family: var(--font-title);
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .player .side-title { color: #38ef7d; text-shadow: 0 0 8px rgba(56, 239, 125, 0.4); }
    .enemy .side-title { color: #ff3322; text-shadow: 0 0 8px rgba(255, 51, 34, 0.4); }

    .slot-container {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 0.8rem;
      margin-bottom: 0.9rem;
      text-align: center;
    }
    .slot-header {
      font-size: 0.75rem;
      color: #888892;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .slots-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      align-items: center;
    }

    .def-toggle-btn {
      padding: 0.4rem 0.6rem;
      font-size: 0.75rem;
      font-weight: bold;
      background: #332211;
      color: #ffaa00;
      border: 1px solid #aa6600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .def-toggle-btn:hover { background: #553311; }
    .def-toggle-btn.active { background: #aa6600; color: #fff; }

    .ego-toggle-btn {
      padding: 0.4rem 0.6rem;
      font-size: 0.75rem;
      font-weight: bold;
      background: #2b0c12;
      color: #ff4466;
      border: 1px solid #aa1133;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      user-select: none;
    }
    .ego-toggle-btn:hover { background: #4a121e; }
    .ego-toggle-btn.active { background: #aa1133; color: #fff; box-shadow: 0 0 10px #ff3355; }
    .ego-progress {
      position: absolute; bottom: 0; left: 0; height: 3px; background: #ff3355; width: 0%;
      transition: width 0.1s linear;
    }

    .skill-badge {
      padding: 0.5rem 0.9rem;
      font-weight: bold;
      font-size: 0.8rem;
      background: #141418;
      color: #fff;
      border: 1px solid #444452;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      clip-path: var(--badge-clip);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .skill-badge:hover { transform: translateY(-2px); border-color: #888; }
    .skill-badge.s1 { background: #0c182b; color: #70a1ff; border-color: #1f3b6e; }
    .skill-badge.s2 { background: #121333; color: #9aa8df; border-color: #2e3875; }
    .skill-badge.s3 { background: #300a12; color: #ff94a0; border-color: #6e1f2d; }
    .skill-badge.s4 { background: #2b200a; color: #ffd166; border-color: #75551f; }
    .skill-badge.ego { background: #3b0514; color: #ff3366; border-color: #b3003b; box-shadow: 0 0 8px rgba(255, 51, 102, 0.5); }
    .skill-badge.selected { border-color: var(--accent-color) !important; box-shadow: 0 0 12px var(--accent-color); transform: scale(1.06); }

    .skill-config-box {
      width: 100%;
      background: var(--sub-card-bg);
      border: var(--border-style);
      padding: 0.8rem;
      margin-bottom: 0.9rem;
    }
    .config-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .config-card { background: var(--card-bg); border: var(--border-style); padding: 0.5rem 0.3rem; text-align: center; }
    .config-card label { font-size: 0.65rem; color: #9999a6; display: block; margin-bottom: 2px; margin-top: 4px; }
    .config-card input, .config-card select { font-size: 0.75rem !important; padding: 0.25rem !important; text-align: center; font-family: var(--font-body); }

    .coins-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-top: 1rem;
      min-height: 85px;
      align-items: center;
    }

    /* 🔥 코인 디자인 및 수치 시각화 핵심 수정 영역 🔥 */
    .coin {
      position: relative;
      width: 65px;
      height: 65px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: var(--font-title);
      font-weight: 900;
      font-size: 1.4rem;
      color: #ffffff !important;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 8px #000;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: none !important;
      background-color: transparent !important;
      transition: transform 0.2s ease-in-out;
      user-select: none;
    }
    .coin.flipping { animation: coinFlip 0.3s infinite linear; background-image: url('images/coin-heads.png'); }
    .coin.heads { background-image: url('images/coin-heads.png'); transform: scale(1.05); }
    .coin.tails { background-image: url('images/coin-tails.png'); transform: scale(1); }
    .coin.win-glow {
      background-image: url('images/coin-win.png') !important;
      filter: var(--glow-filter);
      transform: scale(1.15);
      color: #ffffdd !important;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 10px #ffaa00;
    }
    .coin.broken-heads, .coin.broken-tails {
      background-image: url('images/coin-broken-heads.png') !important;
      opacity: 0.5;
      transform: scale(0.85);
      color: #ff3322 !important;
    }

    .coin-val-main {
      z-index: 3;
      line-height: 1;
      margin-top: -2px;
    }

    .coin-sub {
      position: absolute;
      bottom: -10px;
      font-size: 0.65rem;
      font-weight: bold;
      color: #ffea00;
      background: #000000;
      padding: 1px 5px;
      border: 1px solid var(--accent-color);
      border-radius: 3px;
      font-family: var(--font-body);
      white-space: nowrap;
      z-index: 4;
      text-shadow: none;
      box-shadow: 0 0 6px rgba(0,0,0,0.8);
    }

    @keyframes coinFlip {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }

    .center-stage {
      position: relative; background: var(--card-bg); border: var(--border-style);
      padding: 1.8rem; box-shadow: var(--card-box-shadow); text-align: center;
      min-height: 520px; display: flex; flex-direction: column; justify-content: space-between;
    }

    button.clash-btn {
      width: 100%; padding: 1.1rem; font-size: 1.3rem; font-weight: bold; color: #fff;
      font-family: var(--font-title); letter-spacing: 3px; background: var(--btn-bg);
      border: var(--btn-border); cursor: pointer; transition: all 0.2s;
    }
    button.clash-btn:hover { filter: brightness(1.25); }

    .center-arena-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.2rem; }
    .side-result-box { background: var(--sub-card-bg); border: var(--border-style); padding: 1.2rem; min-height: 240px; }
    .power-score-badge { font-family: var(--font-title); font-size: 1.4rem; font-weight: bold; color: var(--accent-color); margin-top: 4px; }
    .hp-container { margin-bottom: 0.8rem; background: #111; border: 1px solid #444; padding: 4px; position: relative; }
    .hp-bar-bg { width: 100%; height: 16px; background: #222; position: relative; overflow: hidden; }
    .hp-bar-fill { height: 100%; width: 100%; background: #38ef7d; transition: width 0.3s; }
    .hp-bar-fill.enemy-hp { background: #ff3322; }
    .hp-text { font-size: 0.75rem; font-weight: bold; color: #fff; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-bar">
      <h1>TRPG 중앙 코인 대결 시뮬레이터</h1>
      <div class="theme-select-box">
        <label>THEME:</label>
        <select id="theme-select" onchange="changeTheme(this.value)">
          <option value="limbus">LIMBUS COMPANY</option>
          <option value="ruina">LIBRARY OF RUINA</option>
        </select>
      </div>
    </div>

    <div class="battle-layout">
      <!-- 아군 설정 -->
      <div class="side-box player">
        <div class="side-title">PLAYER</div>
        <div class="slot-container">
          <div class="slots-wrapper">
            <div id="p-slots-display" style="display:flex; gap:6px;"></div>
            <button class="def-toggle-btn" id="p-def-btn" onclick="toggleDefenseSlot(true)">수비</button>
          </div>
        </div>

        <div class="skill-config-box">
          <div class="config-grid">
            <div class="config-card"><label>1스킬 기본/코인/개수</label>
              <input type="number" id="p-s1-base" value="3"><input type="number" id="p-s1-coinpower" value="4"><input type="number" id="p-s1-coins" value="1">
            </div>
            <div class="config-card"><label>2스킬 기본/코인/개수</label>
              <input type="number" id="p-s2-base" value="4"><input type="number" id="p-s2-coinpower" value="4"><input type="number" id="p-s2-coins" value="2">
            </div>
            <div class="config-card"><label>3스킬 기본/코인/개수</label>
              <input type="number" id="p-s3-base" value="5"><input type="number" id="p-s3-coinpower" value="5"><input type="number" id="p-s3-coins" value="3">
            </div>
          </div>
          <div style="margin-top:8px;" class="config-card">
            <label style="color:#ffd166; font-weight:bold;">수비 스킬 (4번 슬롯)</label>
            <div style="display:flex; gap:4px; margin-top:4px;">
              <select id="p-s4-type"><option value="guard">방어</option><option value="evade">회피</option><option value="counter">반격</option></select>
              <input type="number" id="p-s4-base" value="10" placeholder="기본">
              <input type="number" id="p-s4-coinpower" value="4" placeholder="코인위력">
              <input type="number" id="p-s4-coins" value="1" placeholder="코인수">
            </div>
          </div>
        </div>

        <div style="display:flex; gap:8px;">
          <div><label>최대 HP</label><input type="number" id="p-max-hp" value="100" onchange="updateHpDisplay()"></div>
          <div><label>현재 HP</label><input type="number" id="p-hp" value="100" onchange="updateHpDisplay()"></div>
          <div><label>정신력</label><input type="number" id="p-sanity" value="0"></div>
        </div>
      </div>

      <!-- 중앙 무대 -->
      <div class="center-stage">
        <div>
          <button class="clash-btn" id="clash-btn" onclick="startMatch()">START CLASH</button>
          <div id="clash-round-badge" style="font-size:1.2rem; color:#e6a100; margin-top:10px; font-weight:bold;">ROUND 1</div>
          <div id="clash-status-text" style="color:#aaa; margin-top:4px;">스킬 및 수비 옵션을 정한 뒤 대결을 실행하세요.</div>

          <div class="center-arena-grid">
            <div class="side-result-box">
              <div class="hp-container">
                <div class="hp-bar-bg"><div class="hp-bar-fill" id="p-hp-bar"></div></div>
                <div class="hp-text" id="p-hp-text">HP: 100 / 100</div>
              </div>
              <div id="p-result-skill-tag"><span class="skill-badge s1">PLAYER</span></div>
              <div id="p-result-count-text" style="font-size:0.85rem; color:#aaa; margin-top:4px;">-</div>
              <div id="p-power-score" class="power-score-badge">-</div>
              <div class="coins-wrapper" id="p-coins-stage"></div>
            </div>

            <div class="side-result-box">
              <div class="hp-container">
                <div class="hp-bar-bg"><div class="hp-bar-fill enemy-hp" id="e-hp-bar"></div></div>
                <div class="hp-text" id="e-hp-text">HP: 100 / 100</div>
              </div>
              <div id="e-result-skill-tag"><span class="skill-badge s1">ENEMY</span></div>
              <div id="e-result-count-text" style="font-size:0.85rem; color:#aaa; margin-top:4px;">-</div>
              <div id="e-power-score" class="power-score-badge">-</div>
              <div class="coins-wrapper" id="e-coins-stage"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 적군 설정 -->
      <div class="side-box enemy">
        <div class="side-title">ENEMY</div>
        <div class="slot-container">
          <div class="slots-wrapper">
            <div id="e-slots-display" style="display:flex; gap:6px;"></div>
            <button class="def-toggle-btn" id="e-def-btn" onclick="toggleDefenseSlot(false)">수비</button>
          </div>
        </div>

        <div class="skill-config-box">
          <div class="config-grid">
            <div class="config-card"><label>1스킬 기본/코인/개수</label>
              <input type="number" id="e-s1-base" value="3"><input type="number" id="e-s1-coinpower" value="4"><input type="number" id="e-s1-coins" value="1">
            </div>
            <div class="config-card"><label>2스킬 기본/코인/개수</label>
              <input type="number" id="e-s2-base" value="4"><input type="number" id="e-s2-coinpower" value="4"><input type="number" id="e-s2-coins" value="2">
            </div>
            <div class="config-card"><label>3스킬 기본/코인/개수</label>
              <input type="number" id="e-s3-base" value="5"><input type="number" id="e-s3-coinpower" value="5"><input type="number" id="e-s3-coins" value="3">
            </div>
          </div>
          <div style="margin-top:8px;" class="config-card">
            <label style="color:#ffd166; font-weight:bold;">수비 스킬 (4번 슬롯)</label>
            <div style="display:flex; gap:4px; margin-top:4px;">
              <select id="e-s4-type"><option value="guard">방어</option><option value="evade">회피</option><option value="counter">반격</option></select>
              <input type="number" id="e-s4-base" value="10" placeholder="기본">
              <input type="number" id="e-s4-coinpower" value="4" placeholder="코인위력">
              <input type="number" id="e-s4-coins" value="1" placeholder="코인수">
            </div>
          </div>
        </div>

        <div style="display:flex; gap:8px;">
          <div><label>최대 HP</label><input type="number" id="e-max-hp" value="100" onchange="updateHpDisplay()"></div>
          <div><label>현재 HP</label><input type="number" id="e-hp" value="100" onchange="updateHpDisplay()"></div>
          <div><label>정신력</label><input type="number" id="e-sanity" value="0"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let playerSlots = [1, 2], enemySlots = [1, 2];
    let pSelectedIndex = 0, eSelectedIndex = 0;

    function renderSlots() {
      document.getElementById('p-slots-display').innerHTML = playerSlots.map((s, idx) => 
        `<span class="skill-badge s${s} ${idx === pSelectedIndex ? 'selected' : ''}" onclick="pSelectedIndex=${idx}; renderSlots();">${s===4?'수비':s+'스킬'}</span>`
      ).join('');
      document.getElementById('e-slots-display').innerHTML = enemySlots.map((s, idx) => 
        `<span class="skill-badge s${s} ${idx === eSelectedIndex ? 'selected' : ''}" onclick="eSelectedIndex=${idx}; renderSlots();">${s===4?'수비':s+'스킬'}</span>`
      ).join('');
    }

    function toggleDefenseSlot(isPlayer) {
      if (isPlayer) {
        playerSlots[1] = playerSlots[1] === 4 ? 2 : 4;
        if (playerSlots[1] === 4) pSelectedIndex = 1;
        document.getElementById('p-def-btn').classList.toggle('active', playerSlots[1] === 4);
      } else {
        enemySlots[1] = enemySlots[1] === 4 ? 2 : 4;
        if (enemySlots[1] === 4) eSelectedIndex = 1;
        document.getElementById('e-def-btn').classList.toggle('active', enemySlots[1] === 4);
      }
      renderSlots();
    }

    function updateHpDisplay() {
      ['p', 'e'].forEach(prefix => {
        let maxHp = parseInt(document.getElementById(`${prefix}-max-hp`).value) || 100;
        let hp = parseInt(document.getElementById(`${prefix}-hp`).value) || 0;
        let pct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
        document.getElementById(`${prefix}-hp-bar`).style.width = `${pct}%`;
        document.getElementById(`${prefix}-hp-text`).innerText = `HP: ${hp} / ${maxHp}`;
      });
    }

    function startMatch() {
      const pIsDef = document.getElementById('p-def-btn').classList.contains('active') || playerSlots[pSelectedIndex] === 4;
      const eIsDef = document.getElementById('e-def-btn').classList.contains('active') || enemySlots[eSelectedIndex] === 4;

      if (pIsDef || eIsDef) {
        runDefensePhase(pIsDef);
      } else {
        runNormalClash();
      }
    }

    /* 수비 페이즈 처리 (코인 위력 수치 중앙 출력 적용) */
    function runDefensePhase(pIsDef) {
      const defPrefix = pIsDef ? 'p' : 'e';
      const atkPrefix = pIsDef ? 'e' : 'p';
      const defSubType = document.getElementById(`${defPrefix}-s4-type`).value;

      const defBase = parseInt(document.getElementById(`${defPrefix}-s4-base`).value) || 0;
      const defCP = parseInt(document.getElementById(`${defPrefix}-s4-coinpower`).value) || 0;
      const defCoins = parseInt(document.getElementById(`${defPrefix}-s4-coins`).value) || 1;

      const atkBase = parseInt(document.getElementById(`${atkPrefix}-s1-base`).value) || 0;
      const atkCP = parseInt(document.getElementById(`${atkPrefix}-s1-coinpower`).value) || 0;
      const atkCoins = parseInt(document.getElementById(`${atkPrefix}-s1-coins`).value) || 1;

      // 수비 코인 생성
      let defRoll = defBase;
      let defCoinsHTML = '';
      for (let i = 0; i < defCoins; i++) {
        let isHeads = Math.random() < 0.5;
        let val = defBase + (isHeads ? defCP : 0);
        defRoll += (isHeads ? defCP : 0);
        defCoinsHTML += `<div class="coin ${isHeads ? 'heads' : 'tails'} win-glow">
            <span class="coin-val-main">${val}</span>
            <span class="coin-sub">${isHeads ? '앞면 (+'+defCP+')' : '뒷면 (+0)'}</span>
          </div>`;
      }
      document.getElementById(`${defPrefix}-coins-stage`).innerHTML = defCoinsHTML;
      document.getElementById(`${defPrefix}-power-score`).innerText = `${defSubType.toUpperCase()}: ${defRoll}`;

      // 공격 코인 순차 계산
      let atkCoinsHTML = '';
      let step = 0;
      let interval = setInterval(() => {
        if (step < atkCoins) {
          let isHeads = Math.random() < 0.5;
          let atkDmg = atkBase + (isHeads ? atkCP : 0);

          let coinClass = (defSubType === 'evade' && defRoll >= atkDmg) ? 'broken-heads' : 'heads win-glow';
          
          atkCoinsHTML += `<div class="coin ${coinClass}">
              <span class="coin-val-main">${atkDmg}</span>
              <span class="coin-sub">공격 ${step + 1}</span>
            </div>`;
          document.getElementById(`${atkPrefix}-coins-stage`).innerHTML = atkCoinsHTML;
          document.getElementById(`${atkPrefix}-power-score`).innerText = `POWER: ${atkDmg}`;
          step++;
        } else {
          clearInterval(interval);
        }
      }, 500);
    }

    function runNormalClash() {
      // 일반 대결 로직 처리 생략 (코인 시각화 구조 동일)
      runDefensePhase(false);
    }

    renderSlots();
    updateHpDisplay();
  </script>
</body>
</html>
